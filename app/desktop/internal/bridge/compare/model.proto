syntax = "proto3";

package bagel.benchmark;
option go_package = "ItsBagelBot/app/desktop/internal/bridge/compare";

enum EventKind {
  UNSPECIFIED = 0;
  CHAT = 1;
  ALERT = 2;
}

message Event {
  uint64 sequence = 1;
  int64 sent_unix_nano = 2;
  EventKind kind = 3;
  ChatEvent chat = 4;
  AlertEvent alert = 5;
}

message ChatEvent {
  string channel_id = 1;
  string user_id = 2;
  string display_name = 3;
  string text = 4;
}

message AlertEvent {
  string kind = 1;
  string name = 2;
  int64 amount = 3;
}
