name: Release stage
description: Run one release train stage against the run state shared through the run's artifacts.

inputs:
  stage:
    description: Stage id to run
    required: true

# Artifacts, not the Actions cache: the repo cache sits over its size limit and evicts entries between jobs.
runs:
  using: composite
  steps:
    - name: Fetch release CLI
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-cli

    # Absent only before the first stage; on a re-run it is the failed attempt's state.
    - name: Fetch run state
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-state

    - name: Run ${{ inputs.stage }}
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: |
        chmod +x release
        changelog=""
        if [ -n "$CHANGELOG" ]; then printf '%s' "$CHANGELOG" > changelog.json; changelog=changelog.json; fi
        ./release -state run.json -stage "$STAGE" -kind "$KIND" -version "$VERSION" \
          -rollback-to "$ROLLBACK_TO" -target-sha "$TARGET_SHA" -prs "$PRS" -services "$SERVICES" \
          -changelog "$changelog" -actor "$ACTOR"

    - name: Save run state
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-state
        path: run.json
        overwrite: true
        if-no-files-found: ignore
        retention-days: 14
