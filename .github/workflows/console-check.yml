name: Console Typecheck

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'console/**'
      - '.github/workflows/console-check.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'console/**'
      - '.github/workflows/console-check.yml'

jobs:
  check:
    name: svelte-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        working-directory: console
        run: bun install --frozen-lockfile

      # Nothing ran `bun run check` in CI until this job existed, which is how a
      # typescript major landed that broke it: the container build runs
      # `bun run build`, and a SvelteKit build does not typecheck. The type
      # errors were only visible to whoever ran the script by hand.
      - name: Typecheck
        working-directory: console
        run: bun run check
