name: Ingress Elixir Pipeline

# Validate the ingress service and its shared Elixir boundaries.
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/twitch/ingress/**'
      - 'pkg/elixir/cowboy/**'
      - 'pkg/elixir/nats/**'
      - 'pkg/elixir/startup/**'
      - 'pkg/elixir/new_relic/**'
      - 'pkg/elixir/valkey/**'
      - 'pkg/elixir/sift/**'
      - 'pkg/elixir/websocket/**'
      - 'pkg/elixir/boundary/**'
      - '.github/workflows/ingress.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'app/twitch/ingress/**'
      - 'pkg/elixir/cowboy/**'
      - 'pkg/elixir/nats/**'
      - 'pkg/elixir/startup/**'
      - 'pkg/elixir/new_relic/**'
      - 'pkg/elixir/valkey/**'
      - 'pkg/elixir/sift/**'
      - 'pkg/elixir/websocket/**'
      - 'pkg/elixir/boundary/**'
      - '.github/workflows/ingress.yml'

# Superseded PR runs are cancelled; main runs are grouped by commit and never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Ingress Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      valkey:
        image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      VALKEY_TEST_PORT: '6379'

    defaults:
      run:
        working-directory: app/twitch/ingress

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match app/twitch/ingress/Containerfile exactly. Elixir 1.19 does not emit
      # 1.20's set-theoretic type warnings, so a job on an older pair reports
      # clean on code that fails the compiler the container actually ships.
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '28'

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/twitch/ingress/deps
            app/twitch/ingress/_build
          key: ingress-${{ runner.os }}-otp28-elixir1.20-${{ hashFiles('app/twitch/ingress/mix.lock') }}
          restore-keys: ingress-${{ runner.os }}-otp28-elixir1.20-

      - name: Fetch dependencies
        run: mix deps.get

      # `mix deps.get` rewrites mix.lock when the committed one does not satisfy
      # mix.exs, which is exactly how the req 0.6.1 / ~> 0.7 mismatch stayed
      # invisible: every local `mix deps.get` silently repaired it in the
      # working tree and nobody committed the result. If the lockfile moved
      # here, the committed one was stale.
      #
      # `mix deps.get --check-locked` does NOT catch this — it exits 0 and
      # re-resolves. Comparing the file is what actually fails.
      - name: Verify mix.lock is in sync with mix.exs
        run: git diff --exit-code mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Install nats-server
        run: |
          curl -sf https://binaries.nats.dev/nats-io/nats-server/v2@v2.15.2 | PREFIX=. sh
          sudo mv nats-server /usr/local/bin/nats-server

      - name: Test shared service boundaries
        working-directory: pkg/elixir
        run: |
          for package in nats startup new_relic websocket boundary sift valkey; do
            (cd "$package" && mix deps.get && git diff --exit-code -- mix.lock && mix format --check-formatted && MIX_ENV=test mix compile --warnings-as-errors && if [ -d test ]; then MIX_ENV=test mix test; fi) || exit 1
          done

      - name: Test shared Cowboy boundary
        working-directory: pkg/elixir/cowboy
        run: |
          mix deps.get
          git diff --exit-code -- mix.lock ../websocket/mix.lock
          mix format --check-formatted
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=test mix test

      - name: Run Tests
        run: MIX_ENV=test mix test
