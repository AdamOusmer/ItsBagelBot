name: Go Test Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # github.com/AdamOusmer/recipes is private; every go command below (mod
      # download, ent generate -mod=mod, go test) must skip the public proxy
      # and sumdb for it and resolve it over SSH instead (see the ssh-agent
      # and git config steps below).
      GOPRIVATE: github.com/AdamOusmer/recipes

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go@v5 caches the module cache + build cache by default, keyed on
      # go.sum, so no separate actions/cache step is needed.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      # The runner needs a key with read access to recipes loaded before the
      # first go command touches it (go mod download resolves GOPRIVATE
      # modules over SSH, never the public proxy/sumdb).
      - name: Load recipes deploy key
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.RECIPES_DEPLOY_KEY }}

      - name: Use SSH for private module fetches
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Install dependencies
        run: go mod download

      # Regenerate every service's Ent client. Discovered from app/*/ent/schema
      # so adding a new Ent service needs no edit here.
      - name: Generate Ent clients
        run: |
          set -euo pipefail
          for schema in app/*/ent/schema; do
            echo "ent generate ./$schema"
            # sql/upsert is required by the commands/modules batch flush
            # (INSERT ... ON DUPLICATE KEY UPDATE); applied to every schema so
            # generated clients stay uniform across services.
            go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert "./$schema"
          done

      # -race detects race conditions (good for a concurrent bot); -v names the
      # failing test.
      - name: Run Tests
        run: go test -v -race ./...
