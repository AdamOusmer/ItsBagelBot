port: $NATS_TEST_PORT
http_port: $NATS_TEST_MONITOR_PORT
server_name: "pkg-bus-integration"
jetstream {
  store_dir: $NATS_TEST_STORE
  domain: "hub"
  # The TWITCH_INGRESS lane pair reserves 1 GiB of memory storage between them
  # (384 MiB + 640 MiB); leave headroom so another suite's small memory stream
  # on the same broker cannot fail fleet provisioning with "insufficient memory
  # resources".
  max_mem: 2GB
  max_file: 1GB
}
