apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: outgress-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: outgress-doppler-token
  managedSecret:
    name: outgress-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outgress
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: outgress
  template:
    metadata:
      labels:
        app: outgress
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: outgress
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: outgress
          image: ghcr.io/adamousmer/itsbagelbot/outgress:v0.2.2-beta@sha256:b8ff84fcfff9c1f24a786da8df4536459622048a41cdfa3a55e726c35a1be697
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_HOST
              value: nats
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_PUBLISH_WIRE
              value: atomic
            - name: NATS_ATOMIC_PUBLISH_BATCH_SIZE
              value: "1000"
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 512MiB
            # No NATS_CONSUME_FLOW/MODE: outgress_bus has no MSG.NEXT grant, so a pull lane delivers nothing.
            - name: OUTGRESS_MIN_ROUTINES
              value: "50"
            - name: OUTGRESS_MAX_ROUTINES
              value: "250"
            - name: OUTGRESS_MAX_CONSUMERS
              value: "3"
            - name: OUTGRESS_SCALE_UP_AFTER
              value: 1s
            - name: OUTGRESS_SCALE_DOWN_AFTER
              value: 60s
            - name: OUTGRESS_PREMIUM_RESERVE_PERCENT
              value: "25"
            - name: OUTGRESS_SYSTEM_WORKERS
              value: "4"
            - name: OUTGRESS_REGION
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Minimum 2: a lone member would claim the full Twitch quota and draw 429s.
            - name: OUTGRESS_LEASE_MIN_MEMBERS
              value: "2"
            - name: TLS_CERT_FILE
              value: /etc/outgress/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/outgress/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: outgress-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/outgress/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: outgress-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outgress
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: outgress
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outgress
  namespace: app
spec:
  scaleTargetRef:
    name: outgress
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 12
  fallback:
    failureThreshold: 3
    replicas: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 2, periodSeconds: 60}
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - {type: Pods, value: 1, periodSeconds: 120}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.messaging.svc.cluster.local:8222
        account: BUS
        stream: TWITCH_OUTGRESS
        consumer: outgress-premium_twitch_outgress_premium
        lagThreshold: "30"
        activationLagThreshold: "5"
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.messaging.svc.cluster.local:8222
        account: BUS
        stream: TWITCH_OUTGRESS
        consumer: outgress-standard_twitch_outgress_standard
        lagThreshold: "150"
        activationLagThreshold: "20"
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.messaging.svc.cluster.local:8222
        account: BUS
        stream: TWITCH_OUTGRESS_SYSTEM
        consumer: outgress-system_twitch_outgress_system
        lagThreshold: "20"
        activationLagThreshold: "5"
