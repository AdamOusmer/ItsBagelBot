# Redirect-only: proxying unmatched hosts would serve production content on any forgotten subdomain.
apiVersion: v1
kind: Service
metadata:
  name: web-origin
  namespace: app
spec:
  type: ExternalName
  externalName: itsbagelbot.com
  ports:
    - name: https
      port: 443
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: web-origin-transport
  namespace: app
spec:
  serverName: itsbagelbot.com
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unrouted-host-404
  namespace: app
spec:
  redirectRegex:
    regex: .*
    replacement: https://itsbagelbot.com/404
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unrouted-host-fallback
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
    - match: HostRegexp(`^.+$`)
      kind: Rule
      priority: 1
      middlewares:
        - name: unrouted-host-404
      services:
        - name: web-origin
          port: 443
          scheme: https
          serversTransport: web-origin-transport
          passHostHeader: false
  tls: {}
