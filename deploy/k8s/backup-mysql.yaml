---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: backup-env
  namespace: db
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: backup-doppler-token
  managedSecret:
    name: backup-env
    namespace: db
    type: Opaque
  resyncSeconds: 300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-mysql-scripts
  namespace: db
data:
  dump.sh: |
    #!/bin/sh
    set -eu
    umask 077
    cd /work

    printf '%s\n' "$DB_CA_CERT" > ca.pem
    printf '%s\n' "$BACKUP_CERT_PEM" > pub.pem

    export MYSQL_PWD="$DB_PASS"
    # VERIFY_IDENTITY works since the 2026-08-27 BYOC cert: the leaf carries an
    # IP SAN for the NLB address in DB_HOST. VERIFY_CA before that (the
    # service-defined cert had no SAN at all, identity was uncheckable).
    MY="--host=$DB_HOST --port=$DB_PORT --user=$DB_USER --ssl-ca=ca.pem --ssl-mode=VERIFY_IDENTITY"

    # mTLS identity for the REQUIRE X509 account flip (client cert issued by
    # the ItsBagelBot HeatWave Root CA). Optional as a pair so this deploys
    # ahead of the flip; half-configured is a Doppler mistake and fails loudly.
    if [ -n "${DB_CLIENT_CERT:-}" ] || [ -n "${DB_CLIENT_KEY:-}" ]; then
      [ -n "${DB_CLIENT_CERT:-}" ] && [ -n "${DB_CLIENT_KEY:-}" ] || {
        echo "DB_CLIENT_CERT and DB_CLIENT_KEY must be set together" >&2; exit 1; }
      printf '%s\n' "$DB_CLIENT_CERT" > client-cert.pem
      printf '%s\n' "$DB_CLIENT_KEY" > client-key.pem
      MY="$MY --ssl-cert=client-cert.pem --ssl-key=client-key.pem"
    fi

    # Enumerate schemas instead of hardcoding them: services onboard new
    # schemas regularly (loyalty landed 2026-07-11) and a hardcoded list fails
    # silently -- the job stays green while quietly not backing up the new one.
    #
    # The LIKE 'mysql%' exclusion is not paranoia about the `mysql` schema: this
    # managed instance also owns mysql_audit / mysql_option / mysql_tasks, and
    # HeatWave auto-REVOKEs EVENT and TRIGGER on them the moment you GRANT
    # ... ON *.*. Without this filter mysqldump aborts partway with
    # "Couldn't execute 'show events': Access denied ... to database
    # 'mysql_audit' (1044)" -- measured 2026-08-20, dump died at 2743 bytes.
    SCHEMAS=$(mysql $MY -N -B -e "SELECT schema_name FROM information_schema.schemata WHERE schema_name NOT IN ('information_schema','performance_schema','sys') AND schema_name NOT LIKE 'mysql%'" | tr '\n' ' ')
    if [ -z "$(echo "$SCHEMAS" | tr -d ' ')" ]; then
      echo "FATAL: zero schemas visible -- refusing to write an empty backup" >&2
      exit 1
    fi
    echo "schemas: $SCHEMAS"

    STAMP=$(date -u +%Y%m%dT%H%M%SZ)
    OUT="mysql-${STAMP}.sql.gz.enc"

    {
      echo "-- itsbagelbot mysql logical backup ${STAMP}"
      echo "-- schemas: ${SCHEMAS}"
      echo "--"
      # Grants are dumped as text because a managed MySQL will not let you
      # restore mysql.user directly -- on a rebuild you replay these by hand.
      # Non-fatal: the backup user may lack SELECT on mysql.user, and losing
      # grants is recoverable from Doppler while losing rows is not.
      echo "-- === GRANTS ==="
      mysql $MY -N -B -e "SELECT CONCAT('SHOW GRANTS FOR ''',user,'''@''',host,''';') FROM mysql.user WHERE user NOT LIKE 'mysql.%' AND user <> ''" 2>/dev/null \
        | while read -r q; do mysql $MY -N -B -e "$q" 2>/dev/null | sed 's/$/;/;s/^/-- /'; done \
        || echo "-- grants unavailable (no SELECT on mysql.user)"
      echo "-- === DATA ==="
      # --no-tablespaces: the backup user has no PROCESS privilege, and without
      # this flag mysqldump aborts on "Access denied; you need PROCESS" rather
      # than skipping the tablespace query.
      mysqldump $MY \
        --databases $SCHEMAS \
        --single-transaction \
        --routines --triggers --events \
        --hex-blob \
        --no-tablespaces \
        --set-gtid-purged=COMMENTED
    } | gzip -9 > dump.sql.gz

    # Sanity gate before encryption: a truncated dump still gzips fine, so
    # check the trailer mysqldump always writes rather than trusting exit codes
    # through the pipe (sh has no pipefail).
    if ! gzip -dc dump.sql.gz | tail -5 | grep -q "Dump completed"; then
      echo "FATAL: dump has no completion marker -- truncated, not uploading" >&2
      exit 1
    fi

    openssl smime -encrypt -binary -aes-256-cbc -outform DER \
      -in dump.sql.gz -out "$OUT" pub.pem
    sha256sum "$OUT" > "${OUT}.sha256"
    rm -f dump.sql.gz ca.pem pub.pem
    ls -l "$OUT"
  upload.sh: |
    #!/bin/sh
    set -eu
    cd /work

    export RCLONE_CONFIG_R2_TYPE=s3
    export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
    export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
    export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
    export RCLONE_CONFIG_R2_ENDPOINT="$R2_ENDPOINT"
    export RCLONE_CONFIG_R2_ACL=private
    # The R2 token is scoped to one bucket, so it cannot ListBuckets; without
    # this rclone fails the bucket-exists preflight before it ever uploads.
    export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true

    rclone copy /work "r2:${R2_BUCKET}/mysql/daily/" \
      --include "*.enc" --include "*.sha256" --stats-one-line

    # Retention is NOT done here: the 30d expiry is an R2 lifecycle rule on
    # daily/, which keeps pruning if this CronJob is broken or deleted. The
    # privacy policy promises backups expire after 30 days: no longer-lived copy.
    rclone lsf "r2:${R2_BUCKET}/mysql/daily/" --include "*.enc" | wc -l | xargs echo "daily objects in R2:"
  r2-env.sh: |
    export RCLONE_CONFIG_R2_TYPE=s3
    export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
    export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
    export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
    export RCLONE_CONFIG_R2_ENDPOINT="$R2_ENDPOINT"
    export RCLONE_CONFIG_R2_ACL=private
    export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
    BINLOG_REMOTE="r2:${R2_BUCKET}/mysql/daily/binlog"
  binlog-fetch.sh: |
    #!/bin/sh
    set -eu
    . /scripts/r2-env.sh
    rclone copy "$BINLOG_REMOTE" /work/binlog --include "*.json" --stats-one-line
  binlog-dump.sh: |
    #!/bin/sh
    set -eu
    umask 077
    cd /work

    printf '%s\n' "$DB_CA_CERT" > ca.pem
    printf '%s\n' "$BACKUP_CERT_PEM" > pub.pem
    printf '%s\n' "$DB_CLIENT_CERT" > client-cert.pem
    printf '%s\n' "$DB_CLIENT_KEY" > client-key.pem

    CONN="--host=$DB_HOST --port=$DB_PORT --user=$BINLOG_DB_USER --ssl-mode=VERIFY_IDENTITY --ssl-ca=ca.pem --ssl-cert=client-cert.pem --ssl-key=client-key.pem"

    START=""
    if [ ! -f binlog/@.binlog.info.json ]; then
      START="--startFrom=$(MYSQL_PWD="$BINLOG_DB_PASS" mysql $CONN -N -B -e 'SHOW BINARY LOG STATUS' | awk '{print $1 ":" $2}')"
    fi
    printf '%s\n' "$BINLOG_DB_PASS" | mysqlsh --no-defaults --passwords-from-stdin $CONN -- util dump-binlogs /work/binlog $START

    find binlog -name '*.zst' | while read -r f; do
      openssl smime -encrypt -binary -aes-256-cbc -outform DER -in "$f" -out "$f.enc" pub.pem
      rm "$f"
    done
    rm -f ca.pem pub.pem client-cert.pem client-key.pem
  binlog-upload.sh: |
    #!/bin/sh
    set -eu
    . /scripts/r2-env.sh
    rclone copy /work/binlog "$BINLOG_REMOTE" --include "*.enc" --stats-one-line
    rclone copy /work/binlog "$BINLOG_REMOTE" --include "*.json" --stats-one-line
    # Rewritten every run so the 30d daily/ lifecycle rule never expires the dump root while it is in use.
    rclone copyto /work/binlog/@.binlog.info.json "$BINLOG_REMOTE/@.binlog.info.json" --ignore-times
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mysql
  namespace: db
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  schedule: "23 */6 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: backup-mysql
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            role: node
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          volumes:
            # Memory-backed: the plaintext dump must never land on a node disk.
            - name: work
              emptyDir: {medium: Memory, sizeLimit: 512Mi}
            - name: scripts
              configMap:
                name: backup-mysql-scripts
                defaultMode: 0555
          initContainers:
            - name: dump
              image: mysql:26.10-oracle@sha256:7b16ec7caa94ca7e92f4c5ec287de69d2e8738db056ceb629022951a6f6d910b
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/dump.sh"]
              env:
                - {name: DB_PORT, value: "3306"}
              envFrom:
                - secretRef: {name: backup-env}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: scripts, mountPath: /scripts, readOnly: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 192Mi}
                limits: {memory: 512Mi}
          containers:
            - name: upload
              image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/upload.sh"]
              env:
                - {name: HOME, value: /work}
              envFrom:
                - secretRef: {name: backup-env}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: scripts, mountPath: /scripts, readOnly: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 256Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-binlog
  namespace: db
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 540
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: backup-binlog
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector:
            role: node
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          volumes:
            - name: work
              emptyDir: {medium: Memory, sizeLimit: 512Mi}
            - name: scripts
              configMap:
                name: backup-mysql-scripts
                defaultMode: 0555
          initContainers:
            - name: fetch
              image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/binlog-fetch.sh"]
              env:
                - {name: HOME, value: /work}
              envFrom:
                - secretRef: {name: backup-env}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: scripts, mountPath: /scripts, readOnly: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
            - name: dump
              image: mysql:26.10-oracle@sha256:7b16ec7caa94ca7e92f4c5ec287de69d2e8738db056ceb629022951a6f6d910b
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/binlog-dump.sh"]
              env:
                - {name: HOME, value: /work}
                - {name: DB_PORT, value: "3306"}
              envFrom:
                - secretRef: {name: backup-env}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: scripts, mountPath: /scripts, readOnly: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 192Mi}
                limits: {memory: 512Mi}
          containers:
            - name: upload
              image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/binlog-upload.sh"]
              env:
                - {name: HOME, value: /work}
              envFrom:
                - secretRef: {name: backup-env}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: scripts, mountPath: /scripts, readOnly: true}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {memory: 256Mi}
