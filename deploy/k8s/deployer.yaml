---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-client-tls
  namespace: ops
spec:
  secretName: nats-client-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
    - client auth
  commonName: nats-client.ops.svc.cluster.local
  dnsNames:
    - nats-client.ops.svc.cluster.local
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: deployer-env
  namespace: ops
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: deployer-doppler-token
  managedSecret:
    name: deployer-env
    namespace: ops
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployer
  namespace: ops
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deployer
  template:
    metadata:
      labels:
        app: deployer
    spec:
      serviceAccountName: deployer
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-operator
      containers:
        - name: deployer
          image: ghcr.io/adamousmer/itsbagelbot/deployer:v0.2.3-beta@sha256:475f60a2f0a4136383cc4900e48383d702be7d88d4c422295c24136e4f1241a1
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOMEMLIMIT
              value: 160MiB
            - name: APP_ENV
              valueFrom:
                secretKeyRef: {name: deployer-env, key: APP_ENV}
            - name: NATS_USER
              valueFrom:
                secretKeyRef: {name: deployer-env, key: NATS_USER}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: {name: deployer-env, key: NATS_PASSWORD}
            - name: NATS_RPC_USER
              valueFrom:
                secretKeyRef: {name: deployer-env, key: NATS_RPC_USER}
            - name: NATS_RPC_PASSWORD
              valueFrom:
                secretKeyRef: {name: deployer-env, key: NATS_RPC_PASSWORD}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef: {name: deployer-env, key: GITHUB_APP_ID}
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef: {name: deployer-env, key: GITHUB_APP_INSTALLATION_ID}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: deployer-env, key: GITHUB_APP_PRIVATE_KEY}
            - name: GHCR_USERNAME
              valueFrom:
                secretKeyRef: {name: deployer-env, key: GHCR_USERNAME}
            - name: GHCR_TOKEN
              valueFrom:
                secretKeyRef: {name: deployer-env, key: GHCR_TOKEN}
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080}
            failureThreshold: 18
            periodSeconds: 5
      terminationGracePeriodSeconds: 45
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deployer
  namespace: ops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [deployer]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [nats, nats-leaf]
      ports:
        - port: 4222
          protocol: TCP
        - port: 4223
          protocol: TCP
        - port: 8222
          protocol: TCP
        - port: 8223
          protocol: TCP
---
# No toFQDNs or dns rules: Cilium's DNS proxy never answers on these nodes, so the pod would resolve nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deployer-egress
  namespace: ops
spec:
  endpointSelector:
    matchLabels:
      app: deployer
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
    - toEntities:
        - world
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deployer
  namespace: messaging
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops
          podSelector:
            matchLabels:
              app: deployer
      ports:
        - port: 4222
        - port: 8222
