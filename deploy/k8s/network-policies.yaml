apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-apps
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, discord-ingress, discord-engine, discord-outgress, console-dashboard, console-admin, gossip, notifications, notifications-cleanup]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
  egress:
    # Cluster DNS only: an empty `to` would make port 53 a tunnelling escape hatch.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cache
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, discord-ingress, discord-engine, discord-outgress, console-dashboard, console-admin, gossip, notifications, notifications-cleanup]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, discord-ingress, discord-outgress, console-dashboard, console-admin, gossip, notifications]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-warp-masque
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: gossip
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: UDP
---
# 10.0.0.0/16 stays for a DB_ADDR rollback to the direct VCN path; removing it breaks that rollback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-heatwave
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, notifications, console-admin]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 204.216.107.73/32
      ports:
        - port: 3306
          protocol: TCP
---
# WORKAROUND cilium/cilium#43012: kubelet probes arrive as "world"; without this default-deny drops them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-probe-ports
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, discord-ingress, discord-engine, discord-outgress, console-dashboard, console-admin, gossip, notifications, notifications-cleanup]
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 3000
          protocol: TCP
