apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-apps
  namespace: app
spec:
  # Apply only to our specific apps to avoid breaking NATS or other infrastructure in the namespace
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, console-dashboard, console-admin, gossip, notifications, notifications-cleanup]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow all app pods to reach each other for now.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
    # Allow the traefik DaemonSet (networking namespace) to reach the routed
    # backends: consoles, webhooks, and the per-service /status listeners.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
    # Allow Tailscale ingress controller to reach admin
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
  egress:
    # Resolve through cluster DNS only. Leaving `to` empty here would turn port
    # 53 into a DNS-tunnelling escape hatch to any Internet address.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Peer app services (RPC fan-out between pods in this namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
    # NATS hub + leaf live in messaging
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
    # Valkey lives in cache
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cache
---
# Every long-running application currently exports APM directly to New Relic
# over HTTPS. Product integrations also use HTTPS from gossip, ingress,
# outgress, sesame, transactions and the consoles. Keep this grant explicit so
# a workload cannot silently inherit it merely by joining default-deny-apps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, console-dashboard, console-admin, gossip, notifications]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# gossip's WARP sidecar needs UDP/443 on top of the TCP/443 above, and nothing
# else in the fleet does. Proxy mode speaks MASQUE — HTTP/3 over QUIC, which is
# UDP — and it is the ONLY protocol proxy mode supports since client 2025.8, so
# there is no TCP fallback to lean on: without this rule the daemon sits in
# "Performing happy eyeballs to 162.159.198.2:443" forever, the SOCKS listener
# never binds, and the sidecar never reports ready (observed exactly that on
# the first rollout).
#
# Scoped to app=gossip alone rather than widening allow-public-https, because
# UDP egress to the whole Internet is a materially different exfiltration
# surface from TCP/443 and only one workload has any use for it. The dial
# targets are Cloudflare's WARP edge; they are not enumerable as a stable IP
# list (anycast, and the client picks endpoints dynamically), so the rule is
# port-scoped rather than destination-scoped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-warp-masque
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: gossip
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: UDP
---
# Data owners reach the managed HeatWave endpoint over the routed OCI private
# subnet. Restricting both the workloads and destination prevents port 3306
# from becoming a generic public-Internet exfiltration path. console-admin is
# included for its explicit schema-credential administration workflow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-heatwave
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, notifications, console-admin]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 3306
          protocol: TCP
---
# WORKAROUND for cilium/cilium#43012 (v1.18.4+): kubelet health probes arrive
# from cilium_host misclassified as the "world" identity instead of "host", so
# default-deny eats every httpGet probe and pods die at the startup window with
# perfectly healthy listeners. Until the upstream fix lands, the health ports
# (8080 Go services + twitch-ingress, 3000 consoles) accept ingress from any
# identity. Bounded exposure: pod IPs are unreachable from outside the pod
# network, so "any identity" is cluster-internal in practice; the probe ports
# serve health JSON and nothing else. REVERT when the Cilium bug is fixed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-probe-ports
  namespace: app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, loyalty, modules, transactions, projector, sesame, twitch-ingress, outgress, console-dashboard, console-admin, gossip, notifications, notifications-cleanup]
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 3000
          protocol: TCP
