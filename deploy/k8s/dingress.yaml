#
# Discord is its own vertical, split across two Deployments that share ONE
# image and ONE Containerfile (app/dingress), selected at runtime by ROLE:
#
#   dingress-gateway (ROLE=gateway, replicas: 1, Recreate)
#     Holds the single Discord gateway Identify session for the fleet bot
#     token: welcomes, join-to-create voice, tickets, staff logs, slash
#     commands, crumb ranks. Two Identify sessions on one bot token fight
#     each other (Discord kills the older one), which is what actually
#     forces this to stay a singleton -- NOT the presence or absence of
#     NATS. This deployment has NO NATS connection at all: it reads the
#     guild<->Twitch reverse index outgress writes (Valkey
#     discord:guild:{id}) and the Discord module blob from the projector
#     store, both over Valkey, and needs nothing from the bus.
#     Recreate (not RollingUpdate) so the outgoing session disconnects
#     before the replacement Identifies.
#
#   dingress-egress (ROLE=egress, replicas: 3, RollingUpdate maxSurge:0/
#   maxUnavailable:1, one pod per node)
#     No gateway session -- pure NATS consumer + Discord REST caller: guild
#     setup/layout/unbind RPC, go-live/offline embeds (own durable consumer
#     on TWITCH_INGRESS's twitch.ingress.event.stream, independent of
#     outgress's), and clip posts (durable pull consumer on BAGEL_DATA's
#     data.twitch.clip.created -- see deploy/messaging/nats-auth.conf and
#     internal/domain/event/data/clip_events.go). This IS HA: REST calls
#     have no session to fight over. maxSurge:0 because the fleet is 3
#     worker nodes (node1/2/3) with one-pod-per-node anti-affinity and no
#     fourth node to surge onto -- same shape as outgress.
#
# dingress-env is backed by the Doppler project `dingress`, NOT by a copy of
# outgress-env: outgress never carried a Discord token and must never start.
# The bot token is not stored here either -- `dingress` holds it as a
# cross-project Doppler reference, DISCORD_BOT_TOKEN = ${discord.prd.TOKEN},
# so the Discord application's credentials live in exactly one config
# (project `discord`, which also feeds the dashboard's DISCORD_CLIENT_ID /
# DISCORD_CLIENT_SECRET the same way). A rotation is one edit there, not a
# hunt for duplicated copies. APP_ENV, LOG_LEVEL, VALKEY_ADDR, NATS_HOST,
# NATS_PORT and NEW_RELIC_LICENSE_KEY are references to the shared-* projects
# for the same reason.
#
# dingress-env carries DISCORD_BOT_TOKEN, VALKEY_PASSWORD, NEW_RELIC_*, and -- consumed by
# dingress-egress only, harmless as unused keys on dingress-gateway -- the
# dingress_egress_bus / dingress_egress_rpc NATS plaintext credentials
# matching the bcrypt hashes in nats-auth.conf. Empty DISCORD_BOT_TOKEN
# leaves the gateway idle (health still serves) and dingress-egress's
# Discord REST calls failing closed. Privileged intents (Server Members +
# Message Content) must be enabled on the Discord application or
# GUILD_MEMBER_ADD / MESSAGE_CREATE never arrive.
#
# Image: replace with the real tag@digest from the first publish-images run
# at rollout time, same as every other service -- no Flux in this cluster
# (removed 2026-08-18); deploys are hand-pinned image tags applied with
# kubectl (see deploy/README or the zero-downtime-deploy skill).

apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dingress-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: dingress-doppler-token
  managedSecret:
    name: dingress-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dingress-gateway
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dingress-gateway
  template:
    metadata:
      labels:
        app: dingress-gateway
        component: dingress
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: dingress
          image: ghcr.io/adamousmer/itsbagelbot/dingress:main
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: gateway
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 512MiB
            - name: TLS_CERT_FILE
              value: /etc/dingress/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/dingress/tls/tls.key
          envFrom:
            - secretRef:
                name: dingress-env
          volumeMounts:
            - {name: health-tls, mountPath: /etc/dingress/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: health-tls
          secret:
            secretName: dingress-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dingress-gateway
  namespace: app
spec:
  # Singleton gateway: a voluntary drain is allowed (Recreate brings it
  # back). minAvailable: 1 would block every node drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: dingress-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dingress-egress
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dingress-egress
  template:
    metadata:
      labels:
        app: dingress-egress
        component: dingress
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      # Application tier only, selected by role so the rule cannot go stale
      # when the fleet changes shape. Same rule as outgress.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      topologySpreadConstraints:
        # One pod per node, matching outgress exactly: matchLabelKeys scopes
        # the skew to the CURRENT ReplicaSet so a maxSurge=0 roll re-spreads
        # one-per-node instead of piling onto whichever node freed capacity
        # first. Soft constraint (whenUnsatisfiable: DoNotSchedule is on the
        # skew, not the schedule) keeps a node outage from wedging
        # scheduling entirely. Three worker nodes, three replicas: there is
        # no fourth node for a surge pod, which is why the rollout above is
        # maxSurge:0/maxUnavailable:1 rather than the default.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: dingress-egress
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: dingress
          image: ghcr.io/adamousmer/itsbagelbot/dingress:main
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: egress
            - name: NATS_HOST
              value: nats
            # Same split-plane shape as outgress: JetStream (BUS) dials the
            # hub directly, RPC + cache stays on the node-local leaf.
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 512MiB
            - name: TLS_CERT_FILE
              value: /etc/dingress/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/dingress/tls/tls.key
          envFrom:
            - secretRef:
                name: dingress-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/dingress/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: dingress-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dingress-egress
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: dingress-egress
