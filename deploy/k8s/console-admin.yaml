apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: console-admin-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: admin-doppler-token
  managedSecret:
    name: console-admin-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-admin
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
    itsbagelbot.com/restart-on-tls-secret: "console-admin-tls,nats-client-tls,valkey-client-tls"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: console-admin
  template:
    metadata:
      labels:
        app: console-admin
    spec:
      serviceAccountName: console-admin
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: console-admin
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: console-admin
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: ["worker"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - {key: app, operator: In, values: [console-admin]}
                topologyKey: kubernetes.io/hostname
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-edge
      containers:
        - name: console-admin
          image: ghcr.io/adamousmer/itsbagelbot/console-admin:v0.3.0-beta@sha256:5458774be69b9768205941fb833ae6ae3826f70b8270b17d490930c9d9887369
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: PORT
              value: "3000"
            - name: TLS_CERT_FILE
              value: /etc/console/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/console/tls/tls.key
            - name: NODE_ENV
              value: production
            - name: ORIGIN
              value: https://admin.tail451e6d.ts.net
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_ADDR
              # Authoritative: Doppler's copy names a dead host, and explicit env beats envFrom.
              value: valkey-local.cache.svc.cluster.local:6380
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NATS_LOCAL_LEAF_HEALTH_URL
              value: https://nats-leaf-local.messaging:8222/healthz
            - name: ADMIN_L1_CACHE_CAPACITY
              value: "250"
            - name: NATS_ADMIN_SUBJECT
              value: twitch.ingress.admin.shards.get
            - name: NATS_TRIAL_SUBJECT_PREFIX
              value: twitch.ingress.admin.trials
            - name: NATS_STATUS_SUBJECT_PREFIX
              value: twitch.ingress.status
            - name: NATS_ADMIN_USER_SUBJECT_PREFIX
              value: bagel.rpc.admin.user
            - name: NATS_ADMIN_AUTH_SUBJECT_PREFIX
              value: bagel.rpc.admin.user.auth
            - name: NATS_ADMIN_AUDIT_SUBJECT_PREFIX
              value: bagel.rpc.admin.user.audit
            - name: NATS_ADMIN_NOTIFICATIONS_SUBJECT_PREFIX
              value: bagel.rpc.admin.notifications
            - name: TWITCH_REDIRECT_URI
              value: https://admin.tail451e6d.ts.net/auth/callback
            - name: DASHBOARD_PUBLIC_ORIGIN
              value: https://dashboard.itsbagelbot.com
            - name: IMPERSONATION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: console-admin-env
                  key: IMPERSONATION_PRIVATE_KEY
            - name: NEW_RELIC_APP_NAME
              value: console-admin
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: NEW_RELIC_LOG
              value: stdout
            - name: NEW_RELIC_LOG_LEVEL
              value: info
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_SPAN_EVENTS_ENABLED
              value: "true"
            - name: NEW_RELIC_CODE_LEVEL_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "false"
            - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_ATTRIBUTES_EXCLUDE
              value: "request.*,response.*,http.url,http.target,http.host,client.address,net.*"
            - name: NEW_RELIC_STRIP_EXCEPTION_MESSAGES_ENABLED
              value: "true"
            - name: NEW_RELIC_ALLOW_ALL_HEADERS
              value: "false"
            - name: NEW_RELIC_LABELS
              value: "service:console-admin;tier:web;component:ssr"
            - name: NEW_RELIC_PROCESS_HOST_DISPLAY_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEW_RELIC_UTILIZATION_DETECT_AWS
              value: "false"
            - name: NEW_RELIC_UTILIZATION_DETECT_GCP
              value: "false"
            - name: NEW_RELIC_UTILIZATION_DETECT_AZURE
              value: "false"
            - name: NEW_RELIC_UTILIZATION_DETECT_AZUREFUNCTION
              value: "false"
            - name: NEW_RELIC_UTILIZATION_DETECT_PCF
              value: "false"
          envFrom:
            - secretRef:
                name: console-admin-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: tls, mountPath: /etc/console/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 3000, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 3000, scheme: HTTPS}
            periodSeconds: 10
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: tls
          secret:
            secretName: console-admin-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: console-admin
  namespace: app
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: console-admin
  ports:
    - name: https
      port: 443
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-admin
  namespace: app
  annotations:
    tailscale.com/proxy-group: ts-ingress
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: console-admin
      port:
        number: 443
  tls:
    - hosts:
        - admin
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console-admin
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: console-admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-admin
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: console-admin-flux
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: [kustomizations]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: console-admin-flux
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: console-admin-flux
subjects:
  - kind: ServiceAccount
    name: console-admin
    namespace: app
---
# No toFQDNs or dns rules: Cilium's DNS proxy never answers on these nodes, so the pod would resolve nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: console-admin-apiserver
  namespace: app
spec:
  endpointSelector:
    matchLabels:
      app: console-admin
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
