apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: twitch-ingress-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: twitch-ingress-doppler-token
  managedSecret:
    name: twitch-ingress-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
# publishNotReadyAddresses: BEAM nodes must find each other before readiness to form the cluster.
apiVersion: v1
kind: Service
metadata:
  name: twitch-ingress-headless
  namespace: app
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: twitch-ingress
  ports:
    - name: epmd
      port: 4369
    - name: erlang-dist
      port: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-ingress
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  # minReadySeconds lets the Horde registry converge between swaps; faster cycling caused a chat outage.
  minReadySeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: twitch-ingress
  template:
    metadata:
      labels:
        app: twitch-ingress
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: twitch-ingress
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: ingress
          image: ghcr.io/adamousmer/itsbagelbot/twitch-ingress:main-1790269785-d951ff46504d@sha256:abd33bdf3959275881844b2de16284134fb56bfaba83c5e3f5c9878e85b433b0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: twitch-ingress-env
          env:
            - name: TLS_CERT_FILE
              value: /etc/twitch-ingress/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/twitch-ingress/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: NATS_HOST
              value: nats.messaging.svc.cluster.local
            - name: NATS_LEAF_HOST
              value: nats-leaf.messaging.svc.cluster.local
            - name: NATS_HUB_HOST
              value: nats.messaging.svc.cluster.local
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_TLS_CA_FILE
              value: /etc/valkey/ca/ca.pem
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outgress-env
                  key: VALKEY_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RELEASE_DISTRIBUTION
              value: name
            - name: RELEASE_NODE
              value: ingress@$(POD_IP)
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: twitch-ingress-env
                  key: BAGELBOT_ERLANG_COOKIE
            - name: NEW_RELIC_APP_NAME
              value: "ItsBagelBot-Ingress"
            - name: NEW_RELIC_LOGS_IN_CONTEXT
              value: "forwarder"
            - name: INGRESS_DISPATCHER_MAX_RUNNING
              value: "512"
            - name: INGRESS_DISPATCHER_MAX_QUEUE
              value: "20000"
            - name: INGRESS_DISPATCHER_MAX_PER_BROADCASTER
              value: "16000"
            - name: INGRESS_PUBLISH_BATCH_SIZE
              value: "256"
            - name: INGRESS_PUBLISH_BATCH_WAIT_MS
              value: "4"
            - name: INGRESS_PUBLISH_WIRE
              value: "atomic"
            - name: INGRESS_PUBLISH_BATCH_INFLIGHT
              value: "8"
            - name: ERL_FLAGS
              value: >-
                +S 2:2 +SDcpu 2:2 +SDio 2 +sbwt short +sbwtdcpu none +sbwtdio none -kernel inet_dist_listen_min 9100 -kernel inet_dist_listen_max 9110
          resources:
            requests:
              cpu: 500m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: valkey-ca, mountPath: /etc/valkey/ca, readOnly: true}
            - {name: valkey-client-tls, mountPath: /etc/valkey/client-tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/twitch-ingress/tls, readOnly: true}
          ports:
            - name: status
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              # Drain plus this sleep must stay inside terminationGracePeriodSeconds.
              sleep:
                seconds: 10
          livenessProbe:
            exec:
              command: ["/app/bin/ingress", "pid"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/app/bin/ingress", "pid"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: valkey-ca
          configMap:
            name: fleet-ca
            items:
              - {key: ca.pem, path: ca.pem}
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
        - name: health-tls
          secret:
            secretName: twitch-ingress-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: twitch-ingress
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: twitch-ingress
