apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gossip-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: gossip-doppler-token
  managedSecret:
    name: gossip-env
    namespace: app
    type: Opaque
  resyncSeconds: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gossip
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gossip
  template:
    metadata:
      labels:
        app: gossip
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: gossip
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: gossip
      automountServiceAccountToken: false
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
          - name: net.ipv4.tcp_rto_min_us
            value: "10000"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-service
      initContainers:
        - name: warp
          image: ghcr.io/adamousmer/itsbagelbot/warp:main-1795451804-63331a321300@sha256:75cfa3d838ec2cd58ca4b39bbee7058db66cce66ef7b88f27c4acd6d675dc21c
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            # Bound glibc arena proliferation and trim freed heap sooner. Live
            # inspection on 2026-09-26 found ~210Mi anonymous RSS and dozens of
            # arena mappings on the busiest replica without these settings.
            # This reduces allocator retention; it cannot fix live allocations
            # leaked inside the vendor daemon. Compare RssAnon over time after rollout.
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
            - name: WARP_ORGANIZATION
              valueFrom:
                secretKeyRef: {name: gossip-env, key: WARP_ORGANIZATION}
            - name: WARP_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: gossip-env, key: WARP_AUTH_CLIENT_ID}
            - name: WARP_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: gossip-env, key: WARP_AUTH_CLIENT_SECRET}
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              cat > /var/lib/cloudflare-warp/mdm.xml <<XML
              <dict>
                <key>organization</key><string>${WARP_ORGANIZATION}</string>
                <key>auth_client_id</key><string>${WARP_AUTH_CLIENT_ID}</string>
                <key>auth_client_secret</key><string>${WARP_AUTH_CLIENT_SECRET}</string>
                <key>service_mode</key><string>proxy</string>
                <key>proxy_port</key><integer>40000</integer>
                <key>auto_connect</key><integer>1</integer>
                <key>onboarding</key><false/>
              </dict>
              XML
              exec warp-svc
          securityContext:
            # Never add NET_ADMIN or a tun device: WARP could then reroute the shared pod netns.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: warp-state
              mountPath: /var/lib/cloudflare-warp
            - name: warp-run
              mountPath: /run/cloudflare-warp
          ports:
            - name: warp-socks
              containerPort: 40000
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ss -ltn | grep -q '127.0.0.1:40000'"
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            exec:
              command: ["warp-cli", "--accept-tos", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            # Reserve the daemon's working set plus diagnostic-file cache. Live
            # replicas reached the former 256Mi cgroup limit after 44h (memory.events
            # max > 0); 512Mi adds headroom while allocator retention is reduced above.
            # Reclaimable file cache is distinct from anonymous daemon RSS.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: gossip
          image: ghcr.io/adamousmer/itsbagelbot/gossip:main-1795471213-2c85f339ced4@sha256:b33d30353518e1e7e42d1e141383ff2dedca8c9aef08a8d484ea50cdba8d1a48
          imagePullPolicy: IfNotPresent
          env:
            - name: GEMINI_TTS_TEMPERATURE
              value: "1.5"
            - name: GEMINI_TTS_MODEL
              value: gemini-3.8-flash-lite-tts
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 96MiB
            - name: TLS_CERT_FILE
              value: /etc/gossip/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/gossip/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: gossip-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/gossip/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: gossip-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
        - name: warp-state
          emptyDir: {}
        - name: warp-run
          emptyDir:
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gossip
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: gossip
