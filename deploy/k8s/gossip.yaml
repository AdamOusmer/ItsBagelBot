apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gossip-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: gossip-doppler-token
  managedSecret:
    name: gossip-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gossip
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gossip
  template:
    metadata:
      labels:
        app: gossip
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: gossip
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: gossip
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-service
      initContainers:
        - name: warp
          image: ghcr.io/adamousmer/itsbagelbot/warp:v0.2.6-beta@sha256:711341a8498fa36e53bd74c2cdf56bac2a17eae57ad002ba8dab43e0ee20d4a1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            # Bound glibc arena proliferation and trim freed heap sooner. Live
            # inspection on 2026-09-26 found ~210Mi anonymous RSS and dozens of
            # arena mappings on the busiest replica without these settings.
            # This reduces allocator retention; it cannot fix live allocations
            # leaked inside the vendor daemon. Compare RssAnon over time after rollout.
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
          command:
            - /bin/sh
            - -ec
            - |
              warp-svc &
              # WAIT for the daemon's IPC socket before any warp-cli call.
              # Without this the container crashloops on
              # "Unable to connect to the CloudflareWARP daemon: No such file
              # or directory" — warp-svc backgrounds instantly but takes ~2s to
              # bind its socket, so every command raced it and failed. Polling
              # `status` is the readiness signal (it answers "Registration
              # Missing" once the daemon is up, which is a live response).
              for i in $(seq 1 60); do
                warp-cli --accept-tos status >/dev/null 2>&1 && break
                sleep 1
              done
              # Consumer registration: no organization, no service token, no
              # seat, no charge. Tolerated on failure because an in-place
              # container restart reuses the emptyDir state and is already
              # registered; a genuinely broken registration surfaces at connect.
              warp-cli --accept-tos registration new || true
              warp-cli --accept-tos mode proxy
              warp-cli --accept-tos proxy port 40000
              warp-cli --accept-tos connect || true
              # Keep PID 1 alive for the sidecar lifetime; warp-svc serves the proxy.
              wait
          securityContext:
            # Never add NET_ADMIN or a tun device: WARP could then reroute the shared pod netns.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: warp-state
              mountPath: /var/lib/cloudflare-warp
          ports:
            - name: warp-socks
              containerPort: 40000
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ss -ltn | grep -q '127.0.0.1:40000'"
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            exec:
              command: ["warp-cli", "--accept-tos", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            # Reserve the daemon's working set plus diagnostic-file cache. Live
            # replicas reached the former 256Mi cgroup limit after 44h (memory.events
            # max > 0); 512Mi adds headroom while allocator retention is reduced above.
            # Reclaimable file cache is distinct from anonymous daemon RSS.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: gossip
          image: ghcr.io/adamousmer/itsbagelbot/gossip:v0.2.6-beta@sha256:0b60b942038fd58a87a03b943023eabf9fe1e79a9775742f61601d1744b06b8e
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 96MiB
            - name: TLS_CERT_FILE
              value: /etc/gossip/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/gossip/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: gossip-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/gossip/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: gossip-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
        - name: warp-state
          emptyDir: {}
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gossip
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: gossip
