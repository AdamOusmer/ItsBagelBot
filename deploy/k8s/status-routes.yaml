# External status surface for the Better Stack status page: one hostname,
# one path per service — https://health.itsbagelbot.com/<service> rewrites to
# that service's /status endpoint (pkg/health) and nothing else. The exact-path
# match plus the replacePath middleware means only /status is ever reachable
# from outside; /healthz, /readyz and /drain stay cluster-internal (a public
# /drain would let anyone hold handler goroutines for 10s a request).
#
# DNS needs no record work: the cloudflared tunnel wildcard admits any
# *.itsbagelbot.com hostname, and this router claiming Host(health...) is what
# lifts it out of the unrouted-host fallback (web-error-pages.yaml, priority 1).
#
# Every service except transactions exposes port 8080 without a Service object
# (their health was probe-only until now), so each gets a minimal ClusterIP
# here. transactions reuses its existing Service and TLS ServersTransport from
# transactions.yaml. Every backend hop is TLS: pkg/health terminates it with
# the per-service cert-manager <svc>-tls cert (SAN <svc>-status), and the
# per-service ServersTransports below verify it against the fleet CA.
apiVersion: v1
kind: Service
metadata:
  name: commands-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: commands
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
