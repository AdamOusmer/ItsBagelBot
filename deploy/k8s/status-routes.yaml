# Exact path only: a public /drain would let anyone hold handler goroutines.
apiVersion: v1
kind: Service
metadata:
  name: gossip-status
  namespace: app
spec:
  selector:
    app: gossip
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: discord-engine-status
  namespace: app
spec:
  selector:
    app: discord-engine
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sesame-status
  namespace: app
spec:
  selector:
    app: sesame
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: app
spec:
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: app
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: app
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/twitch`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: sesame-status
          port: 443
          scheme: https
          serversTransport: sesame-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/discord`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: discord-engine-status
          port: 443
          scheme: https
          serversTransport: discord-engine-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/console`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: console-dashboard
          port: 443
          scheme: https
          serversTransport: console-dashboard-transport
          nativeLB: true
    - match: Host(`health.itsbagelbot.com`) && Path(`/gossip`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: gossip-status
          port: 443
          scheme: https
          serversTransport: gossip-status-transport
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: db
spec:
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: db
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
# Duplicated in deploy/db/status-routes.yaml on purpose: no kustomization reaches deploy/db.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transactions-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/billing`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
    - match: Host(`health.itsbagelbot.com`) && Path(`/db`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: projector-status
          port: 443
          scheme: https
          serversTransport: projector-status-transport
  tls: {}
---
# Port name `http` must match deploy/db/status-routes.yaml, or whichever file applies last flips it.
apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: db
spec:
  selector:
    app: projector
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: projector-status-transport
  namespace: db
spec:
  serverName: projector-status
  rootCAsSecrets:
    - projector-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gossip-status-transport
  namespace: app
spec:
  serverName: gossip-status
  rootCAsSecrets:
    - gossip-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: discord-engine-status-transport
  namespace: app
spec:
  serverName: discord-engine-status
  rootCAsSecrets:
    - discord-engine-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: sesame-status-transport
  namespace: app
spec:
  serverName: sesame-status
  rootCAsSecrets:
    - sesame-tls
