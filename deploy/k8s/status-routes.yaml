# External status surface for the Better Stack status page: one hostname,
# one path per service — https://status.itsbagelbot.com/<service> rewrites to
# that service's /status endpoint (pkg/health) and nothing else. The exact-path
# match plus the replacePath middleware means only /status is ever reachable
# from outside; /healthz, /readyz and /drain stay cluster-internal (a public
# /drain would let anyone hold handler goroutines for 10s a request).
#
# DNS needs no record work: the cloudflared tunnel wildcard admits any
# *.itsbagelbot.com hostname, and this router claiming Host(status...) is what
# lifts it out of the unrouted-host fallback (web-error-pages.yaml, priority 1).
#
# Every service except transactions exposes port 8080 without a Service object
# (their health was probe-only until now), so each gets a minimal ClusterIP
# here. transactions reuses its existing Service and TLS ServersTransport from
# transactions.yaml — its pod terminates TLS, so that hop stays end-to-end.
apiVersion: v1
kind: Service
metadata:
  name: commands-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: commands
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gossip-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: gossip
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: loyalty
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: modules-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: modules
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: notifications
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: outgress-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: outgress
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: projector
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sesame-status
  namespace: production
spec:
  trafficDistribution: PreferClose
  selector:
    app: sesame
