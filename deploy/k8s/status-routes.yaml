# External status surface for the Better Stack status page: one hostname,
# one path per service — https://health.itsbagelbot.com/<service> rewrites to
# that service's /status endpoint (pkg/health) and nothing else. The exact-path
# match plus the replacePath middleware means only /status is ever reachable
# from outside; /healthz, /readyz and /drain stay cluster-internal (a public
# /drain would let anyone hold handler goroutines for 10s a request).
#
# DNS needs no record work: the cloudflared tunnel wildcard admits any
# *.itsbagelbot.com hostname, and this router claiming Host(health...) is what
# lifts it out of the unrouted-host fallback (web-error-pages.yaml, priority 1).
#
# Every service except transactions exposes port 8080 without a Service object
# (their health was probe-only until now), so each gets a minimal ClusterIP
# here. transactions reuses its existing Service and TLS ServersTransport from
# transactions.yaml. Every backend hop is TLS: pkg/health terminates it with
# the per-service cert-manager <svc>-tls cert (SAN <svc>-status), and the
# per-service ServersTransports below verify it against the fleet CA.
#
# No trafficDistribution on these Services (deliberate, mirrors the db half):
# PreferSameNode pinned every external probe to the entry node's own replica,
# so one dead pod read as service-down while the other replicas were healthy
# (2026-08-30 node3 uplink blip: Better Stack reported projector down with 2/3
# replicas serving). Status traffic is one probe per ~30s behind the rate
# limiter, so the cross-node hop this reintroduces costs nothing.
apiVersion: v1
kind: Service
metadata:
  name: gossip-status
  namespace: app
spec:
  selector:
    app: gossip
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: outgress-status
  namespace: app
spec:
  selector:
    app: outgress
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: discord-ingress-status
  namespace: app
spec:
  selector:
    app: discord-ingress
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: discord-engine-status
  namespace: app
spec:
  selector:
    app: discord-engine
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: discord-outgress-status
  namespace: app
spec:
  selector:
    app: discord-outgress
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sesame-status
  namespace: app
spec:
  selector:
    app: sesame
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
# Caps Better Stack's probe fleet, the only intended client, well below any
# real load. sourceCriterion reads CF-Connecting-IP, not the source IP,
# because every public request enters through cloudflared and traefik's
# entryPoints have no forwardedHeaders.trustedIPs set: an ipStrategy over
# X-Forwarded-For would never see the real client, and every request would
# collapse into the cloudflared pod's single bucket. The header is only
# spoofable by a caller that reaches traefik without transiting the tunnel,
# which the firewall posture already rules out. The limiter is in-memory
# per traefik instance (one per node), so the effective fleet-wide cap is
# nodes x (average/burst), still far above Better Stack's ~30s poll cadence.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: app
spec:
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
# Re-pick a backend when the first pick fails at the connection level. With
# PreferSameNode gone (header comment) the pool is every ready replica, so a
# pod that died faster than its EndpointSlice updated (the NotReady grace is
# 40s+) no longer turns one bad pick into a public "down": 2026-08-30 node3
# blip, Better Stack reported projector down with 2/3 replicas serving.
# Sits after the rate limiter so retries don't re-count against the caller.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: app
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
# Rewrites every routed path to the one endpoint the backends actually serve.
# Shared by all routes below: the per-service path only exists to pick the
# backend, never to reach a different endpoint.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: app
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/dashboard`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: console-dashboard
          port: 443
          scheme: https
          serversTransport: console-dashboard-transport
          nativeLB: true
    - match: Host(`health.itsbagelbot.com`) && Path(`/gossip`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: gossip-status
          port: 443
          scheme: https
          serversTransport: gossip-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/ingress`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: twitch-ingress-status
          port: 443
          scheme: https
          serversTransport: twitch-ingress-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/outgress`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: outgress-status
          port: 443
          scheme: https
          serversTransport: outgress-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/discord-ingress`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: discord-ingress-status
          port: 443
          scheme: https
          serversTransport: discord-ingress-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/discord-engine`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: discord-engine-status
          port: 443
          scheme: https
          serversTransport: discord-engine-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/discord-outgress`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: discord-outgress-status
          port: 443
          scheme: https
          serversTransport: discord-outgress-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/sesame`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: sesame-status
          port: 443
          scheme: https
          serversTransport: sesame-status-transport
  tls: {}
---
# transactions lives in the db namespace, and traefik does not allow
# cross-namespace service or middleware references by default, so its slice
# of the status surface is a sibling IngressRoute there with db-namespace
# copies of the two middlewares. Same contract as the routes above:
# /transactions rewrites to /status against the existing transactions
# Service and ServersTransport (transactions.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: db
spec:
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
# db copy of status-retry above, same reasoning; deploy/db/status-routes.yaml
# ships an identical one so either file applies standalone.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: db
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transactions-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/transactions`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: gossip-status-transport
  namespace: app
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: gossip-status
  rootCAsSecrets:
    - gossip-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: outgress-status-transport
  namespace: app
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: outgress-status
  rootCAsSecrets:
    - outgress-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: discord-ingress-status-transport
  namespace: app
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: discord-ingress-status
  rootCAsSecrets:
    - discord-ingress-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: discord-engine-status-transport
  namespace: app
spec:
  serverName: discord-engine-status
  rootCAsSecrets:
    - discord-engine-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: discord-outgress-status-transport
  namespace: app
spec:
  serverName: discord-outgress-status
  rootCAsSecrets:
    - discord-outgress-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: sesame-status-transport
  namespace: app
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: sesame-status
  rootCAsSecrets:
    - sesame-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: twitch-ingress-status-transport
  namespace: app
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: twitch-ingress-status
  rootCAsSecrets:
    - twitch-ingress-tls
