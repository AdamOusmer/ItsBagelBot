  selector:
    app: users
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Rewrites every routed path to the one endpoint the backends actually serve.
# Shared by all routes below: the per-service path only exists to pick the
# backend, never to reach a different endpoint.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: production
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: production
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`status.itsbagelbot.com`) && Path(`/commands`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: commands-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/gossip`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: gossip-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/loyalty`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: loyalty-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/modules`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: modules-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/notifications`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: notifications-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/outgress`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: outgress-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/projector`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: projector-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/sesame`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: sesame-status
          port: 80
    - match: Host(`status.itsbagelbot.com`) && Path(`/transactions`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: transactions
          port: 80
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
    - match: Host(`status.itsbagelbot.com`) && Path(`/users`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: users-status
          port: 80
  tls: {}
