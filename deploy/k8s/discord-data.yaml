apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: discord-data-env
  namespace: db
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: discord-data-doppler-token
  managedSecret:
    name: discord-data-env
    namespace: db
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-data
  namespace: db
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge 0: three workers with one-per-node anti-affinity leave no node for a surge pod.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: discord-data
  template:
    metadata:
      labels:
        app: discord-data
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: discord-data
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: discord-data
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-service
      containers:
        - name: discord-data
          image: ghcr.io/adamousmer/itsbagelbot/discord-data:main-1790276953-955cc12a0caf@sha256:2c46e94d590482462d002d372ddaef418d1cd85da7647b844df528b207c8c070
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_HOST
              value: nats
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_MAX_OPEN_CONNS
              value: "8"
            - name: DB_QUERY_CONCURRENCY
              value: "8"
            - name: DB_AUTO_MIGRATE
              value: "true"
            - name: GOMEMLIMIT
              value: 160MiB
            - name: TLS_CERT_FILE
              value: /etc/discord-data/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/discord-data/tls/tls.key
            - name: APP_ENV
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: APP_ENV}
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: NEW_RELIC_LICENSE_KEY}
            - name: NATS_RPC_USER
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: NATS_RPC_USER}
            - name: NATS_RPC_PASSWORD
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: NATS_RPC_PASSWORD}
            - name: NATS_RPC_JWT
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: NATS_RPC_JWT, optional: true}
            - name: NATS_RPC_NKEY_SEED
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: NATS_RPC_NKEY_SEED, optional: true}
            - name: DB_ADDR
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_ADDR}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_USER}
            - name: DB_PASS
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_PASS}
            - name: DB_SCHEMA
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_SCHEMA}
            - name: DB_TLS_MODE
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_TLS_MODE}
            - name: DB_CA_CERT
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_CA_CERT}
            - name: DB_CLIENT_CERT
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_CLIENT_CERT}
            - name: DB_CLIENT_KEY
              valueFrom:
                secretKeyRef: {name: discord-data-env, key: DB_CLIENT_KEY}
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/discord-data/tls, readOnly: true}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: discord-data-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discord-data
  namespace: db
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: discord-data
