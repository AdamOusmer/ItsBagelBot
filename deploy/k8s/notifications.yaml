apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: notifications-env
  namespace: db
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: notifications-doppler-token
  managedSecret:
    name: notifications-env
    namespace: db
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: db
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: notifications
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: notifications
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: notifications
          image: ghcr.io/adamousmer/itsbagelbot/notifications:v0.2.3-beta@sha256:3a923f3d26993352e65fe9ea9530fbe062e48e7269bd4fe178808b2efcac37bb
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_HOST
              value: nats
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_MAX_OPEN_CONNS
              value: "8"
            - name: DB_QUERY_CONCURRENCY
              value: "8"
            - name: DB_AUTO_MIGRATE
              value: "true"
            - name: GOMEMLIMIT
              value: 160MiB
            - name: TLS_CERT_FILE
              value: /etc/notifications/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/notifications/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: notifications-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/notifications/tls, readOnly: true}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: notifications-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifications
  namespace: db
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: notifications
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notifications-cleanup
  namespace: db
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: notifications-cleanup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cleanup
              image: ghcr.io/adamousmer/itsbagelbot/notifications:v0.2.3-beta@sha256:3a923f3d26993352e65fe9ea9530fbe062e48e7269bd4fe178808b2efcac37bb
              imagePullPolicy: IfNotPresent
              args: ["cleanup"]
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: NATS_URL
                  value: tls://nats-leaf.messaging:4222
                - name: NATS_RPC_URL
                  value: tls://nats-leaf.messaging:4222
                - name: NATS_LEAF_URL
                  value: tls://nats-leaf.messaging:4222
                - name: NATS_CA_PEM
                  valueFrom:
                    configMapKeyRef:
                      name: fleet-ca
                      key: ca.pem
                - name: NATS_CLIENT_CERT_FILE
                  value: /etc/nats-client/tls/tls.crt
                - name: NATS_CLIENT_KEY_FILE
                  value: /etc/nats-client/tls/tls.key
              envFrom:
                - secretRef:
                    name: notifications-env
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
          volumes:
            - name: nats-client-tls
              secret:
                secretName: nats-client-tls
