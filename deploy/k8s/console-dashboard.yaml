apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dashboard-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: dashboard-doppler-token
  managedSecret:
    name: dashboard-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-dashboard
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: console-dashboard
  template:
    metadata:
      labels:
        app: console-dashboard
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: ["worker"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: console-dashboard
          matchLabelKeys:
            - pod-template-hash
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-edge
      containers:
        - name: console-dashboard
          image: ghcr.io/adamousmer/itsbagelbot/console-dashboard:v0.2.2-beta@sha256:9de6638346662314c11d3e23377d9ae8b9b8f52c4a6cc2cab3bf9bf4d3e45434
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: TLS_CERT_FILE
              value: /etc/console/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/console/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: NODE_ENV
              value: production
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: x-forwarded-host
            # Overrides the secret's stale NATS_HOST, which does not resolve here.
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_ADDR
              # Authoritative: Doppler's copy names a dead host, and explicit env beats envFrom.
              value: valkey-local.cache.svc.cluster.local:6380
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DASHBOARD_L1_CACHE_CAPACITY
              value: "1000"
            - name: NATS_PROJECTOR_DASHBOARD_SUBJECT_PREFIX
              value: bagel.rpc.projector.dashboard
            - name: NATS_NOTIFICATIONS_SUBJECT_PREFIX
              value: bagel.rpc.notifications
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-env
                  key: DASHBOARD_SESSION_KEY
            # The dashboard never holds the private half, so it cannot forge view-as links.
            - name: IMPERSONATION_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-env
                  key: IMPERSONATION_PUBLIC_KEY
            - name: NEW_RELIC_APP_NAME
              value: console-dashboard
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_LOG
              value: stdout
            - name: NEW_RELIC_LOG_LEVEL
              value: info
            - name: NEW_RELIC_SPAN_EVENTS_ENABLED
              value: "true"
            - name: NEW_RELIC_CODE_LEVEL_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "false"
            - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_LABELS
              value: "service:console-dashboard;tier:web;component:ssr"
            - name: NEW_RELIC_PROCESS_HOST_DISPLAY_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: dashboard-env
          ports:
            - containerPort: 3000
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: tls, mountPath: /etc/console/tls, readOnly: true}
            - {name: valkey-client-tls, mountPath: /etc/valkey/client-tls, readOnly: true}
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 3000, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 3000, scheme: HTTPS}
            periodSeconds: 10
      terminationGracePeriodSeconds: 45
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: tls
          secret:
            secretName: console-dashboard-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
---
apiVersion: v1
kind: Service
metadata:
  name: console-dashboard
  namespace: app
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: console-dashboard
  ports:
    - name: https
      port: 443
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-dashboard
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
    - match: >-
        (Host(`dashboard.itsbagelbot.com`) || Host(`stats.itsbagelbot.com`) ||
         Host(`commands.itsbagelbot.com`) || Host(`leaderboard.itsbagelbot.com`)) &&
        (Path(`/status`) || Path(`/healthz`) || Path(`/readyz`))
      kind: Rule
      middlewares: [{name: dashboard-ratelimit}, {name: health-mask}]
      services:
        - name: console-dashboard
          port: 443
          scheme: https
          serversTransport: console-dashboard-transport
          nativeLB: true
    - match: >-
        (Host(`dashboard.itsbagelbot.com`) || Host(`stats.itsbagelbot.com`) ||
         Host(`commands.itsbagelbot.com`) || Host(`leaderboard.itsbagelbot.com`)) &&
        (PathPrefix(`/auth/`) || PathPrefix(`/delegate/`) || PathPrefix(`/spotify/`))
      kind: Rule
      middlewares: [{name: dashboard-auth-ratelimit}]
      services:
        - name: console-dashboard
          port: 443
          scheme: https
          serversTransport: console-dashboard-transport
          nativeLB: true
    - match: >-
        Host(`dashboard.itsbagelbot.com`) || Host(`stats.itsbagelbot.com`) ||
        Host(`commands.itsbagelbot.com`) || Host(`leaderboard.itsbagelbot.com`)
      kind: Rule
      middlewares: [{name: dashboard-ratelimit}, {name: dashboard-compress}]
      services:
        - name: console-dashboard
          port: 443
          # HTTPS to the backend: serve-node.js now terminates TLS, so traefik
          # re-encrypts via the ServersTransport below (rootCAs = the cert's own
          # fleet-CA ca.crt). This makes the traefik->console hop TLS end-to-end.
          scheme: https
          serversTransport: console-dashboard-transport
          # Route to the Service ClusterIP (not pod endpoints) so traefik
          # inherits the Service's PreferSameZone region routing. No sticky cookie:
          # sessions are stateless, so any in-region pod is interchangeable.
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: health-mask
  namespace: app
spec:
  replacePath:
    path: /__health-masked
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-ratelimit
  namespace: app
spec:
  rateLimit:
    average: 20
    burst: 100
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-auth-ratelimit
  namespace: app
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
# text/event-stream must stay excluded: compression buffers and breaks /events and /stats/stream.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-compress
  namespace: app
spec:
  compress:
    excludedContentTypes:
      - text/event-stream
      - application/grpc
      - font/woff2
      - image/png
      - image/jpeg
      - image/webp
      - image/avif
      - video/mp4
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: console-dashboard-transport
  namespace: app
spec:
  serverName: console-dashboard
  rootCAsSecrets:
    - console-dashboard-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console-dashboard
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: console-dashboard
