apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: transactions-env
  namespace: db
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: transactions-doppler-token
  managedSecret:
    name: transactions-env
    namespace: db
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions
  namespace: db
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: transactions
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: transactions
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-service
      containers:
        - name: transactions
          image: ghcr.io/adamousmer/itsbagelbot/transactions:v0.2.2-beta@sha256:fc218347ee5f6058b0b1b16705bb8a8a94dbd3a7b6ac6287ffc2033522b621b8
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_HOST
              value: nats
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_MAX_OPEN_CONNS
              value: "8"
            - name: DB_QUERY_CONCURRENCY
              value: "8"
            - name: DB_AUTO_MIGRATE
              value: "true"
            - name: GIVEAWAYS_NEW_AWARDS_ENABLED
              value: "true"
            - name: GIVEAWAYS_PROMOTIONAL_GRANTS_ENABLED
              value: "true"
            - name: GIVEAWAYS_INTERVAL_RULE_VERIFIED
              value: "false"
            - name: TEBEX_CHECKOUT_MUTATIONS_ENABLED
              value: "false"
            - name: GIVEAWAYS_RECONCILE_INTERVAL
              value: 15m
            - name: GIVEAWAYS_BOUNDARY_RECONCILE_INTERVAL
              value: 1m
            - name: TEBEX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: transactions-env
                  key: TEBEX_WEBHOOK_SECRET
                  optional: true
            - name: GOMEMLIMIT
              value: 160MiB
            - name: TLS_CERT_FILE
              value: /etc/transactions/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/transactions/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: transactions-env
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: tls, mountPath: /etc/transactions/tls, readOnly: true}
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      terminationGracePeriodSeconds: 45
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: tls
          secret:
            secretName: transactions-tls
---
apiVersion: v1
kind: Service
metadata:
  name: transactions
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: transactions
  ports:
    - name: https
      port: 443
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transactions-webhooks
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`webhooks.itsbagelbot.com`) && (PathPrefix(`/tebex`) || PathPrefix(`/webhooks/tebex`))
      kind: Rule
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: transactions-transport
  namespace: db
spec:
  serverName: transactions
  rootCAsSecrets:
    - transactions-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transactions
  namespace: db
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: transactions
