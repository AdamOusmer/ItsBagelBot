apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: modules-env
  namespace: db
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: modules-doppler-token
  managedSecret:
    name: modules-env
    namespace: db
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modules
  namespace: db
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3 # one per hot-path node: node4, node5, node6
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: modules
  template:
    metadata:
      labels:
        app: modules
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: modules
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: modules
      # Required pod anti-affinity prevents old and new ReplicaSets from ever
      # stacking two modules pods on one hot-path node.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: modules
          image: ghcr.io/adamousmer/itsbagelbot/modules:main-1787011027-4cfd46290494@sha256:df3ecc02ab30e61b6c0c384c2af9598cbe03760f2be072b18996200abaeb1352 # {"$imagepolicy": "flux-system:modules"}
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_HOST
              value: nats
            # Split planes: the BUS / JetStream connection dials the hub directly
            # (NATS_HUB_URL) so stream traffic never pays a leaf forwarding hop;
            # the RPC + cache plane (NATS_RPC_URL / NATS_LEAF_URL) stays on the
            # node-local leaf. NATS_URL is the local-dev fallback only.
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_HUB_PUBLISH_URL
              value: tls://nats.messaging:4222
            # Fleet CA (trust-manager fleet-ca ConfigMap) to verify the NATS
            # server's native-TLS cert; read as RootCAs by pkg/bus (Go services)
            # and the console nats lib (TS).
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_MAX_OPEN_CONNS
              value: "4"
            - name: DB_QUERY_CONCURRENCY
              value: "4"
            - name: DB_AUTO_MIGRATE
              value: "true"
            - name: GOMEMLIMIT
              value: 160MiB
            # Tink keyset for at-rest Govee API-key encryption (this service's
            # own keyset, distinct from users'), consumed as a file. The mount is
            # optional (see volumes): until the TINK_KEYSET secret is provisioned
            # the file is absent and the service degrades to "govee off" rather
            # than crash-looping.
            - name: TINK_KEYSET_PATH
              value: /etc/tink/keyset.json
            # Serve HTTPS on 8080 with the cert-manager modules-tls cert so the
            # traefik hop to /status is TLS end-to-end (pkg/health reads the
            # pair; both or neither, a half-set pair fails the listener).
            - name: TLS_CERT_FILE
              value: /etc/modules/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/modules/tls/tls.key
            # mTLS client identity for both NATS planes (nats-client-tls,
            # cert-manager). Presented on every dial; harmless until the
            # listeners flip verify:true.
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: modules-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/modules/tls, readOnly: true}
            - name: tink-keyset
              mountPath: /etc/tink
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18 # 18 × 5s = 90s max startup window
            periodSeconds: 5
      terminationGracePeriodSeconds: 45
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: modules-tls
        # Optional: a missing TINK_KEYSET key leaves the file absent, and the
        # service disables govee key custody instead of failing to start.
        - name: tink-keyset
          secret:
            secretName: modules-env
            optional: true
            items:
              - key: TINK_KEYSET
                path: keyset.json
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: modules
  namespace: db
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: modules
