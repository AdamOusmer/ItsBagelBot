# discord-ingress is a singleton with Recreate: two Identify sessions on one bot token fight each other.

apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: discord-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: discord-doppler-token
  managedSecret:
    name: discord-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-ingress
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discord-ingress
  template:
    metadata:
      labels:
        app: discord-ingress
        component: discord
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: discord-ingress
          image: ghcr.io/adamousmer/itsbagelbot/discord-ingress:v0.2.4-beta@sha256:56d3853b17a62ebf86b498400d9bdad0b638f9f1377aab68cfad8b0d30746fee
          imagePullPolicy: IfNotPresent
          env:
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 512MiB
            - name: TLS_CERT_FILE
              value: /etc/discord-ingress/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/discord-ingress/tls/tls.key
            - name: NATS_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
            - name: APP_ENV
              valueFrom:
                secretKeyRef: {name: discord-env, key: APP_ENV}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: discord-env, key: VALKEY_PASSWORD}
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef: {name: discord-env, key: NEW_RELIC_LICENSE_KEY}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_BOT_TOKEN}
            - name: NATS_JWT
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_INGRESS_BUS_JWT}
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_INGRESS_BUS_NKEY_SEED}
            # Required: without the RPC pair pkg/bus falls back to BUS and users counts.get silently fails.
            - name: NATS_RPC_JWT
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_INGRESS_RPC_JWT}
            - name: NATS_RPC_NKEY_SEED
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_INGRESS_RPC_NKEY_SEED}
          volumeMounts:
            - {name: health-tls, mountPath: /etc/discord-ingress/tls, readOnly: true}
            - name: nats-client-tls
              mountPath: /etc/nats-client/tls
              readOnly: true
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: health-tls
          secret:
            secretName: discord-ingress-tls
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discord-ingress
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: discord-ingress
---
