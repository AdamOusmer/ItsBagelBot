            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-service
      containers:
        - name: discord-outgress
          image: ghcr.io/adamousmer/itsbagelbot/discord-outgress:main-1788522822-f1c3dba6e74d@sha256:0c0de36207ff473e338a5a43c1203ad4cfa2f8a6bd44a30519c2de3d4599fb52
          imagePullPolicy: IfNotPresent
          env:
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
