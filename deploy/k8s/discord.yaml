              valueFrom:
                secretKeyRef: {name: discord-env, key: NEW_RELIC_LICENSE_KEY}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_BOT_TOKEN}
            # BUS-account credentials for discord_outgress_bus.
            - name: NATS_USER
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_OUTGRESS_BUS_USER}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_OUTGRESS_BUS_PASSWORD}
            # RPC-account credentials for discord_outgress_rpc (serves the
            # dashboard-facing guild setup RPC and the engine-facing RPC;
            # calls nothing).
            - name: NATS_RPC_USER
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_OUTGRESS_RPC_USER}
            - name: NATS_RPC_PASSWORD
              valueFrom:
                secretKeyRef: {name: discord-env, key: DISCORD_OUTGRESS_RPC_PASSWORD}
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/discord-outgress/tls, readOnly: true}
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: discord-outgress-tls
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discord-outgress
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: discord-outgress
