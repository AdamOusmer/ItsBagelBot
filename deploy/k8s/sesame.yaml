apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: sesame-env
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: sesame-doppler-token
  managedSecret:
    name: sesame-env
    namespace: app
    type: Opaque
  resyncSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sesame
  namespace: app
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: sesame
  template:
    metadata:
      labels:
        app: sesame
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: sesame
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-service
      containers:
        - name: sesame
          image: ghcr.io/adamousmer/itsbagelbot/sesame:v0.2.3-beta@sha256:cea52d8c2c64dc2e9546dfab57a302fd82c553e07781c90a347ff1835979c7bc
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_HOST
              value: nats
            - name: NATS_URL
              value: tls://nats.messaging:4222
            - name: NATS_HUB_URL
              value: tls://nats.messaging:4222
            - name: NATS_HUB_PUBLISH_URL
              value: tls://nats.messaging:4222
            - name: NATS_PUBLISH_WIRE
              value: atomic
            - name: NATS_ATOMIC_PUBLISH_BATCH_SIZE
              value: "256"
            - name: NATS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_CA_PEM
              valueFrom:
                configMapKeyRef:
                  name: fleet-ca
                  key: ca.pem
            - name: VALKEY_TLS_SERVER_NAME
              value: valkey.cache.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.cache.svc.cluster.local:26380
            - name: VALKEY_TLS_CLIENT_CERT_FILE
              value: /etc/valkey/client-tls/tls.crt
            - name: VALKEY_TLS_CLIENT_KEY_FILE
              value: /etc/valkey/client-tls/tls.key
            - name: NATS_RPC_URL
              value: tls://nats-leaf.messaging:4222
            - name: NATS_LEAF_URL
              value: tls://nats-leaf.messaging:4222
            - name: SSL_CERT_FILE
              value: /etc/nats-ca/ca.pem
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: VALKEY_LOCAL_ADDR
              value: valkey-local.cache.svc.cluster.local:6380
            - name: GOMEMLIMIT
              value: 512MiB
            # The broker's MSG.NEXT grant must land first, or the lane silently drops to zero events.
            - name: NATS_CONSUME_FLOW
              value: "on"
            - name: NATS_CONSUME_MODE
              value: pull
            - name: NATS_PULL_FETCH_LOOPS
              value: "8"
            - name: NATS_PULL_MAX_ACK_PENDING
              value: "200000"
            - name: NATS_PULL_FETCH_BATCH
              value: "250"
            - name: NATS_PULL_CONNECTIONS
              value: "1"
            - name: NATS_PULL_EXPIRY
              value: 5s
            # Every twitch-ingress pod must stage per-subject cohorts first, or mixed batches are silently rejected.
            - name: NATS_INGRESS_PARTITION
              value: "on"
            - name: SESAME_CONSUMER_NAME
              value: worker
            - name: SESAME_MIN_ROUTINES
              value: "100"
            - name: SESAME_MAX_ROUTINES
              value: "100"
            - name: SESAME_MIN_CONSUMERS
              value: "4"
            - name: SESAME_MAX_CONSUMERS
              value: "4"
            - name: NATS_PUBLISH_CONNECTIONS
              value: "4"
            - name: NATS_ATOMIC_PUBLISH_BATCH_WAIT
              value: 1ms
            - name: NATS_ATOMIC_ACK_FIRST
              value: "true"

            - name: NATS_PUBLISH_INFLIGHT_COHORTS
              value: "16"
            - name: NATS_PUBLISH_QUEUE_SIZE
              value: "512"
            # An expired commit wait is an at-most-once loss: keep it above every commit tail.
            - name: NATS_PUBLISH_ACK_WAIT
              value: 5s
            - name: SESAME_SCALE_UP_AFTER
              value: 2s
            - name: SESAME_SCALE_DOWN_AFTER
              value: 45s
            - name: SESAME_PREMIUM_RESERVE_PERCENT
              value: "25"
            - name: SESAME_LIVE_TTL
              value: 12h
            - name: NATS_OUTGRESS_SYSTEM_SUBJECT
              value: twitch.outgress.system
            - name: NATS_BROADCASTER_LIVE_SUBJECT
              value: bagel.rpc.broadcaster.live.get
            - name: TLS_CERT_FILE
              value: /etc/sesame/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/sesame/tls/tls.key
            - name: NATS_CLIENT_CERT_FILE
              value: /etc/nats-client/tls/tls.crt
            - name: NATS_CLIENT_KEY_FILE
              value: /etc/nats-client/tls/tls.key
          envFrom:
            - secretRef:
                name: sesame-env
          volumeMounts:
            - {name: nats-client-tls, mountPath: /etc/nats-client/tls, readOnly: true}
            - {name: health-tls, mountPath: /etc/sesame/tls, readOnly: true}
            - name: fleet-ca
              mountPath: /etc/nats-ca
              readOnly: true
            - name: valkey-client-tls
              mountPath: /etc/valkey/client-tls
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          lifecycle:
            preStop:
              httpGet:
                path: /drain
                port: 8080
                scheme: HTTPS
          livenessProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: 8080, scheme: HTTPS}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: 8080, scheme: HTTPS}
            failureThreshold: 18
            periodSeconds: 5
      volumes:
        - name: nats-client-tls
          secret:
            secretName: nats-client-tls
        - name: health-tls
          secret:
            secretName: sesame-tls
        - name: fleet-ca
          configMap:
            name: fleet-ca
        - name: valkey-client-tls
          secret:
            secretName: valkey-client-tls
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sesame
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: sesame
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sesame
  namespace: app
spec:
  scaleTargetRef:
    name: sesame
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 12
  fallback:
    failureThreshold: 3
    replicas: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 2, periodSeconds: 30}
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - {type: Pods, value: 1, periodSeconds: 120}
  triggers:
    - type: cpu
      metricType: AverageValue
      metadata:
        value: "300m"
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.messaging.svc.cluster.local:8222
        account: BUS
        stream: TWITCH_INGRESS
        consumer: worker_twitch_ingress_event_premium
        lagThreshold: "1500"
        activationLagThreshold: "500"
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.messaging.svc.cluster.local:8222
        account: BUS
        stream: TWITCH_INGRESS_STANDARD
        consumer: worker_twitch_ingress_event_standard
        lagThreshold: "6000"
        activationLagThreshold: "2000"
