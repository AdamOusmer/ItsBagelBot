apiVersion: v1
kind: Namespace
metadata:
  name: ops
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader
  namespace: ops
---
# Reloader hashes Secret data to spot a renewal; it never needs write access to them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reloader
  namespace: app
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, update, patch]
  - apiGroups: ["apps"]
    resources: [daemonsets, statefulsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reloader
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reloader
subjects:
  - kind: ServiceAccount
    name: reloader
    namespace: ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader
  namespace: ops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reloader
  template:
    metadata:
      labels:
        app: reloader
    spec:
      serviceAccountName: reloader
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp, worker]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      priorityClassName: bagel-operator
      containers:
        - name: reloader
          image: ghcr.io/stakater/reloader:v1.4.23@sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410
          imagePullPolicy: IfNotPresent
          args:
            - --namespaces=app
            - --resources-to-ignore=configMaps
            - --resource-label-selector=itsbagelbot.com/reloader:watch
            - --ignored-workload-types=jobs,cronjobs
            - --reload-strategy=annotations
            - --log-format=json
          env:
            - name: GOMEMLIMIT
              value: 80MiB
          ports:
            - {name: http, containerPort: 9090}
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /metrics, port: http}
            periodSeconds: 10
      terminationGracePeriodSeconds: 15
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reloader
  namespace: ops
spec:
  podSelector:
    matchLabels:
      app: reloader
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
---
# No toFQDNs or dns rules: Cilium's DNS proxy never answers on these nodes, so the pod would resolve nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reloader-egress
  namespace: ops
spec:
  endpointSelector:
    matchLabels:
      app: reloader
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
