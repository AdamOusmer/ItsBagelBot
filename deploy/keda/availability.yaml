# maxUnavailable, never minAvailable 1: every component runs one replica, and minAvailable 1 blocks every node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-operator
  namespace: keda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: keda-operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-metrics-apiserver
  namespace: keda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: keda-metrics-apiserver
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-admission-webhooks
  namespace: keda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: keda-admission-webhooks
