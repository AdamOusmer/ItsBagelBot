# maxUnavailable 1 against 2 replicas: a drain must never take both replicas of an apiserver dependency.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-operator
  namespace: keda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: keda-operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-metrics-apiserver
  namespace: keda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: keda-metrics-apiserver
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keda-admission-webhooks
  namespace: keda
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: keda-admission-webhooks
