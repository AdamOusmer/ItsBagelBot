apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keda
resources:
  - keda-2.20.2.yaml
  - availability.yaml
  - network-policies.yaml
patches:
  - target: {kind: Deployment, namespace: keda}
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {role: node}
      - op: add
        path: /spec/template/spec/priorityClassName
        value: bagel-operator
  - target: {kind: Deployment, name: keda-metrics-apiserver, namespace: keda}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: keda-admission, namespace: keda}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: keda-operator, namespace: keda}
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app: keda-operator}}
  - target: {kind: Deployment, name: keda-metrics-apiserver, namespace: keda}
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app: keda-metrics-apiserver}}
  - target: {kind: Deployment, name: keda-admission, namespace: keda}
    patch: |
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app: keda-admission-webhooks}}
  - target: {kind: Deployment, name: keda-operator, namespace: keda}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
  - target: {kind: Deployment, name: keda-metrics-apiserver, namespace: keda}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
  - target: {kind: Deployment, name: keda-admission, namespace: keda}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 500m, memory: 256Mi}
