apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-keda
  namespace: keda
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16]
      ports:
        - port: 8081
        - port: 6443
    - from:
        - podSelector:
            matchLabels:
              app: keda-metrics-apiserver
      ports:
        - port: 9666
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: keda-operator
      ports:
        - port: 9666
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-operator-nats
  namespace: keda
spec:
  podSelector:
    matchLabels:
      app: keda-operator
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
          podSelector:
            matchLabels:
              app: nats
      ports:
        - port: 8222
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apiserver
  namespace: keda
spec:
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
            - {port: "9443", protocol: TCP}
