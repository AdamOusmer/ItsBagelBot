# Server certs for the app namespace, issued from the fleet intermediate CA
# (fleet-selfsigned -> fleet-ca-issuer -> fleet-intermediate-issuer). Recovered
# from the purged deploy/infra/pki repo (git show a8b810e5:deploy/infra/pki/
# certificates.yaml) and re-pointed at this cluster's `app` namespace — the old
# cluster ran every service under `production`. console-admin-tls did not make
# the move: console-admin now terminates over the tailscale ingress class,
# which provisions and rotates its own cert, so there is no traefik-facing
# secret left for cert-manager to own.
#
# The ten <svc>-tls certs below back the per-service /status health listeners
# added in PR #591. Same shape: tls.crt/tls.key/ca.crt in an app-namespace
# Secret, reloaded by each service (Go handshake hook or the BEAM ssl pem
# cache) without a pod restart. SANs cover the four forms a ClusterIP Service
# name resolves to, since traefik's ServersTransport per service pins
# serverName to the short form (deploy/k8s/status-routes.yaml).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-dashboard-tls
  namespace: app
spec:
  secretName: console-dashboard-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - console-dashboard
    - console-dashboard.app.svc.cluster.local
