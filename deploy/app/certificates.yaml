---
# Fleet NATS client identity (mTLS). Every app-tier NATS client (Go services,
# consoles, twitch-ingress) mounts this and presents it via
# NATS_CLIENT_CERT_FILE/NATS_CLIENT_KEY_FILE; the hub and leaf client
# listeners verify it against the fleet intermediate CA once verify:true
# lands there. usages pins it to client auth so it can never double as a
# server cert.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-client-tls
  namespace: app
spec:
  secretName: nats-client-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
    - client auth
  commonName: nats-client.app.svc.cluster.local
  dnsNames:
    - nats-client.app.svc.cluster.local
