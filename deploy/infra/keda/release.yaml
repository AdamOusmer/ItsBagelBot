# KEDA: greenfield install (no prior out-of-band release to migrate, unlike
# newrelic.yaml). Drives horizontal scaling for outgress and sesame off
# JetStream consumer lag (see their ScaledObjects in deploy/k8s/outgress.yaml
# and deploy/k8s/sesame.yaml) plus a CPU floor.
#
# Namespace "keda" does not pre-exist, so install.createNamespace is true
# (contrast newrelic, whose namespace was created out-of-band).
#
# This lives in its own Kustomization (deploy/flux/clusters/production/keda.yaml)
# rather than inline like newrelic.yaml, because the `apps` Kustomization
# (deploy/k8s/) now contains ScaledObject resources that require KEDA's CRDs to
# already be registered. Flux's Kustomization.dependsOn can only reference
# another Kustomization, not a bare HelmRelease, so KEDA needed a Kustomization
# of its own for `apps` to depend on (see apps.yaml's dependsOn).
#
# CHART VERSION
# -------------
# keda 2.20.1 (matches appVersion 2.20.1), exact pin per deploy/flux/README.md's
# digest-immutability rationale. Bump deliberately; ScaledObject's CRD schema
# can gain fields between versions.
#
# RESOURCES
# ---------
# Chart defaults are 100m/100Mi request, 1/1000Mi limit for EACH of
# operator/metricsServer/webhooks (up to ~3 CPU, 3Gi limit ceiling). Trimmed
# down for this 3-node fleet the same way newrelic's kubelet integration and
# the flux controllers were (see newrelic.yaml, flux-system/kustomization.yaml
# patches): these are a low-throughput personal-scale cluster with a handful of
# ScaledObjects, not a metric being polled fleet-wide every second. Re-widen if
# metrics-server or operator gets OOMKilled or throttled in practice.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
  namespace: flux-system
spec:
  interval: 1h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 1h
  timeout: 10m
  releaseName: keda
  chart:
    spec:
      chart: keda
      version: 2.20.1 # exact pin
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # CreateReplace (not the install-time default Create): lets a future chart
    # bump patch an existing ScaledObject/TriggerAuthentication CRD in place,
    # instead of silently keeping the schema this cluster was bootstrapped with.
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    watchNamespace: "" # all namespaces; only production uses it today, but the fleet is single-tenant
    # KEDA 2.20 reads component sizing from the top-level resources map.
    # Putting resources under operator/metricsServer/webhooks is accepted as
    # unused YAML and silently falls back to 100m/100Mi + 1CPU/1000Mi defaults.
    resources:
      operator:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      metricServer:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      webhooks:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 250m, memory: 128Mi}
    # PLACEMENT IS PER-COMPONENT, AND THE SPLIT IS LOAD-BEARING.
    #
    # Chart 2.20.1 reads placement from operator/metricsServer/webhooks, NOT from
    # a top-level `affinity`. This is the exact inverse of `resources` above, and
    # it bites the same way: a top-level `affinity:` block is accepted as unused
    # YAML and silently dropped. That is what happened here: every KEDA pod ran
    # with no affinity and no tolerations at all, and stayed off the control plane
    # only because node1 carries the itsbagelbot.dev/role=cp:NoSchedule taint.
    # Verify a change landed; do not trust that the key was read:
    #   kubectl -n keda get deploy keda-operator -o jsonpath='{.spec.template.spec.affinity}'
    #
    # metricsServer and webhooks -> CONTROL PLANE. operator -> APP TIER.
    #
    # metricsServer and webhooks are called SYNCHRONOUSLY BY THE APISERVER:
    # metricsServer backs the v1beta1.external.metrics.k8s.io aggregated
    # APIService, webhooks back the keda-admission ValidatingWebhookConfiguration.
    # Pinning them beside the apiserver keeps those calls node-local. An
    # unreachable aggregated APIService is worse than an unreachable backend: it
    # stalls API discovery cluster-wide, not just KEDA.
    #
    # The operator used to follow them onto the control plane so the
    # metricsServer -> operator gRPC hop (:9666) stayed node-local. The
    # configured endpoint is fine from there — measured 2026-08-17 from a pod on
    # the control plane, nats.production.svc.cluster.local:8222/jsz returns 72455
    # bytes in 8ms, TCP 10/10 to the ClusterIP and 5/5 to each member. The
    # configured endpoint is not the hop that fails.
    #
    # The SECOND hop is. In clustered mode the scaler reads /jsz, finds the
    # stream's leader, then dials that member directly for /varz, choosing from
    # the addresses NATS gossips in connect_urls. A hostNetwork member listening
    # on 0.0.0.0 gossips EVERY local interface, so the set is:
    #
    #   38.49.213.227   public
    #   10.10.0.4       provider VLAN
    #   100.72.196.29   tailnet (plus its IPv6)
    #   10.44.2.100     cilium host address
    #
    # Only the fleet can route all four. From the control plane the VLAN is not
    # routed at all and never will be — advertising 10.10.0.0/24 off the fleet is
    # a standing no — so whenever the scaler picks it the fetch dies:
    #
    #   Get "http://10.10.0.4:8222/varz": context deadline exceeded
    #
    # It is intermittent because the choice is, which is why both ScaledObjects
    # flap between real metrics and Fallback=True on static replicas rather than
    # failing outright. During the 2026-08-16 lane outage they were pinned in
    # fallback, so nothing scaled up, and a fresh pod is what would have
    # re-provisioned the deleted lane durables: the deletion that killed the
    # lanes also blinded the autoscaler that would have healed them.
    #
    # On the app tier every gossiped address is on-link or local, so the
    # leader-follow always resolves whichever one it picks. The cost is that the
    # metricsServer -> operator gRPC hop becomes cross-node: one pod-mesh round
    # trip per HPA metric fetch, roughly every 15s per ScaledObject. That is a
    # rounding error against a scaler that cannot read its own broker's leader.
    #
    # The other way to fix this is client_advertise on the NATS side, so members
    # stop gossiping VLAN, tailnet and pod addresses to everyone. That is a
    # fleet-wide change to how every client discovers the cluster; this one moves
    # a single deployment. Do the narrow one first.
    #
    # Do NOT point the nats-jetstream triggers at the nats-monitoring Tailscale
    # Service instead. Same second hop, same outcome: the scaler fetches /jsz
    # fine and then dials the leader at a gossiped address the tailnet Service
    # cannot front. The tailnet Service is kept for humans.
    #
    # Required, not preferred, on both tiers: a preference lets the scheduler
    # rebalance a component across the boundary and silently restore the failure.
    operator:
      # No control-plane toleration: the app nodes carry no taint, and leaving it
      # here would let the scheduler put the operator back where it cannot scrape.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: itsbagelbot.dev/role
                    operator: In
                    values: [node]
    metricsServer:
      tolerations: &cpToleration
        - key: itsbagelbot.dev/role
          operator: Equal
          value: cp
          effect: NoSchedule
      affinity: &cpAffinity
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: itsbagelbot.dev/role
                    operator: In
                    values: [cp]
    webhooks:
      tolerations: *cpToleration
      affinity: *cpAffinity
