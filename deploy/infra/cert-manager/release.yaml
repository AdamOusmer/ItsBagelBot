# cert-manager + trust-manager (deploy/infra/cert-manager/). Separate
# Kustomization (deploy/flux/clusters/production/cert-manager.yaml), same shape as
# keda.yaml: targetNamespace stays unset so the HelmRepository (flux-system) and
# the HelmReleases (cert-manager namespace) keep their own namespaces, unlike
# `apps` which pins everything to production.
#
# WHY
# ---
# NATS provides its own wire encryption via NATS-native TLS (see nats.yaml /
# nats-leaf.yaml). cert-manager is the battle-tested, CNCF-graduated PKI that
# issues + auto-renews the server certs; trust-manager distributes the public CA
# to a ConfigMap the apps read (fleet-ca). The PKI custom resources (Issuer, CA,
# Certificates, Bundle) live in deploy/infra/pki/, applied by the `pki`
# Kustomization which dependsOn this one.
#
# CHART VERSIONS
# --------------
# Exact pins per deploy/flux/README.md's immutability rationale. CONFIRM the
# current stable tags before first apply and bump deliberately (CRD schemas can
# change between minors): cert-manager releases and trust-manager releases track
# separately in the jetstack chart repo.
# The HelmReleases below live in the cert-manager namespace, so it must exist
# before the Kustomization applies them (a HelmRelease cannot be created into a
# missing namespace — the KEDA deploy-train lesson). Helm's own createNamespace
# only covers the chart install, not the placement of the HelmRelease object.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  timeout: 10m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.17.4 # exact pin — latest stable, validated vs this k8s 1.35 fleet; bump deliberately
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    # CreateReplace lets a future chart bump patch the cert-manager CRDs in place
    # instead of keeping the schema this cluster was bootstrapped with (same
    # rationale as keda.yaml).
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # crds.enabled installs the CRDs via the chart (paired with install.crds
    # above). Keep true so Flux owns them.
    crds:
      enabled: true
      keep: true
    # Trimmed for this small fleet, same as keda/newrelic. Re-widen if the
    # controller/webhook/cainjector is throttled or OOMKilled in practice.
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
    # cert-manager belongs with the control plane. The controller and cainjector
    # are ordinary reconcilers, so a preference is enough for them: if node1 is
    # full they can run anywhere and just take an extra hop.
    tolerations: &cpToleration
      - key: itsbagelbot.dev/role
        operator: Equal
        value: cp
        effect: NoSchedule
    affinity: &cpPreferred
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: itsbagelbot.dev/role
                  operator: In
                  values: [cp]
    webhook:
      resources:
        requests: {cpu: 10m, memory: 96Mi}
        limits: {cpu: 200m, memory: 128Mi}
      tolerations: *cpToleration
      # REQUIRED on cp, unlike the controller above. The webhook is called
      # SYNCHRONOUSLY by the apiserver on every Certificate/Issuer admission and
      # its failurePolicy is Fail, so that hop must never depend on the pod
      # network. A preference does not actually protect availability here, it
      # only changes which failure wedges admission: the pod drifted onto node4
      # (2026-07-27), and once the pod mesh moves to the private VLAN, node1
      # reaches node4/5/6 only through a tailscale subnet route with a single
      # advertiser. Pinning it node-local means the only thing that can break the
      # call is node1 itself, and if node1 is down the apiserver is down too, so
      # admission is moot. That trades a real distributed failure for a vacuous
      # one. Cost of being wrong is bounded: the webhook rules cover only
      # cert-manager.io resources, so a wedge blocks Certificate/Issuer writes,
      # not general pod admission.
      affinity: &cpRequired
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: itsbagelbot.dev/role
                    operator: In
                    values: [cp]
    cainjector:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 200m, memory: 256Mi}
      tolerations: *cpToleration
      affinity: *cpPreferred
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 1h
  timeout: 10m
  releaseName: trust-manager
  # trust-manager's webhook depends on cert-manager being up to issue its own
  # serving cert, so install it after.
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: trust-manager
      version: v0.24.0 # exact pin — latest stable; bump deliberately
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # trust-manager watches this namespace for Bundle source secrets. The CA lives
    # in cert-manager (where the fleet-ca Certificate writes fleet-ca-key-pair).
    # Matches the chart default; set explicitly for clarity.
    app:
      trust:
        namespace: cert-manager
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
    # Pinned to the control plane for the same reason as cert-manager's webhook:
    # trust-manager serves a ValidatingWebhookConfiguration with failurePolicy
    # Fail, called synchronously by the apiserver on every Bundle admission.
    #
    # Until now it carried NO toleration and NO affinity, so it could never land
    # on node1 at all (the cp taint repelled it) and sat on node4, where the apiserver
    # reached its Fail-policy webhook across the pod network, over the very link
    # the private VLAN is about to change. Written out in full rather than reusing
    # the &cpToleration / &cpRequired anchors above: YAML anchors do not cross a
    # document boundary, and a dangling alias here is a parse error, not a
    # silently ignored key.
    tolerations:
      - key: itsbagelbot.dev/role
        operator: Equal
        value: cp
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: itsbagelbot.dev/role
                  operator: In
                  values: [cp]
