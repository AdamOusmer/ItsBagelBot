# Server certs issued from the fleet intermediate CA (deploy/infra/pki/issuers.yaml),
# not the root — the root now only ever signs the one intermediate. Each writes a
# tls.crt/tls.key/ca.crt Secret in production; the NATS and console pods mount it
# as their server cert. cert-manager's CA issuer walks the signing secret's own
# ca.crt when building the output bundle, so ca.crt here still ends up as the
# ROOT certificate (not the intermediate) and tls.crt ends up as leaf+intermediate
# — unchanged consumer-facing shape, verified against cert-manager v1.17.4 source
# and against the live secrets before this file changed. Clients verify the
# server against the CA (distributed as the fleet-ca ConfigMap, see trust.yaml) —
# no per-client certs.
#
# SANs must cover every name a peer dials: the Service name, its FQDN, and (for
# the hub) the per-pod headless names used by the cluster routes.
#
# nats-bus-client-tls below is the one exception: a CLIENT cert, not a server
# cert. The hub's 4222 listener and the leaf's 4223 listener both set
# verify:true (nats-server.conf, nats-leaf-server.conf), so every service
# connection to either must present a cert chaining to this same CA or the
# TLS handshake is refused before auth.conf's bcrypt user/password check ever
# runs. One shared cert for every connecting service is intentional, echoing
# valkey-server-tls above: verify:true here is chain-of-trust only (NOT
# verify_and_map), so it does not need a distinct identity per client — every
# holder is equally trusted to attempt the existing per-account bcrypt auth,
# exactly as before. commonName is a label, not a security boundary;
# dnsNames/ipAddresses are irrelevant since nats-server's verify:true does not
# hostname-check the CLIENT cert (only the reverse, server->client, direction
# is SAN-sensitive, and that is nats-hub-tls/nats-leaf-tls above).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-hub-tls
  namespace: production
spec:
  secretName: nats-hub-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - nats
    - nats.production
    - nats.production.svc
    - nats.production.svc.cluster.local
    - nats-headless
    - nats-headless.production.svc.cluster.local
    - nats-0.nats-headless.production.svc.cluster.local
    - nats-1.nats-headless.production.svc.cluster.local
    - nats-2.nats-headless.production.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-bus-client-tls
  namespace: production
spec:
  secretName: nats-bus-client-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  # cert-manager requires at least one of commonName/dnsNames/uris/ipAddresses;
  # this is a client cert with no hostname meaning, so commonName is a plain
  # label. usages defaults to ["digital signature", "key encipherment"] only —
  # add "client auth" explicitly so the CA-issued cert states what it is for.
  commonName: "nats-bus-client"
  usages:
    - digital signature
    - key encipherment
    - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leaf-tls
  namespace: production
spec:
  secretName: nats-leaf-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - nats-leaf
    - nats-leaf.production.svc.cluster.local
    - nats-leaf-local
    - nats-leaf-local.production.svc.cluster.local
    - nats-leaf-peers
    - nats-leaf-peers.production.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-dashboard-tls
  namespace: production
spec:
  secretName: console-dashboard-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - console-dashboard
    - console-dashboard.production.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-admin-tls
  namespace: production
spec:
  secretName: console-admin-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - console-admin
    - console-admin.production.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: transactions-tls
  namespace: production
spec:
  secretName: transactions-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - transactions
    - transactions.production.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-server-tls
  namespace: valkey
spec:
  secretName: valkey-server-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  # Clients dial the Service name or a stable StatefulSet peer name. One shared cert is
  # intentional: the four servers form one trusted Valkey service and continue
  # to authenticate users with ACL passwords rather than client certificates.
  dnsNames:
    - valkey
    - valkey.valkey
    - valkey.valkey.svc
    - valkey.valkey.svc.cluster.local
    - valkey-headless
    - valkey-headless.valkey.svc.cluster.local
    - valkey-node-0.valkey-headless.valkey.svc.cluster.local
    - valkey-node-1.valkey-headless.valkey.svc.cluster.local
    - valkey-node-2.valkey-headless.valkey.svc.cluster.local
    - valkey-node-3.valkey-headless.valkey.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-client-tls
  namespace: production
spec:
  secretName: valkey-client-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fleet-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  # One shared client cert for every consumer (sesame, outgress, gossip,
  # projector, console-dashboard, console-admin), deliberately mirroring the
  # "one shared server cert" decision above: tls-auth-clients yes only checks
  # chain-to-CA (tls-auth-clients-user is off), it does not map cert CN/identity
  # to ACL users. Per-service certs would buy per-service revocation and
  # nothing else today, at the cost of 6x the Certificate/Secret/rotation
  # surface. Revisit if tls-auth-clients-user mapping is ever adopted.
  #
  # config-init and all six health probes do NOT use this cert: they already
  # mount valkey-server-tls and reuse tls.crt/tls.key directly as their
  # outbound client identity (see statefulset.yaml). This Certificate is only
  # for the app-tier clients outside the valkey namespace.
  #
  # No SANs required for function -- Valkey's TLS layer does not check client
  # cert SAN/EKU (valkey-server-tls above carries no Extended Key Usage
  # extension either, which is why it already doubles as both a server cert
  # and, for the valkey pods' own outbound links, a client cert). dnsNames
  # below are for openssl/debugging readability only.
  commonName: valkey-client.production.svc.cluster.local
  dnsNames:
    - valkey-client.production.svc.cluster.local
