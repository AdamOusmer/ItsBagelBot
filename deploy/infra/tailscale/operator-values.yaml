# Values for the manually installed tailscale-operator Helm release.
#
# Keep this separate from kustomization.yaml: the existing release owns its
# OAuth Secret and must be upgraded with --reuse-values until that credential
# is migrated to Doppler/Flux. Apply resource changes with:
#
#   helm upgrade tailscale-operator tailscale/tailscale-operator \
#     --namespace tailscale --version 1.98.4 --reuse-values \
#     --values deploy/infra/tailscale/operator-values.yaml
#
# The operator currently uses about 3m CPU and 200Mi memory. Memory is the
# scheduling dimension here; CPU remains burstable for reconciliation storms.
operatorConfig:
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The operator IS the tailnet-facing API proxy, so it belongs beside the API
  # server it fronts. node1 is the control plane and is tainted
  # itsbagelbot.dev/role=cp:NoSchedule, hence the toleration.
  #
  # PREFERRED, deliberately never required: this operator is how kubectl reaches
  # the cluster over the tailnet, so hard-pinning it to a single un-replicated
  # control plane would mean losing node1 costs all cluster access at the moment
  # you most need it. A preference keeps it beside the apiserver in steady state
  # and lets it fall back to the app tier otherwise.
  tolerations:
    - key: itsbagelbot.dev/role
      operator: Equal
      value: cp
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: itsbagelbot.dev/role
                operator: In
                values: [cp]
