apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    # One logical keyspace with one Sentinel-elected writable primary.
    itsbagelbot.dev/valkey-partitioning: disabled
    itsbagelbot.dev/valkey-topology: sentinel-single-primary
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  name: valkey-node
  namespace: valkey
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # Parallel startup is safe: on a cold bootstrap ordinal 0 is the deterministic
  # seed and other FRESH members wait for its Sentinel view, so no two members can
  # both declare themselves primary. Nothing here depends on which node a member
  # lands on, which is what the previous hostname-based seed got wrong.
  podManagementPolicy: Parallel
  # Three colocated Valkey+Sentinel voters: one writable primary and two replicas,
  # every one of them promotable. Three is also the quorum arithmetic — quorum 2
  # of 3 tolerates losing any single member. CI-enforced invariant.
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app.kubernetes.io/instance: valkey
      app.kubernetes.io/name: valkey
  serviceName: valkey-headless
  template:
    metadata:
      annotations:
        # Replication and Sentinel announce stable StatefulSet DNS names over
        # Flannel's native WireGuard pod network. Valkey TLS provides
        # end-to-end identity and encryption on data port 6380 and Sentinel
        # port 26380; neither listener is exposed through a node hostPort.
        secrets.doppler.com/reload: 'true'
      labels:
        app.kubernetes.io/component: node
        app.kubernetes.io/instance: valkey
        app.kubernetes.io/name: valkey
    spec:
      # Seed the writable /data copies of valkey.conf and sentinel.conf ONCE.
      # After first boot valkey and sentinel own these files: valkey rewrites
      # replicaof on every Sentinel-driven failover and sentinel persists its
      # known peers/epoch, so a restarted pod reads its real current role from
      # /data instead of re-deriving it. Every member announces its stable
      # StatefulSet DNS identity, independent of the node it is scheduled on.
      initContainers:
      - name: config-init
        image: valkey/valkey@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          # Every member is equally eligible for promotion and Sentinel's own
          # election decides. The app tier is uniform hardware, so preferring or
          # fencing any particular host buys nothing.
          #
          # This replaced an explicit node allowlist (node2, node3, node4) that
          # gated promotion by hostname. When the fleet moved onto
          # node4/node5/node6 that list silently fenced two of the three live
          # members at replica-priority 0, leaving exactly one promotable member:
          # Sentinel could no longer fail over, so a single node loss meant no
          # writable primary. A host allowlist was never a staleness guarantee
          # either, since any allowlisted host could hold stale data.
          POD_FQDN="${POD_NAME}.valkey-headless.valkey.svc.cluster.local"
          lookup_master() {
            { REDISCLI_AUTH="${CORE}" valkey-cli -h valkey.valkey.svc.cluster.local -p 26380 --tls --cacert /etc/valkey/tls/ca.crt --sni valkey.valkey.svc.cluster.local --no-auth-warning sentinel get-master-addr-by-name myprimary 2>/dev/null || true; } \
              | head -n 1 | tr -d '"'
          }
          LIVE_MASTER=$(lookup_master)

          # A FRESH member with no Sentinel quorum to ask is the only case that
          # needs a deterministic choice: without one, three simultaneously-fresh
          # members would each declare themselves primary. Ordinal 0 seeds and the
          # others wait for its view. The seed is the ORDINAL, never a hostname,
          # so it stays correct wherever the members are scheduled — a hostname
          # seed is exactly what broke when its node left the fleet.
          # A member with a retained config already has a role and does not wait.
          if [ ! -f /data/valkey.conf ] && [ -z "${LIVE_MASTER}" ] && [ "${POD_NAME}" != "valkey-node-0" ]; then
            echo "Cold start with no Sentinel primary; waiting for valkey-node-0 to seed before starting ${POD_FQDN}"
            while [ -z "${LIVE_MASTER}" ]; do
              sleep 2
              LIVE_MASTER=$(lookup_master)
            done
          fi

          MASTER_ENDPOINT="${POD_FQDN}"
          if [ -n "${LIVE_MASTER}" ]; then
            MASTER_ENDPOINT="${LIVE_MASTER}"
          fi
          if [ ! -f /data/valkey.conf ]; then
            cp /config/valkey.conf /data/valkey.conf
            {
              echo "masterauth ${CORE}"
              echo "replica-announce-ip ${POD_FQDN}"
              echo "replica-announce-port 6380"
            } >> /data/valkey.conf
            # The seeding member reaches here with MASTER_ENDPOINT equal to its own
            # FQDN and writes no replicaof line, which is what makes it primary.
            if [ -n "${LIVE_MASTER}" ] && [ "${POD_FQDN}" != "${MASTER_ENDPOINT}" ]; then
              echo "replicaof ${MASTER_ENDPOINT} 6380" >> /data/valkey.conf
            fi
            chmod 600 /data/valkey.conf
          fi
          # Strip any replica-priority a retained config carries from the old
          # fenced scheme. Promotion is unfenced now and Valkey's default (100)
          # makes every member a candidate, so the correct action is to remove the
          # directive rather than to rewrite it.
          sed -i '/^replica-priority /d' /data/valkey.conf
          # Keep ConfigMap-backed runtime policy authoritative over retained
          # CONFIG REWRITE output. Moving the include to the end on every boot
          # makes a config change roll out without discarding Sentinel-owned
          # replication state in the writable file.
          sed -i '\|^include /config/tuning.conf$|d' /data/valkey.conf
          echo "include /config/tuning.conf" >> /data/valkey.conf
          # io-threads is deliberately reconciled on every boot instead of
          # only on fresh PVCs: CONFIG REWRITE persists old values.
          # Valkey 9.1 threads both reads and writes automatically; the former
          # io-threads-do-reads switch is deprecated and intentionally absent.
          sed -i '/^io-threads /d' /data/valkey.conf
          echo "io-threads 2" >> /data/valkey.conf
          # Reconcile this member's stable DNS identity before Valkey starts.
          sed -i '/^replica-announce-ip /d' /data/valkey.conf
          echo "replica-announce-ip ${POD_FQDN}" >> /data/valkey.conf
          # A planned failover may have changed the live primary after Valkey's
          # last CONFIG REWRITE. When Sentinel answered above, its current view
          # is authoritative: the primary must have no replicaof line and every
          # other member must follow that stable DNS endpoint.
          if [ -n "${LIVE_MASTER}" ]; then
            sed -i '/^replicaof /d' /data/valkey.conf
            if [ "${POD_FQDN}" != "${MASTER_ENDPOINT}" ]; then
              echo "replicaof ${MASTER_ENDPOINT} 6380" >> /data/valkey.conf
            fi
          fi
          # Retained PVCs carry Sentinel-rewritten topology. Move those live
          # addresses to the TLS listeners before either process starts; doing
          # this in config-init makes the migration repeatable after restores.
          sed -i -E \
            -e 's/^(replica-announce-port) 6379$/\1 6380/' \
            -e 's/^(replicaof [^ ]+) 6379$/\1 6380/' \
            /data/valkey.conf
          if [ ! -f /data/sentinel.conf ]; then
            cp /config/sentinel.conf /data/sentinel.conf
            {
              echo "requirepass ${CORE}"
              echo "sentinel auth-pass myprimary ${CORE}"
              echo "sentinel announce-ip ${POD_FQDN}"
              echo "sentinel announce-port 26380"
              echo "sentinel monitor myprimary ${MASTER_ENDPOINT} 6380 2"
            } >> /data/sentinel.conf
            chmod 600 /data/sentinel.conf
          fi
          sed -i '/^sentinel announce-ip /d' /data/sentinel.conf
          echo "sentinel announce-ip ${POD_FQDN}" >> /data/sentinel.conf
          sed -i '/^sentinel resolve-hostnames /d; /^sentinel announce-hostnames /d' /data/sentinel.conf
          {
            echo "sentinel resolve-hostnames yes"
            echo "sentinel announce-hostnames yes"
          } >> /data/sentinel.conf
          sed -i -E \
            -e 's/^(sentinel announce-port) 26379$/\1 26380/' \
            -e 's/^(sentinel monitor myprimary [^ ]+) 6379 (.+)$/\1 6380 \2/' \
            -e 's/^(sentinel known-replica myprimary [^ ]+) 6379$/\1 6380/' \
            -e 's/^(sentinel known-sentinel myprimary [^ ]+) 26379 (.+)$/\1 26380 \2/' \
            /data/sentinel.conf
          # A mixed-listener rollout can leave both the old endpoint and the
          # newly auto-discovered TLS endpoint in Sentinel's persisted state.
          # Port migration collapses those into the same address, which 9.1
          # correctly rejects as a duplicate. Keep the first stable identity;
          # Sentinel refreshes run IDs and topology through hello messages.
          awk '
            $1 == "sentinel" && ($2 == "known-replica" || $2 == "known-sentinel") && $3 == "myprimary" {
              endpoint = $2 FS $4 FS $5
              if (seen[endpoint]++) next
            }
            { print }
          ' /data/sentinel.conf > /data/sentinel.conf.dedup
          mv /data/sentinel.conf.dedup /data/sentinel.conf
          chmod 600 /data/sentinel.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # No NODE_NAME: the init script branched on which host it landed on to
        # decide promotion eligibility and the bootstrap seed. Nothing does now,
        # and not exposing it keeps placement out of role selection for good.
        - name: CORE
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /config
          name: valkey-config
          readOnly: true
        - mountPath: /etc/valkey/tls
          name: valkey-tls
          readOnly: true
      containers:
      # valkey-server runs the seeded /data/valkey.conf directly. masterauth and
      # the stable StatefulSet DNS identity come in as flags from the downward
      # API / secret so topology never depends on a node address.
      - command:
        - valkey-server
        - /data/valkey.conf
        - --replica-announce-ip
        - $(POD_NAME).valkey-headless.valkey.svc.cluster.local
        - --replica-announce-port
        - "6380"
        - --masterauth
        - $(CORE)
        # Keep the fleet unpartitioned and replicas read-only. These flags are
        # authoritative over retained /data/valkey.conf files that Valkey may
        # have rewritten before the policy was committed to the repository.
        - --cluster-enabled
        - "no"
        - --replica-read-only
        - "yes"
        # Command-line policy is authoritative even for retained PVC configs
        # written before these limits existed. This fixes failover replicas
        # that were still maxmemory=0/noeviction while preserving their role.
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - volatile-lru
        # Retained PVCs may contain an older plaintext port. Command-line
        # policy is authoritative so a restore cannot reopen it.
        - --port
        - "0"
        - --tls-port
        - "6380"
        - --tls-cert-file
        - /etc/valkey/tls/tls.crt
        - --tls-key-file
        - /etc/valkey/tls/tls.key
        - --tls-ca-cert-file
        - /etc/valkey/tls/ca.crt
        - --tls-auth-clients
        - "no"
        - --tls-replication
        - "yes"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CORE
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        image: valkey/valkey@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "6380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --sni
            - valkey.valkey.svc.cluster.local
            - ping
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: valkey
        ports:
        - containerPort: 6380
          name: redis-tls
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "6380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --sni
            - valkey.valkey.svc.cluster.local
            - ping
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        startupProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "6380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --sni
            - valkey.valkey.svc.cluster.local
            - ping
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            # 512 MiB maxmemory + 128 MiB replication backlog still need room
            # for allocator overhead, TLS buffers, AOF fork/COW and full sync.
            # A 2 GiB ceiling leaves a defensible worst-case fork/COW margin.
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /secrets/users
          name: users-secret
          readOnly: true
        - mountPath: /config
          name: valkey-config
          readOnly: true
        - mountPath: /etc/valkey/tls
          name: valkey-tls
          readOnly: true
      - command:
        - valkey-server
        - /data/sentinel.conf
        - --sentinel
        # Override Sentinel's rewritten PVC config as well as the ConfigMap.
        - --port
        - "0"
        - --tls-port
        - "26380"
        - --tls-cert-file
        - /etc/valkey/tls/tls.crt
        - --tls-key-file
        - /etc/valkey/tls/tls.key
        - --tls-ca-cert-file
        - /etc/valkey/tls/ca.crt
        - --tls-auth-clients
        - "no"
        - --tls-replication
        - "yes"
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        image: valkey/valkey@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --sni
            - valkey.valkey.svc.cluster.local
            - ping
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: sentinel
        ports:
        - containerPort: 26380
          name: sentinel-tls
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --sni
            - valkey.valkey.svc.cluster.local
            - ping
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        startupProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --sni
            - valkey.valkey.svc.cluster.local
            - ping
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 64Mi
          requests:
            # TLS health checks use 25-40m steadily on every replica.
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /etc/valkey/tls
          name: valkey-tls
          readOnly: true
      dnsPolicy: ClusterFirst
      priorityClassName: infra-low
      restartPolicy: Always
      # No role tolerations: Valkey belongs on the untainted application tier.
      # Required anti-affinity keeps exactly one member per node without
      # exposing Valkey through a hostPort.
      schedulerName: default-scheduler
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: node
                app.kubernetes.io/instance: valkey
                app.kubernetes.io/name: valkey
            topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: node
            app.kubernetes.io/instance: valkey
            app.kubernetes.io/name: valkey
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      volumes:
      - name: users-secret
        secret:
          defaultMode: 256
          secretName: valkey-users-secret
      - configMap:
          defaultMode: 420
          name: valkey-config
        name: valkey-config
      - name: valkey-tls
        secret:
          defaultMode: 288
          secretName: valkey-server-tls
      # Valkey storage is EPHEMERAL, deliberately. No volumeClaimTemplates, and
      # there must never be one again.
      #
      # A local-path PVC binds its PV to the node that provisioned it, so a
      # member whose node dies cannot be rescheduled: it sits Pending on
      # "didn't match PersistentVolume's node affinity" indefinitely. The same
      # pin took JetStream below quorum on 2026-07-27 when node5 was lost, and
      # turned one dead node into a full production outage.
      #
      # Losing a member's volume is cheap here. Replication rebuilds a replica
      # from the primary, and the whole dataset is derived state: projections are
      # rebuilt by the projector from the databases, and timers are re-armed by
      # the reconciler on its one-minute pass and by ArmAll on stream.online. The
      # init script already regenerates valkey.conf and sentinel.conf on every
      # boot from Sentinel discovery rather than reading them back off disk, so an
      # empty /data is the path it is written for, not an edge case.
      #
      # The honest trade: with PVCs, one surviving volume could repopulate the
      # set after a simultaneous loss of all three. Without them, that scenario
      # means a rebuild from the databases instead. That is the correct trade for
      # derived state, and it buys back the ability for any member to land on any
      # node, which is what actually keeps the service up.
      - name: valkey-data
        emptyDir:
          sizeLimit: 8Gi
  updateStrategy:
    type: RollingUpdate
