# k3s-managed traefik (HelmChartConfig overlays the bundled chart values).
# Lives in /var/lib/rancher/k3s/server/manifests conceptually; we apply it
# with kubectl and k3s reconciles the helm release.
#
# Deliberate choices:
#   - kind DaemonSet: exactly one traefik per node. This is what makes public
#     ingress HA (lose any node, the others still serve) AND is the precondition
#     for closest-node routing: with a traefik endpoint in every zone, the
#     service's trafficDistribution: PreferClose keeps cloudflared -> traefik on
#     the same node instead of round-robining across the trans-Atlantic fleet.
#     (A soft-anti-affinity Deployment did not hold: the scheduler drifted both
#     replicas onto one node, so a single node loss took down all ingress.)
#   - service type ClusterIP: traefik is reachable ONLY from inside the cluster.
#     Public traffic arrives via the outbound cloudflared tunnel (itself a
#     per-node DaemonSet), and the tailnet-facing admin path is the Tailscale
#     operator, so nothing legitimate connects to traefik on a node address.
#   - trafficDistribution PreferClose: prefer the same-zone (each node is its
#     own zone, so effectively same-node) endpoint, falling back across zones
#     only when the local one is gone (HA preserved).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    # Global HTTP->HTTPS redirect on the web (:8000/80) entrypoint. Single
    # static-config switch, applies to every host/path with no per-route
    # opt-out available -- this is the "client -> traefik" half of the "no
    # exceptions" requirement. The "traefik -> backend" half is NOT covered
    # by this (no such global switch exists in Traefik 3.6; scheme is set
    # per-service on each IngressRoute/Ingress -- see the CI check instead).
    additionalArguments:
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
    providers:
      kubernetesCRD:
        # The unrouted-host fallback (deploy/k8s/web-error-pages.yaml) proxies
        # stray hostnames to the marketing site through an ExternalName
        # Service, which the CRD provider refuses by default.
        allowExternalNameServices: true
    service:
      type: ClusterIP
      spec:
        trafficDistribution: PreferClose
        # cloudflared (kube-system-adjacent, cloudflared ns) lands on exactly
        # the same 3 worker nodes as this traefik DaemonSet (both gated by
        # itsbagelbot.dev/role != cp). PreferClose is a best-effort zone hint
        # and can still spill a request to a traefik pod on another node;
        # internalTrafficPolicy: Local makes the node-local hop a hard
        # requirement instead, closing the cross-node hairpin. Safe here
        # specifically because cloudflared's node set is a subset of
        # traefik's -- Local never leaves a node with zero endpoints.
        # If cloudflared's placement rules ever diverge from traefik's,
        # this must be revisited before it silently fails closed.
        internalTrafficPolicy: Local
    resources:
      requests:
        cpu: 100m
        # The per-node ingress proxies sit at 174-190Mi in steady state.
        memory: 192Mi
      limits:
        cpu: 1000m
        memory: 256Mi
