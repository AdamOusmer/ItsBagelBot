# Cluster DNS. Replaces the k3s-packaged coredns addon (skipped via
# coredns.yaml.skip on the k3s server since the 2026-06-30 DNS-stall fix,
# when the stock 1-replica Deployment was hand-converted to a DaemonSet).
# This file brings that hand-applied state under Flux ownership with two
# deliberate changes (2026-07-15 network-tune):
#
#   1. The DaemonSet runs on EVERY node, so every pod has a node-local
#      resolver. There is no node exclusion: the earlier one named specific
#      hostnames from a fleet that no longer exists, and the control plane
#      needs DNS as much as the app tier now that cert-manager, KEDA,
#      metrics-server and the Doppler operator sit beside the API server.
#   2. kube-dns gets internalTrafficPolicy: Local (enforced node-local, same
#      mechanism as valkey-local), so a query never leaves the node it came from.
#
# The ConfigMap deliberately declares ONLY the Corefile key. NodeHosts is
# owned and continuously updated by the k3s node-hosts controller; omitting
# it here keeps server-side apply from fighting over that key. Apply this
# file with SSA (Flux does; for manual use: kubectl apply --server-side).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:coredns
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
rules:
  - apiGroups: [""]
    resources: [endpoints, services, pods, namespaces]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:coredns
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
  - kind: ServiceAccount
    name: coredns
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30 {
          success 9984 30
          denial 9984 5
          prefetch 5 60s 10%
          serve_stale 3600s immediate
        }
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        # Forward external names to routable anycast resolvers instead of
        # /etc/resolv.conf: the former node1's host upstream was an OCI
        # link-local address (169.254.169.254) that CoreDNS could not reach
        # from the pod network, which stalled fresh lookups on that node.
        forward . 1.1.1.1 8.8.8.8 9.9.9.9 {
          policy sequential
          max_concurrent 1000
        }
    }
    # MagicDNS. Tailnet names are not resolvable by the public anycast resolvers
    # above, so without this a pod asking for a *.ts.net name gets NXDOMAIN:
    #   lookup nats-monitoring.tail451e6d.ts.net on 10.43.0.10:53: no such host
    #
    # That matters because the control plane is deliberately kept OFF the pod
    # network path to the application tier: KEDA on node1 reaches NATS monitoring
    # as a Tailscale Service (nats-monitoring.tail451e6d.ts.net) rather than over
    # a VLAN subnet route. Resolving the name is the first hop of that design, and
    # when it fails KEDA does not error loudly, it silently serves each
    # ScaledObject's static `fallback` replicas.
    #
    # 100.100.100.100 is the tailscaled-local MagicDNS resolver. CoreDNS reaches
    # it because pod egress masquerades out the node's tailscale0.
    ts.net:53 {
        errors
        cache 30
        forward . 100.100.100.100
    }
    import /etc/coredns/custom/*.server
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: CoreDNS
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      k8s-app: kube-dns
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      serviceAccountName: coredns
      priorityClassName: system-cluster-critical
      # No nodeAffinity: DNS is wanted on every node, control plane included.
      nodeSelector:
        kubernetes.io/os: linux
      dnsPolicy: Default
      # A DaemonSet still needs a toleration per taint it must cross, so every
      # role taint the fleet uses is listed here. Without the role=cp entry the
      # node1 pod could never be rescheduled once deleted, which would leave
      # the operators co-located with the API server resolving cross-node.
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: itsbagelbot.dev/role
          operator: Equal
          value: cp
          effect: NoSchedule
        - key: itsbagelbot.dev/role
          operator: Equal
          value: worker
          effect: NoSchedule
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.6@sha256:900f9c109f7a33545d3c811516e8376df9019147b750f5ce3e254468769176ea
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - {containerPort: 53, name: dns, protocol: UDP}
            - {containerPort: 53, name: dns-tcp, protocol: TCP}
            - {containerPort: 9153, name: metrics, protocol: TCP}
          resources:
            # A node-local cache holds about 100Mi steadily.
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [all]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet: {path: /health, port: 8080, scheme: HTTP}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /ready, port: 8181, scheme: HTTP}
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - {name: config-volume, mountPath: /etc/coredns, readOnly: true}
            - {name: custom-config-volume, mountPath: /etc/coredns/custom, readOnly: true}
      volumes:
        - name: config-volume
          configMap:
            name: coredns
            items:
              - {key: Corefile, path: Corefile}
              - {key: NodeHosts, path: NodeHosts}
        - name: custom-config-volume
          configMap:
            name: coredns-custom
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  annotations:
    prometheus.io/port: "9153"
    prometheus.io/scrape: "true"
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
spec:
  type: ClusterIP
  clusterIP: 10.43.0.10
  ipFamilyPolicy: SingleStack
  # Resolve against the node-local CoreDNS, strictly. The DaemonSet covers every
  # node, so there is always a local endpoint. This is Local rather than
  # PreferSameNode because the preference is a HINT the datapath may ignore:
  # Cilium's LB only filters on zone hints, every node shares one zone, and a
  # query sprayed to a remote backend can black-hole (node1's egress path).
  # Local is enforced in the BPF service map, so a query never leaves the node.
  internalTrafficPolicy: Local
  selector:
    k8s-app: kube-dns
  ports:
    - {name: dns, port: 53, protocol: UDP, targetPort: 53}
    - {name: dns-tcp, port: 53, protocol: TCP, targetPort: 53}
    - {name: metrics, port: 9153, protocol: TCP, targetPort: 9153}
---
# Drains/rolls may take one replica at a time, never two.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      k8s-app: kube-dns
