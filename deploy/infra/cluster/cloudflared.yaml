# Cloudflare Tunnel connector. Public ingress enters here: Cloudflare's edge
# dials these outbound connectors and forwards to traefik.kube-system:443.
#
# Replicas hard-spread one per application host. The control plane and any
# burst worker are excluded by ROLE rather than by hostname: public ingress
# belongs to the app tier, and naming individual hosts is what left this file
# referring to a node that had already been retired. A single tunnel ID
# supports many connector replicas (Cloudflare's native HA model). Both
# outbound paths are already encrypted (443 to traefik and 7844 to Cloudflare).
#
# Managed by the cluster Flux Kustomization. config = cloudflared-config
# ConfigMap, creds = cloudflared-tunnel Secret (Doppler-managed; the reload
# annotation rolls pods on rotation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 3 # one per non-worker node (node2, node3, node4); node1 decommissioned
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Hard one-per-node anti-affinity consumes both eligible hosts at steady
      # state, so a surge pod can never schedule. Replace one connector at a
      # time while the other continues serving the tunnel.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: cloudflared-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: cloudflared-deployment
      annotations:
        secrets.doppler.com/reload: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: itsbagelbot.dev/role
                    operator: NotIn
                    values: [cp, worker]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: cloudflared-deployment
      # No tolerations. The control plane is a dedicated k3s server now, so
      # ingress connectors have no business there; the role=cp taint plus the
      # nodeAffinity above keep them on the app tier. The previous
      # control-plane toleration dated from when the CP doubled as an ingress
      # node.
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          imagePullPolicy: IfNotPresent
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: creds, mountPath: /etc/cloudflared/creds, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-tunnel
            items:
              - {key: credentials.json, path: credentials.json}
              - {key: origin_ca_root.pem, path: origin_ca_root.pem}
