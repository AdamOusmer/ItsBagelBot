apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# Flux belongs beside the API server it reconciles against. node1 is the control
# plane (moved there 2026-07-27) and is tainted itsbagelbot.dev/role=cp:NoSchedule,
# so the controllers need both a toleration and a reason to prefer it.
#
# This inverts what was here: an exclusion of node1 dating from when it was the
# off-cluster database host. That exclusion was already stale and would now push
# the controllers away from exactly the node they should sit on.
#
# The affinity is PREFERRED, not required. A hard pin would make node1's loss take
# Flux down with it, and a control plane with no HA peer is precisely the node you
# do not want as a single point of failure for reconciliation. Under CPU pressure
# on its two cores the scheduler can also fall back to the app tier.
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: itsbagelbot.dev/role
                    operator: In
                    values: [cp]
    - op: add
      path: /spec/template/spec/tolerations
      value:
        - key: itsbagelbot.dev/role
          operator: Equal
          value: cp
          effect: NoSchedule
# Memory-limit trims. Upstream gotk-components ships every controller with
# limits.memory: 1Gi, and GOMEMLIMIT is wired to limits.memory via
# resourceFieldRef, so the Go GC happily lets the heap coast toward 1Gi.
# Lowering the limit lowers GOMEMLIMIT with it and the GC keeps RSS near the
# real working set instead. Measured before the trim (2026-07-06):
# image-reflector 580Mi RSS (12 ImageRepositories, ~5.5k tags in its badger
# cache), kustomize 210Mi. 384Mi leaves the reflector headroom for badger
# compaction spikes; kustomize builds this small repo well under 256Mi.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: image-reflector-controller
      namespace: flux-system
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 320Mi
                limits:
                  memory: 512Mi
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kustomize-controller
      namespace: flux-system
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 96Mi
                limits:
                  memory: 256Mi
