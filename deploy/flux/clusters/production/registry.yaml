# GHCR pull-through cache (deploy/infra/registry/). Own Kustomization rather
# than folding into `cluster`, for two reasons: it pins a ClusterIP that every
# agent's registries.yaml refers to literally, and nothing else may depend on
# it. `apps` deliberately does NOT dependsOn this one, because the mirror is a
# cache: if it is absent or broken, containerd falls through to ghcr.io and
# deploys proceed exactly as they do today. Making it a dependency would turn an
# optimisation into a deploy-train blocker (the KEDA lesson).
#
# wait is false for the same reason. A cache that is slow to become ready must
# not hold up a reconcile.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/infra/registry
  prune: true
  wait: false
  timeout: 5m
