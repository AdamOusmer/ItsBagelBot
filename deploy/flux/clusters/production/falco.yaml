# Falco, brought under Flux (HelmRelease) from an out-of-band install.
# `helm list -n falco` is empty: the live DaemonSet/ConfigMaps/Service/SA carry
# helm.sh/chart labels but no helm release secret exists, i.e. they are
# kubectl-owned orphans (same situation newrelic.yaml started from).
#
# CHART VERSION
# -------------
# falco 8.0.3 (app 0.43.1). Verified against every live label
# (helm.sh/chart=falco-8.0.3, app.kubernetes.io/version=0.43.1) and the live
# images falco:0.43.1 / falcoctl:0.12.2, which are exactly what 8.0.3 pins.
#
# VALUES = LIVE RECONSTRUCTION (verified 2026-07-17 by rendering
# `helm template falco falcosecurity/falco --version 8.0.3` with these values
# and diffing against the live DaemonSet + falco/falco-falcoctl ConfigMaps;
# the only remaining deltas are API-server-defaulted fields and the customRules
# additions):
#   - driver.kind modern_ebpf: live engine.kind. Also what makes the chart skip
#     the falco-driver-loader init container AND the configmap Role/RoleBinding,
#     both absent live.
#   - falco.json_output true: the fluent-bit -> New Relic pipeline
#     (deploy/infra/cluster/newrelic-logging.yaml, level_extract.lua) matches
#     falco events on rule/priority/output_fields markers in the JSON line.
#   - metrics.enabled true: renders the falco-metrics Service and flips
#     webserver.prometheus_metrics_enabled, both live. The prometheus.io pod
#     annotations are the podAnnotations below.
#   - resources trimmed way below chart defaults (small fleet, tight CPU
#     budgets) and the infra-low priority class. The retired
#     itsbagelbot.dev/pool=worker-pool toleration is gone; the DaemonSet covers
#     the untainted application nodes.
#   - falcoctl config needs ZERO overrides: rules artifact falco-rules:5,
#     container plugin 0.6.3 and follow every 168h are all 8.0.3 defaults
#     (live falcoctl.yaml diffs empty against the default render). The one
#     falcoctl delta is the follow container's GOMAXPROCS=1 env below, a CFS
#     CPU-throttling tune (see the comment there) -- a k8s container env, not a
#     falcoctl.yaml change, so the config-diff-empty claim above still holds.
#   - Intentionally NOT carried over: falco.http_output.url pointing at the
#     long-gone falco-falcosidekick Service. http_output is disabled, the URL
#     was inert cruft from the era when falcosidekick was installed (its
#     leftover SAs/Roles get deleted in the cutover).
#
# CUSTOM RULES (the reason this exists: ~6,500 events/day to New Relic, nearly
# all false positives from the stock ruleset)
# ---------------------------------------------------------------------------
# Three FP families, each tuned via the customization stub upstream ships for
# exactly this purpose ((never_true) macros / empty lists + `override:`).
# The rules land in ConfigMap falco-rules, mounted at /etc/falco/rules.d which
# loads AFTER falco_rules.yaml, so the overrides re-define the stock stubs.
# Macro/list names AND the whole file were validated 2026-07-17 with
# `falco -V /etc/falco/falco_rules.yaml -V <this file>` inside a live falco
# pod (falco 0.43.1, rules artifact falco-rules:5): zero errors, zero warnings.
#
# First reconcile over a kubectl-era install: helm-controller WILL fail with
# "exists and cannot be imported into the current release" until the
# kubectl-owned orphans are deleted (same orphaned-release shape as newrelic).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: falcosecurity
  namespace: flux-system
spec:
  interval: 1h
  url: https://falcosecurity.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 1h
  timeout: 10m
  releaseName: falco # MUST stay "falco" so rendered names (falco, falco-falcoctl,
                     # falco-metrics, falco-rules) match the orphaned install and
                     # the fluent-bit falco-forwarding match keeps working.
  chart:
    spec:
      chart: falco
      version: 8.0.3 # exact pin; matches every live helm.sh/chart label
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
      interval: 1h
  install:
    # Namespace falco already exists (created out-of-band); helm must not own it.
    createNamespace: false
    crds: Skip # chart ships no CRDs
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    driver:
      kind: modern_ebpf

    # -U/--unbuffered: flush stdout on EVERY alert.
    #
    # REQUIRED, and specifically required *because* of the customRules below.
    # falco 0.43.1 block-buffers stdout even though `buffered_outputs: false`
    # is set (the chart documents that flag as "flushes the output buffer on
    # every alert" for stdout_output; measured 2026-07-17, it does not).
    # Alerts therefore sit in the libc buffer until ~4KB accumulates.
    #
    # Before the exceptions, ~6,500 FP events/day acted as an accidental
    # carrier: the noise kept filling and flushing the buffer, so real alerts
    # rode out with it. Silencing the FPs removed that carrier, so a lone real
    # alert would sit unflushed indefinitely and never reach fluent-bit ->
    # New Relic. Measured on node3 before this flag: two canary alerts stayed
    # invisible for 11+ minutes, then appeared only once a 60-event burst
    # filled the buffer; engine counter read 63 matches vs 61 lines emitted.
    # Falco is a detector nobody reads if its alerts never leave the buffer,
    # so the noise fix and this flag MUST ship together.
    extra:
      args: ["-U"]

    falco:
      json_output: true

    # Renders the falco-metrics Service and enables the prometheus endpoint on
    # the webserver (port 8765), matching live.
    metrics:
      enabled: true

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8765"
      prometheus.io/path: /metrics

    podPriorityClassName: infra-low

    # Chart default only tolerates control-plane taints; the extra entry keeps
    # falco on any worker-role node (tainted itsbagelbot.dev/role=worker).
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      - effect: NoSchedule
        key: itsbagelbot.dev/role
        operator: Equal
        value: worker

    # Far below chart defaults (100m/512Mi -> 1000m/1024Mi); live-proven for
    # this fleet. falcoctl follow sidecar bumped to 64Mi (from 32Mi) to avoid
    # sustained >90% memory utilization from Go runtime baseline RSS.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    falcoctl:
      artifact:
        follow:
          # CPU-throttling tune (NOT a falcoctl.yaml/config change; the follow
          # container is near-idle, waking only every 168h to poll). falcoctl
          # 0.12.2 predates Go 1.25's CFS-aware GOMAXPROCS default, so its
          # runtime sets GOMAXPROCS to the node core count (2-4 here) and fans
          # background work (sysmon/GC/scavenger) across that many Ps. Against
          # the 25m limit (2.5ms per 100ms CFS period) any multi-P burst blows
          # the quota, so the sidecar showed >90% throttled periods for 5m+
          # despite ~zero real CPU use (New Relic "Container cpu throttling is
          # high", CRITICAL). Pinning GOMAXPROCS=1 serializes that work onto one
          # P and kills the sustained throttling WITHOUT raising the limit (tune
          # before room). Same mechanism automaxprocs implements for low-limit
          # Go sidecars. If throttling persists after this, THEN bump limits.
          #
          # Memory: Go's idle RSS (GC heap, stacks, runtime metadata) sits
          # ~25Mi, which against a 32Mi limit kept utilization >90% for 5m+ and
          # fired "Container high memory utilization" (CRITICAL). Bumped to
          # 64Mi so the baseline floats at ~40% instead. Request raised to 32Mi
          # to match (request ≈ actual idle RSS).
          env:
            - name: GOMAXPROCS
              value: "1"
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 25m
              memory: 64Mi

    customRules:
      bagelbot-exceptions.yaml: |-
        # Local tuning of the stock falco-rules ruleset (falcoctl artifact
        # falco-rules:5). Loaded from /etc/falco/rules.d AFTER
        # /etc/falco/falco_rules.yaml, so the `override:` markers below
        # re-define the (never_true) customization stubs and empty allowlist
        # lists upstream ships for exactly this purpose.

        # --- 1. "Read sensitive file untrusted" family (~690/day FPs) --------
        # EL10/systemd-257 hosts: systemd-userdbd workers legitimately read
        # /etc/shadow for NSS/userdb lookups, and systemd-executor (the
        # systemd 254+ unit spawner) reads /etc/pam.d/* during PAM session
        # setup for user@N.service (triggered by e.g. oracle-cloud-agent sudo
        # probes). Known upstream falcosecurity/rules FP family. Scoped to the
        # exact host executable paths AND the exact files they touch, so any
        # other sensitive-file read by these binaries still alerts.
        - macro: user_known_read_sensitive_files_activities
          condition: >
            ((proc.exepath = /usr/lib/systemd/systemd-userwork and fd.name = /etc/shadow)
             or (proc.exepath = /usr/lib/systemd/systemd-executor and fd.directory = /etc/pam.d))
          override:
            condition: replace

        # --- 2. "Contact K8S API Server From Container" (~5,800/day FPs) -----
        # Kept ENABLED with an allowlist (not disabled) so unexpected API-server
        # access from app workloads still alerts. Every legitimate API client
        # lives in an infra namespace (flux controllers, keda, cert-manager +
        # trust-manager, tailscale operator + proxies, nri-kubernetes;
        # kube-system/coredns is already excluded by the stock k8s_containers
        # macro). Residual trickle: connects raced during pod startup can miss
        # k8s metadata enrichment (k8s.ns.name=<NA>) and still alert; rare,
        # accepted.
        #
        # The ns-production exception for the nats-selfheal CronJob is gone with
        # the job itself (2026-07-27). Nothing in production should be calling
        # the API server now, so an alert from that namespace is a real signal
        # again rather than expected noise.
        - macro: user_known_contact_k8s_api_server_activities
          condition: >
            (k8s.ns.name in (flux-system, keda, cert-manager, tailscale, newrelic))
          override:
            condition: replace

        # There is deliberately no exception for drop-and-execute or stdio
        # redirect. One used to live here, whitelisting the alpine/k8s image and
        # the nats-live-acceptance / valkey-live-acceptance / wg-latency pod
        # names, because those harnesses had freshly built binaries kubectl-cp'd
        # into a running container and executed. The harnesses are gone from the
        # repository and so is the exception: "a generic utility image may drop
        # and run an unsigned binary in production, unalerted" is a wide hole to
        # hold open for a benchmark. Anything that needs to run in this cluster
        # ships as an image built by publish-images.yml; if a rule fires, that is
        # the rule working.
