apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../messaging
  - ../../../messaging/network-policies.yaml

# The hub StatefulSet and its certificates roll by hand: a hub restart moves stream leaders.
patches:
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: nats
        namespace: messaging
  - patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: nats-hub-tls
        namespace: messaging
  - patch: |
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: nats-leaf-tls
        namespace: messaging
