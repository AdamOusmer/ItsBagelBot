# Only the release workflow and the admin console move the deploy branch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/AdamOusmer/ItsBagelBot
  ref:
    branch: deploy
  ignore: |
    /*
    !/deploy/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/flux/system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/flux/tiers/platform
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: messaging
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/flux/tiers/messaging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ops
  namespace: flux-system
spec:
  dependsOn:
    - name: messaging
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/flux/tiers/ops
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: db
  namespace: flux-system
spec:
  dependsOn:
    - name: ops
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deploy/flux/tiers/db
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  dependsOn:
    - name: db
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deploy/flux/tiers/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
