apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - sync.yaml

secretGenerator:
  - name: git-signing-keys
    namespace: flux-system
    files:
      - github-web-flow.asc
    options:
      disableNameSuffixHash: true

images:
  - name: ghcr.io/fluxcd/source-controller
    newTag: v1.10.2@sha256:1405a9e460833df9aff920664243c0df271f42be05e0bf38db31d2b7e9ebbaab
  - name: ghcr.io/fluxcd/kustomize-controller
    newTag: v1.10.2@sha256:e122808057ef0f6a3cb7fbd8e256b5a528d8a59f41d237f2d6664f54481c26d9

patches:
  - target:
      kind: Deployment
      name: (source-controller|kustomize-controller)
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
      - op: test
        path: /spec/template/spec/containers/0/args/2
        value: --log-level=info
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: --log-level=error
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=4
      - op: add
        path: /spec/template/spec/nodeSelector/role
        value: cp
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - {key: role, operator: Equal, value: cp, effect: NoSchedule}
