apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  chart: traefik
  repo: https://traefik.github.io/charts
  version: 42.1.2
  targetNamespace: networking
  createNamespace: false
  valuesContent: |-
    image:
      tag: v3.7.16@sha256:22a759fb803abb5c3a7ba5d5a55a201c5fb0fc8993d5c72c47a89075e64f1953

    deployment:
      kind: DaemonSet
      # Surge, not unavailable: the new pod is ready and propagated before the
      # old one leaves, and the old one keeps serving past endpoint removal.
      # Never use internalTrafficPolicy Local here: a node without a ready pod
      # refuses connections ("no route to host") instead of failing over.
      minReadySeconds: 10
      terminationGracePeriodSeconds: 60
      lifecycle:
        preStop:
          sleep:
            seconds: 15

    core:
      strictTLSOptions: true

    # Global HTTP->HTTPS redirect on the web entrypoint. Static-config switch,
    # no per-route opt-out. This is only the "client -> traefik" half; the
    # "traefik -> backend" half is set per-service on each IngressRoute.
    additionalArguments:
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # The dashboard is served over TLS on websecure by the
      # traefik-dashboard IngressRoute (host only the tailscale proxy sends).
      # The plain :8080 `traefik` entrypoint keeps only /ping for kubelet
      # probes.
      - --api.dashboard=true

    providers:
      kubernetesCRD:
        enabled: true
        # The unrouted-host fallback proxies stray hostnames to the marketing
        # site through an ExternalName Service, which the CRD provider refuses
        # by default.
        allowExternalNameServices: true
        defaultTLSResourcesNamespace: networking
      kubernetesIngress:
        enabled: false

    # Default TLS material presented to cloudflared: the Origin CA cert above.
    # One cert covers the whole surface (apex + wildcard SANs), so no per-route
    # certificate resolver is needed.
    tlsStore:
      default:
        defaultCertificate:
          secretName: traefik-origin-tls

    tlsOptions:
      default:
        minVersion: VersionTLS12
        curvePreferences:
          - CurveP256
          - X25519

    service:
      spec:
        type: ClusterIP
        trafficDistribution: PreferSameNode
        internalTrafficPolicy: Cluster

    ports:
      traefik:
        http:
          aliasHeadersStrategy: delete
      metrics:
        http:
          aliasHeadersStrategy: delete
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80
        http:
          aliasHeadersStrategy: delete
        transport:
          lifeCycle:
            requestAcceptGraceTimeout: 10s
            graceTimeOut: 30s
      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
        http:
          aliasHeadersStrategy: delete
          tls:
            enabled: true
        transport:
          lifeCycle:
            requestAcceptGraceTimeout: 10s
            graceTimeOut: 30s

    # Public ingress belongs to the app tier. Excluded by role, never by
    # hostname: naming individual hosts is what once left this config pointing
    # at a retired node.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: role
                  operator: NotIn
                  values: [cp]

    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1

    readinessProbe:
      periodSeconds: 2

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    podSecurityContext:
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        # Per-node ingress proxies sit at 174-190Mi in steady state.
        memory: 192Mi
      limits:
        cpu: 1000m
        memory: 256Mi
