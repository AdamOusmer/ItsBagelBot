apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-observability
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # Kubelet probes arrive from each node's cilium_host address as world.
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16]
      ports:
        - port: 8765
        - port: 2801
        - port: 2802
        - port: 6379
        - port: 8080
        - port: 8081
        - port: 2020
        - port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
              app.kubernetes.io/component: core
      ports:
        - port: 2801
    - ports:
        - {port: 443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falcosidekick
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falco
      ports:
        - port: 2801
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
              app.kubernetes.io/component: core
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: falco-ui
      ports:
        - port: 2802
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
              app.kubernetes.io/component: ui
      ports:
        - port: 6379
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
      ports:
        - port: 2802
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: newrelic-infrastructure
              app.kubernetes.io/component: ksm
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: newrelic
  namespace: observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [newrelic-infrastructure, newrelic-logging, newrelic-prometheus-agent]
  policyTypes: [Egress]
  egress:
    - ports:
        - {port: 443, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cache
          podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      ports:
        - port: 6380
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 9153
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [nats, nats-leaf]
      ports:
        - port: 7777
        - port: 7778
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 9100
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver
  namespace: observability
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [newrelic-infrastructure, newrelic-logging, newrelic-prometheus-agent, kube-state-metrics]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubelet
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: newrelic-infrastructure
      app.kubernetes.io/component: kubelet
  egress:
    - toEntities: [host]
      toPorts:
        - ports:
            - {port: "10250", protocol: TCP}
