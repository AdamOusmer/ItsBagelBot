apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-db
  namespace: db
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, discord-data, loyalty, modules, transactions, projector, notifications, notifications-cleanup, backup-mysql, backup-k3s]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
  egress:
    # Cluster DNS only; an open port 53 is a tunnelling escape hatch.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cache
---
# WORKAROUND cilium/cilium#43012: kubelet probes arrive as "world"; without this default-deny drops them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-probe-ports
  namespace: db
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, discord-data, loyalty, modules, transactions, projector, notifications, notifications-cleanup]
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: db
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, discord-data, loyalty, modules, transactions, projector, notifications, backup-mysql, backup-k3s]
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# 10.0.0.0/16 stays for a DB_ADDR rollback to the direct VCN path; removing it breaks that rollback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-heatwave
  namespace: db
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [users, commands, discord-data, loyalty, modules, transactions, notifications, backup-mysql]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 204.216.107.73/32
      ports:
        - port: 3306
          protocol: TCP
