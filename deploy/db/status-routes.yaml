# db-namespace half of the health.itsbagelbot.com surface (see
# deploy/k8s/status-routes.yaml for the model and the app-namespace half).
# Traefik CRD references are namespace-local, so the data tier's status
# Services, transports, middleware and routes live here beside the pods after
# the app/db split. The webhook route rides along: it terminates on the same
# transactions Service.
#
# Path-shape note (measured 2026-08-25): edge normalization folds //svc,
# /./svc onto the clean path before matching, but replacePath pins the
# backend to /status for every match, so the reachable set is still exactly
# {<svc> -> /status}. See deploy/k8s/status-routes.yaml for the probe list.
apiVersion: v1
kind: Service
metadata:
  name: commands-status
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: commands
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-status
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: loyalty
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: modules-status
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: modules
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-status
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: notifications
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: projector
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: users-status
  namespace: db
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: users
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
# Same rewrite middleware as the app namespace: the per-service path only
# picks the backend, every backend serves exactly /status.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: db
spec:
  # Mirrors deploy/k8s/status-routes.yaml: the app half shipped this limiter,
  # this copy didn't, leaving seven backends hammerable at line rate by anyone
  # who can reach health.itsbagelbot.com (red-team finding F3b).
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/commands`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: commands-status
          port: 443
          scheme: https
          serversTransport: commands-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/loyalty`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: loyalty-status
          port: 443
          scheme: https
          serversTransport: loyalty-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/modules`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: modules-status
          port: 443
          scheme: https
          serversTransport: modules-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/notifications`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: notifications-status
          port: 443
          scheme: https
          serversTransport: notifications-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/projector`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: projector-status
          port: 443
          scheme: https
          serversTransport: projector-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/users`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: users-status
          port: 443
          scheme: https
          serversTransport: users-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/transactions`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: commands-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: commands-status
  rootCAsSecrets:
    - commands-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: loyalty-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: loyalty-status
