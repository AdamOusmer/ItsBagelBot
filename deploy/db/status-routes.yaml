# db-namespace half of the health.itsbagelbot.com surface (see
# deploy/k8s/status-routes.yaml for the model and the app-namespace half).
# Traefik CRD references are namespace-local, so the data tier's status
# Services, transports, middleware and routes live here beside the pods after
# the app/db split. The webhook route rides along: it terminates on the same
# transactions Service.
#
# No trafficDistribution on these Services (deliberate, mirrors the app half):
# PreferSameNode pinned every external probe to the entry node's own replica,
# so one dead pod read as service-down while the other replicas were healthy
# (2026-08-30 node3 uplink blip: Better Stack reported projector down with 2/3
# replicas serving). Status traffic is one probe per ~30s behind the rate
# limiter, so the cross-node hop this reintroduces costs nothing.
apiVersion: v1
kind: Service
metadata:
  name: commands-status
  namespace: db
spec:
  selector:
    app: commands
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-status
  namespace: db
spec:
  selector:
    app: loyalty
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: modules-status
  namespace: db
spec:
  selector:
    app: modules
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-status
  namespace: db
spec:
  selector:
    app: notifications
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: db
spec:
  selector:
    app: projector
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: users-status
  namespace: db
spec:
  selector:
    app: users
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
# Same rewrite middleware as the app namespace: the per-service path only
# picks the backend, every backend serves exactly /status.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: db
spec:
  # Mirrors deploy/k8s/status-routes.yaml (red-team finding F3b). The limiter
  # shipped here without being attached to the routes below, leaving seven
  # backends hammerable at line rate for 11 days; attached 2026-08-30 — keep
  # every route's middleware list starting with this limiter.
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
# Re-pick a backend when the first pick fails at the connection level. With
# PreferSameNode gone (header comment) the pool is every ready replica, so a
# pod that died faster than its EndpointSlice updated (the NotReady grace is
# 40s+) no longer turns one bad pick into a public "down": 2026-08-30 node3
# blip, Better Stack reported projector down with 2/3 replicas serving.
# Sits after the rate limiter so retries don't re-count against the caller.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: db
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/commands`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: commands-status
          port: 443
          scheme: https
          serversTransport: commands-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/loyalty`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: loyalty-status
          port: 443
          scheme: https
          serversTransport: loyalty-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/modules`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: modules-status
          port: 443
          scheme: https
          serversTransport: modules-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/notifications`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: notifications-status
          port: 443
          scheme: https
          serversTransport: notifications-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/projector`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: projector-status
          port: 443
          scheme: https
          serversTransport: projector-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/users`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: users-status
          port: 443
          scheme: https
          serversTransport: users-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/transactions`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: commands-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: commands-status
  rootCAsSecrets:
    - commands-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: loyalty-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: loyalty-status
  rootCAsSecrets:
    - loyalty-tls
---
apiVersion: traefik.io/v1alpha1
