apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: db
spec:
  selector:
    app: projector
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: db
spec:
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: db
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/db`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: projector-status
          port: 443
          scheme: https
          serversTransport: projector-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/billing`)
      kind: Rule
      middlewares: [{name: status-ratelimit}, {name: status-retry}, {name: status-path}]
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: projector-status-transport
  namespace: db
spec:
  serverName: projector-status
  rootCAsSecrets:
    - projector-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: transactions-transport
  namespace: db
spec:
  serverName: transactions
  rootCAsSecrets:
    - transactions-tls
