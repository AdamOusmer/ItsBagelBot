# db-namespace half of the health.itsbagelbot.com surface (see
# deploy/k8s/status-routes.yaml for the model and the app-namespace half).
# Traefik CRD references are namespace-local, so the data tier's status
# Services, transports, middleware and routes live here beside the pods after
# the app/db split. The webhook route rides along: it terminates on the same
# transactions Service.
apiVersion: v1
kind: Service
metadata:
  name: commands-status
  namespace: db
spec:
  trafficDistribution: PreferClose
  selector:
    app: commands
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-status
  namespace: db
spec:
  trafficDistribution: PreferClose
  selector:
    app: loyalty
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: modules-status
  namespace: db
spec:
  trafficDistribution: PreferClose
  selector:
    app: modules
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-status
  namespace: db
spec:
  trafficDistribution: PreferClose
  selector:
    app: notifications
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: db
spec:
  trafficDistribution: PreferClose
  selector:
    app: projector
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: users-status
  namespace: db
spec:
  trafficDistribution: PreferClose
  selector:
    app: users
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
# Same rewrite middleware as the app namespace: the per-service path only
# picks the backend, every backend serves exactly /status.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/commands`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: commands-status
          port: 443
          scheme: https
          serversTransport: commands-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/loyalty`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: loyalty-status
          port: 443
          scheme: https
          serversTransport: loyalty-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/modules`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: modules-status
          port: 443
          scheme: https
          serversTransport: modules-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/notifications`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: notifications-status
          port: 443
          scheme: https
          serversTransport: notifications-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/projector`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: projector-status
          port: 443
          scheme: https
          serversTransport: projector-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/users`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: users-status
          port: 443
          scheme: https
          serversTransport: users-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/transactions`)
      kind: Rule
      middlewares: [{name: status-path}]
      services:
        - name: transactions
          port: 80
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: commands-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: commands-status
  rootCAsSecrets:
    - commands-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: loyalty-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: loyalty-status
  rootCAsSecrets:
    - loyalty-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: modules-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: modules-status
  rootCAsSecrets:
    - modules-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: notifications-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: notifications-status
  rootCAsSecrets:
    - notifications-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: projector-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: projector-status
  rootCAsSecrets:
    - projector-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: users-status-transport
  namespace: db
spec:
  # Verify the pod's TLS cert against the fleet CA, same shape as
  # transactions-transport: serverName matches the cert SAN and rootCAsSecrets
  # reads ca.crt from the cert-manager secret. No InsecureSkipVerify.
  serverName: users-status
  rootCAsSecrets:
    - users-tls
---
# Tebex webhook + checkout callbacks; moved with the transactions pods.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: transactions-webhooks
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`webhooks.itsbagelbot.com`) && (PathPrefix(`/tebex`) || PathPrefix(`/webhooks/tebex`))
      kind: Rule
      services:
        - name: transactions
          port: 80
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: transactions-transport
  namespace: db
spec:
  # Verify the transactions pod's TLS cert against the fleet CA. serverName
  # matches the cert SAN (the Service name); ca.crt from the cert-manager
  # secret. No InsecureSkipVerify.
  serverName: transactions
  rootCAsSecrets:
    - transactions-tls
