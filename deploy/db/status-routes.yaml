apiVersion: v1
kind: Service
metadata:
  name: projector-status
  namespace: db
spec:
  selector:
    app: projector
  ports:
    - name: http
      port: 443
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-path
  namespace: db
spec:
  replacePath:
    path: /status
---
# Runs after the rate limit that keys on CF-Connecting-IP; no backend sees the visitor address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-client-ip
  namespace: db
spec:
  headers:
    customRequestHeaders:
      CF-Connecting-IP: ""
      CF-Connecting-IPv6: ""
      True-Client-IP: ""
      X-Real-Ip: ""
      X-Forwarded-For: ""
      Forwarded: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-ratelimit
  namespace: db
spec:
  rateLimit:
    average: 1
    burst: 10
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: status-retry
  namespace: db
spec:
  retry:
    attempts: 3
    initialInterval: 100ms
---
# Without a preconnect Link, Cloudflare caches no Early Hint and every probe of these URLs logs a 504 miss.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: early-hints-link
  namespace: db
spec:
  headers:
    customResponseHeaders:
      Link: "<https://itsbagelbot.com>; rel=preconnect"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service-status
  namespace: db
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`health.itsbagelbot.com`) && Path(`/db`)
      kind: Rule
      middlewares: [{name: early-hints-link}, {name: status-ratelimit}, {name: strip-client-ip}, {name: status-retry}, {name: status-path}]
      services:
        - name: projector-status
          port: 443
          scheme: https
          serversTransport: projector-status-transport
    - match: Host(`health.itsbagelbot.com`) && Path(`/billing`)
      kind: Rule
      middlewares: [{name: early-hints-link}, {name: status-ratelimit}, {name: strip-client-ip}, {name: status-retry}, {name: status-path}]
      services:
        - name: transactions
          port: 443
          scheme: https
          serversTransport: transactions-transport
          nativeLB: true
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: projector-status-transport
  namespace: db
spec:
  serverName: projector-status
  rootCAsSecrets:
    - projector-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: transactions-transport
  namespace: db
spec:
  serverName: transactions
  rootCAsSecrets:
    - transactions-tls
