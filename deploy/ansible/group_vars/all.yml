# ─────────────────────────────────────────────────────────────────────────────
# Fleet-wide config. NO secrets committed.
# Secrets come from infra-bootstrap/prd, injected by `doppler run`:
#   K3S_TOKEN   — node1 join token
#   TS_AUTHKEY  — Tailscale PRE-AUTHORIZED key, ephemeral=false, tagged tag:itsbagelbot
# Optional:
#   NODE_NAME   — explicit node/hostname (e.g. node4). If unset, a unique name is
#                 generated on first run and persisted to /etc/fleet/node-name.
# ─────────────────────────────────────────────────────────────────────────────

# --- k3s control plane (node1) -----------------------------------------------
# Control-plane Tailscale IPv4, injected by doppler run (infra-bootstrap/prd).
# NOT committed: this repo is public, and the server address identifies the one
# host whose loss takes the cluster down. CP history: node1 -> node2
# (2026-07-01) -> node3 (2026-07-25) -> node1 (2026-07-27). Agents join over the
# tailnet, never the public interface.
k3s_server_ip: "{{ lookup('env', 'NODE1_TAILNET_IP') | mandatory }}"
k3s_url: "https://{{ k3s_server_ip }}:6443"
k3s_version: "v1.35.5+k3s1"             # pinned to running fleet; bump deliberately
# Pod/service traffic must use the physical underlay. Tailscale is reserved for
# SSH, Kubernetes management, and database routing; it is never a Flannel peer
# endpoint. NATed nodes must supply NODE_EXTERNAL_IP explicitly.
flannel_iface: "{{ lookup('env', 'FLANNEL_IFACE') | default(ansible_default_ipv4.interface, true) }}"
node_external_ip: "{{ lookup('env', 'NODE_EXTERNAL_IP') | default('', true) }}"
k3s_token: "{{ lookup('env', 'K3S_TOKEN') }}"

# --- Tailscale ---------------------------------------------------------------
tailscale_authkey: "{{ lookup('env', 'TS_AUTHKEY') }}"
tailscale_tag: "tag:itsbagelbot"       # node joins pre-authorized under this ACL tag
tailscale_port: 41641                   # UDP listen port
flannel_wireguard_port: 51820          # K3s wireguard-native, IPv4

# A fleet node is not considered provisioned until it can establish a direct
# UDP path to every other fleet node. This deliberately rejects DERP and peer
# relay paths: JetStream RAFT must not be built on a hidden TCP relay.
# Add new stable Tailscale DNS names here before growing the fleet.
tailscale_direct_peers:
  - node1
  - node4
  - node5
  - node6

# Subnet routes this node advertises to the tailnet, set PER HOST in the
# inventory. It is what lets nodes on different providers reach each other's
# private networks, and the fleet already depends on it: node1 advertises OCI's
# 10.0.0.0/16 so in-cluster pods can reach the database.
#
# The ServaRICA nodes advertise the private VLAN (10.10.0.0/24) for the same
# reason in reverse. Once flannel on those nodes peers over their VLAN addresses,
# node1 has no physical path to 10.10.0.x, and this route is what gives it one.
# App-tier traffic still goes DIRECT over the VLAN at sub-millisecond latency;
# only the control plane's small share (~0.05 GB/day) takes the tailnet hop, and
# measured 2026-07-27 that hop is 2ms versus the 2.8-4.0ms it already pays on the
# public path, so it costs nothing.
#
# EMPTY MEANS "DO NOT TOUCH", deliberately. `tailscale set --advertise-routes=`
# with an empty value CLEARS every advertised route, so a run against a partial
# inventory would silently strip node1 of 10.0.0.0/16 and cut the cluster off
# from the database. The role therefore omits the flag entirely when this is
# unset rather than passing it empty.
#
# Routes still need approving once in the Tailscale admin console (or via an ACL
# auto-approver, which is the better answer so a reprovisioned node does not come
# back silently unrouted).
tailscale_advertise_routes: ""

# --- Node identity -----------------------------------------------------------
# Resolved/persisted in the base role. Pass NODE_NAME for explicit incremental
# names (node4, node5…); otherwise a unique bot-XXXXX name is generated so the
# box always joins as a BRAND NEW node and never clobbers an existing identity.
node_name_requested: "{{ lookup('env', 'NODE_NAME') | default('', true) }}"
# zone == city (see deploy/k8s/console-dashboard.yaml): Services route on
# trafficDistribution, so a node labelled with a city it is not in gets no
# same-zone endpoints. The whole fleet is Montreal, so mtl1 is the right default.
# node5 provisioned with NODE_ZONE unset and inherited the old ovh-bhs1 default.
node_zone: "{{ lookup('env', 'NODE_ZONE') | default('mtl1', true) }}"

node_region: "{{ lookup('env', 'NODE_REGION') | default('ca-mtl', true) }}"

# Node role, on the single itsbagelbot.dev/role key. Replaces the retired
# itsbagelbot.dev/pool label+taint, which named a hardware pool rather than a
# purpose and left every consumer tolerating a key no node carries.
#
#   cp     — k3s control plane. Tainted NoSchedule: it runs the API server and
#            the operators that must sit beside it, nothing else.
#   node   — application tier. Untainted, this is where workloads run.
#   worker — reserved for burst/compute nodes. Tainted NoSchedule, so a
#            workload has to opt in. No node holds this today.
#
# Default is "node": a newly provisioned box joins the application tier, which
# is the common case. Pass NODE_ROLE=cp explicitly when promoting a server.
node_role: "{{ lookup('env', 'NODE_ROLE') | default('node', true) }}"

# --- Image pull-through cache ------------------------------------------------
# The in-cluster GHCR mirror's pinned ClusterIP (deploy/infra/registry/). Set as
# a literal address because containerd resolves through the HOST resolver, never
# CoreDNS, so a Service DNS name is unusable here. kube-proxy still routes a
# ClusterIP for host-originated traffic, which is what makes this work.
#
# Set empty to skip writing registries.yaml entirely and pull straight from
# ghcr.io, which is the correct state for a fleet where the mirror is not
# deployed yet.
registry_mirror_endpoint: "{{ lookup('env', 'REGISTRY_MIRROR_ENDPOINT') | default('10.43.0.50:5000', true) }}"

# --- SELinux (matches node1) -------------------------------------------------
selinux_state: "enforcing"
selinux_policy: "targeted"

# --- Rancher repo (k3s-selinux RPM) ------------------------------------------
rancher_repo_baseurl: "https://rpm.rancher.io/k3s/stable/common/centos/9/noarch"

# --- Teardown ----------------------------------------------------------------
# After firewall + tailscale verify up, remove OpenSSH entirely (tailnet-only box).
remove_system_ssh: true
