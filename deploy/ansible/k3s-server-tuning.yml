---
# Pin the k3s server's Go runtime memory guard.
#
#   doppler run -p infra-bootstrap -c prd -- ansible-playbook -i inventory.cluster.ini k3s-server-tuning.yml
#
# node1 is the SINGLE k3s server (sqlite/kine — no HA, see the control-plane
# migration notes). Its Go heap is capped with GOMEMLIMIT + GOGC, delivered via
# the stock unit's `EnvironmentFile=-/etc/systemd/system/k3s.service.env` hook.
# Without it the apiserver heap coasts upward unguarded, and a single-server
# control plane has no peer to absorb an OOM.
#
# WHY THIS FILE EXISTS: the values were live-but-untracked, and have now been
# lost TWICE. First when node2 was rebuilt (2026-07-02, env file re-created by
# hand 2026-07-06), then again in the node3 -> node1 control-plane move
# (2026-07-27): the installer writes a fresh unit, and this env file is not part
# of the /var/lib/rancher/k3s/server datastore that gets carried across, so
# node1 came up with no heap guard at all. Any future CP move must re-run this
# playbook as a closing step.
#
# Untracked node-local state is exactly what let the retired flannel-watchdog
# keep restarting this control plane unnoticed for ~23h (see
# cluster-network-wireguard.yml) — a migration cannot clean up, and a rebuild
# cannot restore, what the repo does not know exists.
#
# Verify with /proc/<k3s-pid>/environ, not `systemctl show` (see the note below).
#
# NOTE: `systemctl show k3s -p Environment` renders EMPTY here and does NOT
# mean the tuning is missing — it only prints `Environment=` directives, never
# EnvironmentFile contents. Check /proc/<pid>/environ instead.
- name: Pin the k3s server Go runtime memory guard
  hosts: k3s_server
  become: true
  gather_facts: false
  vars:
    # Retuned for node1 (control plane moved there 2026-07-27). The old
    # 1300MiB/GOGC=75 pair was sized for a 6-core box that ALSO hosted pods, so
    # squeezing the heap protected the workloads sharing the node.
    #
    # node1 inverts that trade: it is tainted itsbagelbot.dev/role=cp:NoSchedule
    # and hosts no pods, so its ~10.9GB is effectively dedicated to the control
    # plane, while its 2 cores are the scarce resource. GOMEMLIMIT is a soft
    # limit enforced by running the collector harder, so a low ceiling spends
    # CPU to conserve memory — exactly backwards here. Raising the ceiling and
    # returning GOGC to the default lets the heap breathe and cuts GC cycles on
    # the two cores that serve every apiserver request.
    #
    # 3GiB still leaves ~7GB headroom, and a single-server control plane has no
    # peer to absorb an OOM, so the guard stays in place rather than being
    # dropped entirely. Observed RSS on node1 right after the move: ~1.2GB.
    k3s_gomemlimit: 3GiB
    k3s_gogc: "100"
  tasks:
    - name: Install the k3s server Go runtime environment file
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.env
        owner: root
        group: root
        mode: "0644"
        content: |
          GOMEMLIMIT={{ k3s_gomemlimit }}
          GOGC={{ k3s_gogc }}
      register: k3s_server_env

    # Deliberately NO automatic restart. Applying a changed value requires an
    # explicit, human-timed `systemctl restart k3s`: this is the only control
    # plane, and nothing automated should ever bounce it. That principle is the
    # whole lesson of the flannel-watchdog incident.
    - name: Report that a restart is required to apply a change
      ansible.builtin.debug:
        msg: >-
          k3s.service.env changed on {{ inventory_hostname }}. Run
          `sudo systemctl restart k3s` during a maintenance window to apply it.
          Not restarted automatically: this is the single control plane.
      when: k3s_server_env is changed
