---
# Tailscale RPM repo path. The rhel/<major> repo file uses $releasever/$basearch
# and works across the whole RHEL family (Oracle/Rocky/Alma). Override per host
# only if you need the vendor-specific path.
tailscale_repo_distro: "rhel/{{ ansible_distribution_major_version }}"
