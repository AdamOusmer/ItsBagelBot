---
# Install Tailscale and join the tailnet as a NEW node, pre-authorized via a
# tagged auth key (tag:itsbagelbot). Tailscale SSH is enabled so the box stays reachable
# after the ssh_removal role tears out OpenSSH.

- name: Add Tailscale RPM repo
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_distro }}/tailscale.repo"
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"

- name: Install tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present

- name: Pin the Tailscale UDP listen port
  ansible.builtin.copy:
    dest: /etc/default/tailscaled
    mode: "0644"
    content: |
      # Managed by Ansible. A stable port is required so the cloud firewall rule
      # can name a fixed destination port. It is NOT a port to forward from a
      # home router: fleet nodes take inbound UDP on a provider address only
      # (see README.md).
      PORT="{{ tailscale_port }}"
      FLAGS=""
  register: tailscale_daemon_defaults
  notify: Restart tailscaled

- name: Enable + start tailscaled
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Apply a changed Tailscale listen port before connectivity checks
  ansible.builtin.meta: flush_handlers

- name: Current tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join the tailnet (pre-authorized, tagged, Tailscale SSH on)
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ tailscale_authkey }}
    --advertise-tags={{ tailscale_tag }}
    --hostname={{ fleet_node_name }}
    --ssh
    --accept-routes
    --accept-dns=false
  when: >-
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true   # keep the auth key out of logs

- name: Wait until Tailscale is Running
  ansible.builtin.command: tailscale status --json
  register: tailscale_ready
  changed_when: false
  retries: 12
  delay: 5
  until: (tailscale_ready.stdout | from_json).BackendState | default('') == 'Running'

# `tailscale up` above is intentionally only used for first authentication.
# Reconcile mutable preferences on every Ansible run; otherwise old nodes keep
# stale settings forever because their BackendState is already Running.
#
# --advertise-routes is appended only when the host actually declares routes.
# Passing it empty is destructive: `tailscale set --advertise-routes=` clears ALL
# advertised routes, so a run against a partial inventory would strip node1 of
# OCI's 10.0.0.0/16 and cut every pod off from the database. Omitting the flag
# leaves whatever the node already advertises untouched.
- name: Reconcile Tailscale runtime preferences
  ansible.builtin.command:
    argv: >-
      {{
        [
          'tailscale', 'set',
          '--hostname=' ~ fleet_node_name,
          '--ssh=true',
          '--accept-routes=true',
          '--accept-dns=false',
        ]
        + (
          ['--advertise-routes=' ~ tailscale_advertise_routes]
          if (tailscale_advertise_routes | default('') | length > 0)
          else []
        )
      }}
  changed_when: false

# A route is advertised but NOT usable until it is approved, and an unapproved
# route fails silently: peers simply have no path. Surface it at provision time
# rather than leaving it to be discovered when the control plane cannot reach a
# pod. Not fatal, because approval is a one-time console/ACL action that may
# legitimately lag the playbook run.
- name: Warn when advertised routes are not yet approved
  when: tailscale_advertise_routes | default('') | length > 0
  block:
    - name: Read advertised vs approved routes
      ansible.builtin.command: tailscale status --json
      register: tailscale_route_state
      changed_when: false

    - name: Report unapproved routes
      ansible.builtin.debug:
        msg: >-
          Route(s) {{ tailscale_advertise_routes }} are advertised but NOT in
          Self.AllowedIPs. Approve them in the Tailscale admin console (or add an
          ACL auto-approver) or peers will have no path to this subnet.
      when: >-
        (tailscale_route_state.stdout | from_json).Self.AllowedIPs
        | default([]) | select('search', tailscale_advertise_routes.split(',')[0])
        | list | length == 0

- name: Confirm tailscaled is listening on the pinned UDP port
  ansible.builtin.shell: >-
    set -o pipefail &&
    ss -H -lunp | grep -qE '[:.]{{ tailscale_port }}[[:space:]]'
  args:
    executable: /bin/bash
  changed_when: false

# Direct connectivity is an infrastructure precondition, not a best-effort
# optimization. If this fails, open UDP/{{ tailscale_port }} inbound in the
# cloud firewall. Do not reach for a home-router port-forward instead: a fleet
# node has to be a provider-addressed host (see README.md).
- name: Require a direct UDP path to every fleet peer
  ansible.builtin.command:
    argv:
      - tailscale
      - ping
      - "--until-direct=true"
      - "--c=10"
      - "--timeout=2s"
      - "{{ item }}"
  loop: "{{ tailscale_direct_peers }}"
  when: item != fleet_node_name
  register: tailscale_direct_ping
  changed_when: false
  failed_when: >-
    tailscale_direct_ping.rc != 0 or
    'via DERP(' in (tailscale_direct_ping.stdout_lines | default([]) | last | default('')) or
    'via peer-relay' in (tailscale_direct_ping.stdout_lines | default([]) | last | default(''))
