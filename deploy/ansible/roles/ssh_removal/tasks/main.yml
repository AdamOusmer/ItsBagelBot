---
# Final, one-way step: remove system OpenSSH so the box is tailnet-only.
# Guarded — runs only when remove_system_ssh is true AND firewall + Tailscale
# (with Tailscale SSH) are confirmed up, so access is never lost.
#
# Break-glass AFTER this runs:
#   - Tailscale SSH  (requires tailnet ACL to allow ssh into tag:itsbagelbot — verify FIRST)
#   - OVH KVM/rescue console
- name: Skip SSH removal unless explicitly enabled
  ansible.builtin.meta: end_host
  when: not remove_system_ssh | bool

# --- Safety gates ------------------------------------------------------------
- name: Confirm firewalld is running
  ansible.builtin.command: firewall-cmd --state
  register: fw_state
  changed_when: false
  failed_when: "'running' not in fw_state.stdout"

- name: Confirm Tailscale is Running
  ansible.builtin.command: tailscale status --json
  register: ts_check
  changed_when: false
  failed_when: (ts_check.stdout | from_json).BackendState | default('') != 'Running'

- name: Confirm node is tagged tag:itsbagelbot (Tailscale SSH ACL target)
  ansible.builtin.command: tailscale status --json
  register: ts_ssh
  changed_when: false
  failed_when: >-
    tailscale_tag not in ((ts_ssh.stdout | from_json).Self.Tags | default([]))

# Tailscale SSH authorizes a USER, and the tailnet ACL grants the fleet's
# non-root admin accounts (almalinux@ / opc@). A box with only root would pass
# every gate above and still be unreachable the moment OpenSSH goes: node4
# arrived from a bare image with exactly that shape (2026-07-25) and would have
# been left with provider-console access only.
- name: Find a non-root login account for Tailscale SSH
  ansible.builtin.shell:
    cmd: >-
      getent passwd | awk -F: '$3>=1000 && $3<65534 && $7 !~ /(nologin|false)$/ {print $1}'
  register: login_accounts
  changed_when: false

- name: Require a non-root login account before removing system SSH
  ansible.builtin.assert:
    that:
      - login_accounts.stdout_lines | length > 0
    fail_msg: >-
      {{ inventory_hostname }} has no non-root login account. Removing OpenSSH
      would leave Tailscale SSH with no user to authorize and strand the box.
      Create the fleet admin user (NOPASSWD sudo) first.
    success_msg: "Tailscale SSH can authorize: {{ login_accounts.stdout_lines | join(', ') }}"

# --- Tear out OpenSSH --------------------------------------------------------
- name: Stop + disable + mask sshd
  ansible.builtin.systemd:
    name: sshd
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Remove the SSH service from the public firewall zone
  ansible.posix.firewalld:
    zone: public
    service: ssh
    permanent: true
    immediate: true
    state: disabled

- name: Remove OpenSSH server package
  ansible.builtin.dnf:
    name: openssh-server
    state: absent

# Only meaningful once system SSH is gone: Tailscale SSH never consults
# authorized_keys. Matches node2/node3, which carry no root key material.
- name: Drop root's authorized_keys
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent

- name: Final reminder
  ansible.builtin.debug:
    msg: >-
      System SSH removed. This host is now reachable ONLY via Tailscale SSH
      (tag:itsbagelbot) or the OVH console. Re-provisioning runs over Tailscale SSH.
