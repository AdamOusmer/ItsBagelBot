---
# Base system: node identity, hostname, packages, kernel modules, sysctl, ulimits.
# Hardening/optimizations mirror node1 (Oracle); sysctl copied from the running fleet.

# --- Node identity (stable across re-runs) -----------------------------------
- name: Ensure fleet state dir
  ansible.builtin.file:
    path: /etc/fleet
    state: directory
    mode: "0755"

- name: Read persisted node name (if the box was already provisioned)
  ansible.builtin.slurp:
    src: /etc/fleet/node-name
  register: persisted_name
  failed_when: false

- name: Resolve node name
  ansible.builtin.set_fact:
    fleet_node_name: >-
      {{ (persisted_name.content | b64decode | trim)
         if (persisted_name.content is defined)
         else (node_name_requested
               if node_name_requested | length > 0
               else 'bot-' ~ ansible_date_time.epoch[-5:]) }}

- name: Persist node name (first run only)
  ansible.builtin.copy:
    dest: /etc/fleet/node-name
    content: "{{ fleet_node_name }}\n"
    mode: "0644"
  when: persisted_name.content is not defined

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ fleet_node_name }}"

# --- Packages ----------------------------------------------------------------
- name: Install base packages
  ansible.builtin.dnf:
    name:
      - curl
      - tar
      - iptables
      - conntrack-tools
      - policycoreutils
      - policycoreutils-python-utils
      - chrony
      # br_netfilter ships in kernel-modules-extra on RHEL10-family, NOT in the
      # base kernel-modules. Without it `modprobe br_netfilter` fails, the
      # net.bridge.bridge-nf-call-* sysctls never appear, and pod->Service
      # traffic crossing cni0 bypasses the kube-proxy iptables chains. The
      # cloud images the older fleet nodes came from happened to include it;
      # a bare image does not (node4, 2026-07-25).
      - kernel-modules-extra
      # Required by tailscale-udp-gro.sh below.
      - ethtool
    state: present

- name: Enable + start chrony (clock sync)
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

# --- Kernel modules ----------------------------------------------------------
- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      # Loaded for k3s/flannel (managed by Ansible)
      br_netfilter
      overlay

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay
  ignore_errors: true

# --- sysctl tuning (copied verbatim from running fleet) ----------------------
- name: Kubernetes / Tailscale / TCP sysctl tuning
  ansible.builtin.copy:
    src: 99-kubernetes-tuning.conf
    dest: /etc/sysctl.d/99-kubernetes-tuning.conf
    mode: "0644"
  notify: reload sysctl

# --- Retire the superseded inotify band-aid ----------------------------------
# node1 carried an untracked `inotify-heal` timer (every 5 min) that doubled
# fs.inotify.max_user_instances whenever usage hit 80% and rewrote its own
# /etc/sysctl.d/99-inotify.conf. It predates this role, which now pins 8192
# permanently (64x the kernel default) — so the healer never fires and is dead
# weight. Worse, its file pinned 512 and only lost the race because
# "99-inotify" sorts before "99-kubernetes-tuning": drop this role's file and
# the fleet would silently downgrade to 512. Removed live 2026-07-17 (it had
# not fired in 7 days; node1 sat at 99 instances against the 8192 ceiling).
- name: Remove the superseded inotify-heal band-aid
  ansible.builtin.systemd:
    name: inotify-heal.timer
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the superseded inotify-heal files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/inotify-heal.timer
    - /etc/systemd/system/inotify-heal.service
    - /usr/local/bin/inotify-heal.sh
    - /etc/sysctl.d/99-inotify.conf
  register: inotify_heal_removed
  notify: reload sysctl

- name: Reload systemd after removing inotify-heal
  ansible.builtin.systemd:
    daemon_reload: true
  when: inotify_heal_removed is changed

- name: NATS RPC latency sysctl tuning
  ansible.builtin.copy:
    src: 99-nats-rpc.conf
    dest: /etc/sysctl.d/99-nats-rpc.conf
    mode: "0644"
  notify: reload sysctl

# --- Cluster network tuning --------------------------------------------------
# These three lived loose in deploy/k8s/network-tune/ and were applied BY HAND.
# node4 (2026-07-25) joined the fleet without any of them and nobody would have
# noticed until a burst drop; a node the playbook provisions must arrive tuned.
- name: Cluster network sysctl tuning (16MiB socket buffers, backlog, PMTU probing)
  ansible.builtin.copy:
    src: 90-bagelbot-net.conf
    dest: /etc/sysctl.d/90-bagelbot-net.conf
    mode: "0644"
  notify: reload sysctl

- name: Install the Tailscale underlay UDP-GRO script
  ansible.builtin.copy:
    src: tailscale-udp-gro.sh
    dest: /usr/local/sbin/tailscale-udp-gro.sh
    mode: "0755"

- name: Install the Tailscale underlay UDP-GRO unit
  ansible.builtin.copy:
    src: tailscale-udp-gro.service
    dest: /etc/systemd/system/tailscale-udp-gro.service
    mode: "0644"

# Despite the unit's After=tailscaled, the script only needs ethtool and the
# default-route device, so it converges here even though the tailscale role has
# not run yet on a fresh box.
- name: Enable + start the Tailscale underlay UDP-GRO policy
  ansible.builtin.systemd:
    name: tailscale-udp-gro.service
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure the tailscaled drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    state: directory
    mode: "0755"

# Written before tailscaled exists on a fresh node; systemd picks the drop-in up
# when the unit appears, so first start already carries the raised MTU.
- name: Pin the Tailscale MTU drop-in
  ansible.builtin.copy:
    src: tailscaled-10-mtu.conf
    dest: /etc/systemd/system/tailscaled.service.d/10-mtu.conf
    mode: "0644"
  register: ts_mtu_dropin

# Deliberately NO automatic restart: bouncing tailscaled on an already-joined
# node drops the tailnet, which on an SSH-removed box is the ONLY way in.
- name: Report that a tailscaled restart is required to apply a changed MTU
  ansible.builtin.debug:
    msg: >-
      tailscaled MTU drop-in changed on {{ inventory_hostname }}. Apply with a
      detached `systemd-run --on-active=3 systemctl restart tailscaled` — a
      foreground restart kills your own session on a tailnet-only host.
  when: ts_mtu_dropin is changed and not ansible_check_mode

# --- Block device write path -------------------------------------------------
- name: Install the fleet block-device policy
  ansible.builtin.copy:
    src: 60-fleet-io.rules
    dest: /etc/udev/rules.d/60-fleet-io.rules
    mode: "0644"
  register: fleet_io_rules

- name: Apply the block-device policy now
  ansible.builtin.command: udevadm trigger --subsystem-match=block --action=change
  when: fleet_io_rules is changed
  changed_when: true

# Valkey's fork/COW persistence path suffers severe tail-latency spikes when
# transparent huge pages are active. Keep the host policy reusable by both the
# fresh-node role and the existing-cluster reconciliation playbook.
- name: Apply Valkey host latency tuning
  ansible.builtin.import_tasks: valkey_host_tuning.yml

# --- ulimits -----------------------------------------------------------------
- name: Raise nofile / disable core dumps (matches fleet)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-fleet.conf
    mode: "0644"
    content: |
      # Managed by Ansible — matches running fleet
      *               soft    core            0
      root            soft    core            0
      *               hard    core            infinity
      root            hard    core            infinity
      *               soft    nofile          1048576
      *               hard    nofile          1048576
      root            soft    nofile          1048576
      root            hard    nofile          1048576

# --- Root account ------------------------------------------------------------
# Fleet convention (node2/node3): root password LOCKED, admin user reaches root
# through NOPASSWD sudo. Cloud images ship root already locked, so this was
# invisible until node4 arrived from a bare image with a usable root password
# (2026-07-25). Locks the PASSWORD only — key-based auth is untouched, so a run
# connecting as root does not sever its own connection.
- name: Lock the root password
  ansible.builtin.user:
    name: root
    password_lock: true
