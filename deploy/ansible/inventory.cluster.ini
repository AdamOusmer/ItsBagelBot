# Live production fleet. Roles are declared with itsbagelbot.dev/role on each
# node (cp / node / worker); the control plane additionally carries
# itsbagelbot.dev/role=cp:NoSchedule so it never takes application workloads.
#
# node1 is the k3s server (control plane moved node3 -> node1 2026-07-27). It is
# a 2-core ARM box behind NAT: enp0s6 holds a private address, so it must
# advertise node_external_ip for the WireGuard mesh to reach it.
#
# node4/node5/node6 are the application tier: identical 12-core Servarica hosts.
# node2, node3 and worker1 were retired 2026-07-27.
[cluster]
node1 ansible_host=node1 ansible_user=opc k3s_role=server flannel_iface=enp0s6 node_external_ip=<node1-public> wireguard_endpoint=<node1-public> api_advertise_address=100.98.67.104 node_role=cp
node4 ansible_host=node4 ansible_user=almalinux k3s_role=agent flannel_iface=eth0 node_external_ip=<node4-public> wireguard_endpoint=<node4-public> node_role=node
node5 ansible_host=node5 ansible_user=almalinux k3s_role=agent flannel_iface=eth0 node_external_ip=<node5-public> wireguard_endpoint=<node5-public> node_role=node
node6 ansible_host=node6 ansible_user=almalinux k3s_role=agent flannel_iface=eth0 node_external_ip=<node6-public> wireguard_endpoint=<node6-public> node_role=node

[k3s_server]
node1

[k3s_agents]
node4
node5
node6

[k3s_first_agent]
node4

[k3s_remaining_agents]
node5
node6
