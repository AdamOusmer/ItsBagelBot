server_name: $POD_NAME
server_tags: [$POD_NAME]

port: 4222
http_port: 8222

max_connections: 1024
max_payload: 8MB
max_pending: 128MB

write_deadline: "10s"

ping_interval: "20s"
ping_max: 3

# verify:true: every workload must present nats-client-tls first, or the fleet drops on reconnect.
tls {
  cert_file: "/etc/nats/certs/tls.crt"
  key_file:  "/etc/nats/certs/tls.key"
  ca_file:   "/etc/nats/intermediate-ca/ca.pem"
  verify: true
  timeout: 5
}

cluster {
  name: "bagelbot"
  port: 6222
  accounts: ["BUS"]
  compression: {
    mode: s2_fast
  }
  tls {
    cert_file: "/etc/nats/certs/tls.crt"
    key_file:  "/etc/nats/certs/tls.key"
    ca_file:   "/etc/nats/certs/ca.crt"
    timeout: 5
  }
  routes: [
    "nats-route://nats-0.nats-headless.messaging.svc.cluster.local:6222"
    "nats-route://nats-1.nats-headless.messaging.svc.cluster.local:6222"
    "nats-route://nats-2.nats-headless.messaging.svc.cluster.local:6222"
  ]
}

# prof_port stays: once a server ran with it, a config without it makes every reload fail.
prof_port: 6060

jetstream {
  store_dir: /data/jetstream
  domain: hub
  # Lowering max_mem is not hot-reloadable: it wedges every later SIGHUP until all pods restart.
  max_mem: 4GB
  max_file: 2GB
  max_buffered_msgs: 262144
  max_buffered_size: 128MB
  limits {
    batch {
      max_inflight_per_stream: 200
    }
  }
}

max_subscriptions: 0
max_control_line: 4KB

include "auth.conf"
