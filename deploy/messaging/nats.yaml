apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: nats
  name: nats
  namespace: messaging
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  revisionHistoryLimit: 10
  minReadySeconds: 30
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "7777"
        prometheus.io/scrape: "true"
        newrelic.io/scrape: "true"
      labels:
        app: nats
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      affinity:
        # Required one member per node: two members on one host turn a node loss into a quorum loss.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: nats
      shareProcessNamespace: true
      securityContext:
        # PREREQUISITE: every kubelet must allow net.ipv4.tcp_slow_start_after_idle, or pods fail SysctlForbidden.
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-data-plane
      containers:
        - name: nats
          image: nats:2.14.7-alpine@sha256:4063edae0717ba5f7501bfde75f97fd9b57f5b93597b92c70b6a6fbbf6a74e06


          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/nats/nats.conf", "--pid", "/var/run/nats/nats.pid"]


          envFrom:
            - secretRef:
                name: nats-auth-env
          env:
            - name: GOMAXPROCS
              value: "5"
            - name: GOGC
              value: "400"





            # Integer bytes only: the Go runtime aborts on a value like "6.5GiB".
            - name: GOMEMLIMIT
              value: "6656MiB"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - {containerPort: 4222, name: client}
            - {containerPort: 8222, name: monitor}
            - {containerPort: 6222, name: cluster}
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: certs, mountPath: /etc/nats/certs, readOnly: true}
            - {name: intermediate-ca, mountPath: /etc/nats/intermediate-ca, readOnly: true}
            - {name: jetstream-data, mountPath: /data/jetstream}


            - {name: pid, mountPath: /var/run/nats}
          resources:
            # Keep nats-server.conf max_mem under this limit: JetStream cannot see the container limit.
            requests: {cpu: "1000m", memory: 4Gi}
            limits: {cpu: "5", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            # 10 minutes: the boot re-sync takes ~6.5 min, and a shorter budget crash-loops the member.
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 1
          livenessProbe:
            # js-server-only: plain /healthz is 503 while a follower catches up, and a restart sets it further back.
            httpGet: {path: "/healthz?js-server-only=true", port: monitor}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: "/healthz?js-enabled-only=true", port: monitor}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
        - name: reloader
          image: natsio/nats-server-config-reloader:0.23.0@sha256:64cb6c858e794906d3167378e02b7e0feb83c4e14c07b371eb8d921ef8c4a60b
          imagePullPolicy: IfNotPresent
          args:
            - "-pid"
            - "/var/run/nats/nats.pid"
            - "-config"
            - "/etc/nats/nats.conf"
            - "-config"
            - "/etc/nats/auth.conf"
            - "-config"
            - "/etc/nats/certs/tls.crt"
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: certs, mountPath: /etc/nats/certs, readOnly: true}
            - {name: intermediate-ca, mountPath: /etc/nats/intermediate-ca, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
        - name: prometheus-nats-exporter
          image: natsio/prometheus-nats-exporter:0.20.1@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
          imagePullPolicy: IfNotPresent
          args: ["-varz", "-connz", "-subz", "-routez", "-jsz=all", "http://localhost:8222"]
          ports:
            - {containerPort: 7777, name: metrics}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:


        - name: intermediate-ca
          configMap:
            name: fleet-intermediate-ca
        - name: config
          configMap:
            name: nats-config
        - name: certs
          secret:
            secretName: nats-hub-tls
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: jetstream-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
---
# Losing two members loses every stream's write path; without this budget a two-node drain is an outage.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app: nats
  name: nats
  namespace: messaging
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: nats
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nats
  name: nats
  namespace: messaging
spec:
  trafficDistribution: PreferSameNode
  selector:
    app: nats
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nats
  name: nats-headless
  namespace: messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nats
  ports:
    - {name: cluster, port: 6222, targetPort: cluster}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nats-monitoring
  namespace: messaging
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: nats
      port:
        number: 8222
  tls:
    - hosts:
        - nats-monitoring
