# Coupled to pkg/bus: keep JetStream off here and the "<node>--" server_name prefix failback.go matches.

server_name: $NATS_SERVER_NAME

port: 4223
http_port: 8223

max_connections: 1024
max_payload: 8MB
max_pending: 64MB
write_deadline: "2s"

ping_interval: "20s"
ping_max: 3

tls {
  cert_file: "/etc/nats/certs/tls.crt"
  key_file:  "/etc/nats/certs/tls.key"
  ca_file:   "/etc/nats/intermediate-ca/ca.pem"
  verify: true
  timeout: 5
}

lame_duck_grace_period: "5s"
lame_duck_duration: "30s"

cluster {
  name: "nats-leaf"
  port: 6223
  # -1 disables route pooling: pooled pipes stranded queue interest and requests got 503 no-responders.
  pool_size: -1
  tls {
    cert_file: "/etc/nats/certs/tls.crt"
    key_file:  "/etc/nats/certs/tls.key"
    ca_file:   "/etc/nats/certs/ca.crt"
    timeout: 5
  }
  routes: [ "nats://nats-leaf-peers.messaging.svc.cluster.local:6223" ]
  no_advertise: true
}

max_subscriptions: 0
max_control_line: 4KB

resolver {
  type: full
  dir: "/data/resolver"
  allow_delete: false
  interval: "2m"
}

include "auth.conf"
