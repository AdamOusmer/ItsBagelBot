apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: nats-leaf
  name: nats-leaf
  namespace: messaging
spec:
  revisionHistoryLimit: 5
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nats-leaf
  template:
    metadata:
      annotations:
        itsbagelbot.dev/config-revision: "leaf-rpc-pool-off-v1-nats-2146"
        prometheus.io/path: /metrics
        prometheus.io/port: "7778"
        prometheus.io/scrape: "true"
        newrelic.io/scrape: "true"
      labels:
        app: nats-leaf
    spec:
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 45
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_slow_start_after_idle
            value: "0"
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      priorityClassName: bagel-data-plane
      containers:
        - name: nats
          image: nats:2.14.7-alpine@sha256:4063edae0717ba5f7501bfde75f97fd9b57f5b93597b92c70b6a6fbbf6a74e06
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'export NATS_SERVER_NAME="${NODE_NAME}--${POD_NAME}"; exec nats-server --config /etc/nats/nats.conf --pid /var/run/nats/nats.pid'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOMEMLIMIT
              value: 192MiB
          envFrom:
            - secretRef:
                name: nats-auth-env
          ports:
            - {containerPort: 4223, name: client}
            - {containerPort: 8223, name: monitor}
            - {containerPort: 6223, name: cluster}
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: certs, mountPath: /etc/nats/certs, readOnly: true}
            - {name: intermediate-ca, mountPath: /etc/nats/intermediate-ca, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 2000m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 5
            failureThreshold: 10
            timeoutSeconds: 1
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            # Plain /healthz: JetStream is disabled, so a JS-scoped probe never reports ready.
            httpGet: {path: /healthz, port: monitor}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                # The sleep must outlast lame_duck_grace_period + lame_duck_duration (35s); a bare SIGTERM aborts the drain.
                command: ["/bin/sh", "-c", "nats-server --signal ldm=/var/run/nats/nats.pid; sleep 36"]
        - name: reloader
          image: natsio/nats-server-config-reloader:0.23.0@sha256:64cb6c858e794906d3167378e02b7e0feb83c4e14c07b371eb8d921ef8c4a60b
          imagePullPolicy: IfNotPresent
          args:
            - "-pid"
            - "/var/run/nats/nats.pid"
            - "-config"
            - "/etc/nats/nats.conf"
            - "-config"
            - "/etc/nats/auth.conf"
            - "-config"
            - "/etc/nats/certs/tls.crt"
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: certs, mountPath: /etc/nats/certs, readOnly: true}
            - {name: intermediate-ca, mountPath: /etc/nats/intermediate-ca, readOnly: true}
            - {name: pid, mountPath: /var/run/nats}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
        - name: prometheus-nats-exporter
          image: natsio/prometheus-nats-exporter:0.20.1@sha256:4fbf6dacb84780a45a1c3af9b1080c69451a288d20902deae671b80717bb8f61
          imagePullPolicy: IfNotPresent
          args: ["-port", "7778", "-varz", "-connz", "-subz", "-routez", "-jsz=all", "http://localhost:8223"]
          ports:
            - {containerPort: 7778, name: metrics}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: intermediate-ca
          configMap:
            name: fleet-intermediate-ca
        - name: config
          configMap:
            name: nats-leaf-config
        - name: certs
          secret:
            secretName: nats-leaf-tls
        - name: pid
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nats-leaf
  name: nats-leaf
  namespace: messaging
spec:
  trafficDistribution: PreferSameNode
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 60
  selector:
    app: nats-leaf
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nats-leaf
  name: nats-leaf-local
  namespace: messaging
spec:
  internalTrafficPolicy: Local
  selector:
    app: nats-leaf
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nats-leaf
  name: nats-leaf-peers
  namespace: messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nats-leaf
  ports:
    - {name: client, port: 4223, targetPort: client}
    - {name: monitor, port: 8223, targetPort: monitor}
    - {name: cluster, port: 6223, targetPort: cluster}
