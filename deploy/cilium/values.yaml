bandwidthManager:
  enabled: true
  bbr: true

bpf:
  hostRouting: true
  masquerade: true
  events:
    trace:
      enabled: true
    policyVerdict:
      enabled: false
    drop:
      enabled: true

enableIPv4BIGTCP: true

pmtuDiscovery:
  enabled: true

routingMode: native

autoDirectNodeRoutes: true

ipv4NativeRoutingCIDR: 10.42.0.0/16

ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16

k8sServiceHost: 100.98.67.104
k8sServicePort: 6443

kubeProxyReplacement: true

# Without this, Cilium ignores kube-dns trafficDistribution: PreferSameNode.
loadBalancer:
  serviceTopology: true

hubble:
  enabled: true
  eventBufferCapacity: "4095"
  metrics:
    enabled: ~
  relay:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  ui:
    enabled: false

# Off because no policy uses L7 or toFQDNs rules; turn l7Proxy and envoy back on before adding one.
l7Proxy: false

envoy:
  enabled: false
  rollOutPods: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

operator:
  replicas: 2

rollOutCiliumPods: true

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
