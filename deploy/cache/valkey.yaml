apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  name: valkey
  namespace: cache
spec:
  # PreferSameNode, not the deprecated PreferClose. Keeps a caller on the
  # backend running on its own node, with fallback to a peer when the local
  # one is unready -- unlike internalTrafficPolicy: Local, which has no
  # fallback. Set fleet-wide 2026-08-20 after cross-node DNS to the cp1
  # resolver, reached over tailscale0, was traced to intermittent Cilium
  # drops that cost a 5s resolver timeout per lost packet.
  trafficDistribution: PreferSameNode
  ports:
  - name: tls-redis
    port: 6380
    protocol: TCP
    targetPort: redis-tls
  - name: tls-sentinel
    port: 26380
    protocol: TCP
    targetPort: sentinel-tls
  selector:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  name: valkey-local
  namespace: cache
spec:
  # kube-proxy selects only the endpoint on the caller's node. This keeps
  # node-local reads on that node's own listener, with no cross-node hop.
  # Since the scale-up to replicas: 3 every schedulable node (node1, node2,
  # node3) carries one member, so callers there always have a local endpoint.
  # cp1 is tainted and runs no app pods, so its lack of a member is not a gap.
  # The Sentinel-only fallback in pkg/valkey NewClient is therefore no longer
  # the normal path, but it is deliberately kept: a member being down or
  # unready on one node must degrade that node's callers to Sentinel-routed
  # reads, not fail them.
  internalTrafficPolicy: Local
  ports:
  - name: tls-redis
    port: 6380
    protocol: TCP
    targetPort: redis-tls
  selector:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  name: valkey-headless
  namespace: cache
spec:
  ports:
  - name: redis-tls
    port: 6380
    protocol: TCP
    targetPort: redis-tls
  - name: sentinel-tls
    port: 26380
    protocol: TCP
    targetPort: sentinel-tls
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: valkey
  namespace: cache
spec:
  # TODAY there is one member, so this budget cannot protect quorum -- it only
  # keeps a crash-looping pod evictable during a drain. Re-derive this from
  # Sentinel quorum arithmetic (2-of-3 needs maxUnavailable: 1) when replicas
  # scales to 3 below.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app.kubernetes.io/name: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    itsbagelbot.dev/valkey-partitioning: disabled
    itsbagelbot.dev/valkey-topology: sentinel-single-primary
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: valkey
    app.kubernetes.io/name: valkey
  name: valkey-node
  namespace: cache
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  # ONE member today: this is a fresh single-node-capable cluster and pkg/valkey
  # (buildOption in pkg/valkey/client.go) hardcodes the Sentinel master-set name
  # "myprimary" and only takes the Sentinel path when the configured address is
  # a Sentinel port, so a real (if 1-node) Sentinel deployment is what every
  # consumer's VALKEY_ADDR already expects, not a bare standalone connection.
  #
  # Scale to 3 when more nodes are dedicated to this tier: bump replicas to 3,
  # sentinel monitor quorum in valkey.yaml's config-init from 1 back to 2, and
  # min-replicas-to-write in config/tuning.conf from 0 back to 1. Nothing else
  # in this file is ordinal- or count-specific.
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: node
      app.kubernetes.io/instance: valkey
      app.kubernetes.io/name: valkey
  serviceName: valkey-headless
  template:
    metadata:
      annotations:
        # TLS is native (Valkey's own tls-port) end to end; the pods run on
        # the Cilium pod network (hostNetwork removed 2026-08-18) like every
        # other workload, matching nats (deploy/messaging/).
        secrets.doppler.com/reload: 'true'
      labels:
        app.kubernetes.io/component: node
        app.kubernetes.io/instance: valkey
        app.kubernetes.io/name: valkey
    spec:
      # Seed the writable /data copies of valkey.conf and sentinel.conf ONCE.
      # After first boot valkey and sentinel own these files: valkey rewrites
      # replicaof on every Sentinel-driven failover and sentinel persists its
      # known peers/epoch, so a restarted pod reads its real current role from
      # /data instead of re-deriving it. Every member announces its stable
      # StatefulSet DNS identity, independent of the node it is scheduled on.
      # Resolver options, uniform across every first-party workload.
      #
      # ndots 1, not the kubelet default of 5: under ndots:5 any name with
      # fewer than 5 dots is tried against all three search domains BEFORE
      # being tried as written, so a 4-dot cluster FQDN costs 4 queries and
      # an external name like api.twitch.tv costs 4 too -- three guaranteed
      # NXDOMAINs, then the answer. Measured on coredns 2026-08-20: 16704
      # denial cache hits against 10368 success hits, so 62% of everything
      # served was the junk half of that expansion.
      #
      # single-request-reopen: glibc sends the A and AAAA queries in parallel
      # from one socket; the two replies can race in conntrack and one gets
      # dropped, which costs a full resolver timeout. Reopening the socket
      # for the second query removes the race.
      #
      # timeout 1 + attempts 3, rather than the previous 2/2 and the glibc
      # default 5/2. A dropped UDP packet costs 1s instead of 5s, and 3s
      # worst case instead of 10s. The 1s matters specifically because Valkey
      # Sentinel resolves hostnames inside its event loop and declares "tilt"
      # -- refusing failover for a fixed 30s -- when that loop stalls beyond
      # 2s. At timeout 2 a single lost packet sat exactly on that threshold.
      # See deploy/cache/valkey.yaml for the measurement that found it.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
          - {name: single-request-reopen}
          - {name: timeout, value: "1"}
          - {name: attempts, value: "3"}
      initContainers:
      - name: config-init
        image: valkey/valkey@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          # Every member is equally eligible for promotion and Sentinel's own
          # election decides. Nothing here depends on which node a member
          # lands on.
          POD_FQDN="${POD_NAME}.valkey-headless.cache.svc.cluster.local"
          # This is the only valkey-cli call that leaves the pod: it reaches
          # the Sentinel Service, so during a rollout it can land on a member
          # still running the previous revision. The client certificate is
          # always presented (fix(valkey): keep client cert on Sentinel
          # lookup, commit 8566a40e) because tls-auth-clients yes rejects a
          # bare handshake outright; presenting it is accepted whether the
          # peer requires it or not.
          lookup_master() {
            { REDISCLI_AUTH="${CORE}" valkey-cli -h valkey.cache.svc.cluster.local -p 26380 --tls --cacert /etc/valkey/tls/ca.crt --cert /etc/valkey/tls/tls.crt --key /etc/valkey/tls/tls.key --sni valkey.cache.svc.cluster.local --no-auth-warning sentinel get-master-addr-by-name myprimary 2>/dev/null || true; } \
              | head -n 1 | tr -d '"'
          }
          LIVE_MASTER=$(lookup_master)

          # A FRESH member with no Sentinel quorum to ask is the only case
          # that needs a deterministic choice. Ordinal 0 seeds and any later
          # ordinal waits for its view, so two simultaneously-fresh members
          # never both declare themselves primary. The seed is the ORDINAL,
          # never a hostname or node. A member with a retained config already
          # has a role and does not wait.
          if [ ! -f /data/valkey.conf ] && [ -z "${LIVE_MASTER}" ] && [ "${POD_NAME}" != "valkey-node-0" ]; then
            echo "Cold start with no Sentinel primary; waiting for valkey-node-0 to seed before starting ${POD_FQDN}"
            while [ -z "${LIVE_MASTER}" ]; do
              sleep 2
              LIVE_MASTER=$(lookup_master)
            done
          fi

          MASTER_ENDPOINT="${POD_FQDN}"
          if [ -n "${LIVE_MASTER}" ]; then
            MASTER_ENDPOINT="${LIVE_MASTER}"
          fi
          if [ ! -f /data/valkey.conf ]; then
            cp /config/valkey.conf /data/valkey.conf
            {
              echo "masterauth ${CORE}"
              echo "replica-announce-ip ${POD_FQDN}"
              echo "replica-announce-port 6380"
            } >> /data/valkey.conf
            # The seeding member reaches here with MASTER_ENDPOINT equal to
            # its own FQDN and writes no replicaof line, which is what makes
            # it primary.
            if [ -n "${LIVE_MASTER}" ] && [ "${POD_FQDN}" != "${MASTER_ENDPOINT}" ]; then
              echo "replicaof ${MASTER_ENDPOINT} 6380" >> /data/valkey.conf
            fi
            chmod 600 /data/valkey.conf
          fi
          sed -i '/^replica-priority /d' /data/valkey.conf
          # Keep ConfigMap-backed runtime policy authoritative over retained
          # CONFIG REWRITE output.
          sed -i '\|^include /config/tuning.conf$|d' /data/valkey.conf
          echo "include /config/tuning.conf" >> /data/valkey.conf
          # io-threads derived from the CPU limit, same as maxmemory above, so
          # resources.limits.cpu stays the single number to tune. Valkey 9.1
          # uses lock-free queues between the main thread and I/O workers, so
          # extra threads help read throughput but each one costs some
          # busy-wait; reserve 2 cores for the main thread and background
          # work, and cap at 8 (past that Valkey's own guidance says returns
          # go negative). At limits.cpu 6 this yields 4.
          if [ -n "${CPU_LIMIT}" ] && [ "${CPU_LIMIT}" -gt 2 ] 2>/dev/null; then
            IO_THREADS=$(( CPU_LIMIT - 2 ))
            [ "${IO_THREADS}" -gt 8 ] && IO_THREADS=8
          else
            IO_THREADS=1
          fi
          sed -i '/^io-threads /d' /data/valkey.conf
          echo "io-threads ${IO_THREADS}" >> /data/valkey.conf
          echo "config-init: cpu limit ${CPU_LIMIT} -> io-threads ${IO_THREADS}"
          # maxmemory is derived from the container limit rather than pinned,
          # so raising resources.limits.memory is the ONLY number to change.
          # 60% is not arbitrary: maxmemory governs used_memory, but the
          # cgroup kills on RSS, and several things live in RSS but outside
          # used_memory's eviction accounting -- replica client output
          # buffers, the AOF buffer, fork/COW pages during BGREWRITEAOF
          # (appendonly yes, auto-aof-rewrite-min-size 1gb) and during a
          # diskless full sync, per-connection TLS buffers (full mTLS here,
          # every peer pays), and jemalloc fragmentation (measured 1.25 on
          # 2026-08-20). A BGREWRITEAOF that forks while the dataset is at
          # maxmemory can approach 2x in the worst case, so the headroom has
          # to be roughly the same size as the budget itself.
          # Note repl-backlog-size 128mb IS counted inside used_memory, so
          # usable key space is maxmemory minus 128 MiB.
          # Appended after the include so it beats both tuning.conf and any
          # CONFIG REWRITE retained on the PVC -- last assignment wins.
          if [ -n "${MEM_LIMIT_MI}" ] && [ "${MEM_LIMIT_MI}" -gt 0 ] 2>/dev/null; then
            MAXMEMORY_MI=$(( MEM_LIMIT_MI * 60 / 100 ))
          else
            # No limit set on the container means the Downward API yields the
            # node allocatable, or nothing. Neither is a safe budget, so fall
            # back to the historical fixed value instead of guessing high.
            MAXMEMORY_MI=512
          fi
          sed -i '/^maxmemory /d' /data/valkey.conf
          echo "maxmemory ${MAXMEMORY_MI}mb" >> /data/valkey.conf
          echo "maxmemory-policy volatile-lru" >> /data/valkey.conf
          echo "config-init: container limit ${MEM_LIMIT_MI}Mi -> maxmemory ${MAXMEMORY_MI}mb"
          # Reconcile this member's stable DNS identity before Valkey starts.
          sed -i '/^replica-announce-ip /d' /data/valkey.conf
          echo "replica-announce-ip ${POD_FQDN}" >> /data/valkey.conf
          # A planned failover may have changed the live primary after
          # Valkey's last CONFIG REWRITE. When Sentinel answered above, its
          # current view is authoritative.
          if [ -n "${LIVE_MASTER}" ]; then
            sed -i '/^replicaof /d' /data/valkey.conf
            if [ "${POD_FQDN}" != "${MASTER_ENDPOINT}" ]; then
              echo "replicaof ${MASTER_ENDPOINT} 6380" >> /data/valkey.conf
            fi
          fi
          if [ ! -f /data/sentinel.conf ]; then
            cp /config/sentinel.conf /data/sentinel.conf
            {
              echo "requirepass ${CORE}"
              echo "sentinel auth-pass myprimary ${CORE}"
              echo "sentinel announce-ip ${POD_FQDN}"
              echo "sentinel announce-port 26380"
              # Quorum 2: 2-of-3 for a 3 replica cluster.
              echo "sentinel monitor myprimary ${MASTER_ENDPOINT} 6380 2"
            } >> /data/sentinel.conf
            chmod 600 /data/sentinel.conf
          fi
          sed -i '/^sentinel announce-ip /d' /data/sentinel.conf
          echo "sentinel announce-ip ${POD_FQDN}" >> /data/sentinel.conf
          sed -i '/^sentinel resolve-hostnames /d; /^sentinel announce-hostnames /d' /data/sentinel.conf
          {
            echo "sentinel resolve-hostnames yes"
            echo "sentinel announce-hostnames yes"
          } >> /data/sentinel.conf
          awk '
            $1 == "sentinel" && ($2 == "known-replica" || $2 == "known-sentinel") && $3 == "myprimary" {
              endpoint = $2 FS $4 FS $5
              if (seen[endpoint]++) next
            }
            { print }
          ' /data/sentinel.conf > /data/sentinel.conf.dedup
          mv /data/sentinel.conf.dedup /data/sentinel.conf
          chmod 600 /data/sentinel.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CORE
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        # Valkey never reads the cgroup limit itself -- maxmemory is a number
        # it is told, and it has no idea what the container was given. The
        # Downward API is the only way to get the limit into the pod, and
        # resourceFieldRef from an initContainer must name the target
        # container explicitly. divisor 1Mi yields whole MiB, rounded up.
        - name: MEM_LIMIT_MI
          valueFrom:
            resourceFieldRef:
              containerName: valkey
              resource: limits.memory
              divisor: 1Mi
        - name: CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: valkey
              resource: limits.cpu
              divisor: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /config
          name: valkey-config
          readOnly: true
        - mountPath: /etc/valkey/tls
          name: valkey-tls
          readOnly: true
      priorityClassName: bagel-data-plane
      containers:
      - command:
        - valkey-server
        - /data/valkey.conf
        - --replica-announce-ip
        - $(POD_NAME).valkey-headless.cache.svc.cluster.local
        - --replica-announce-port
        - "6380"
        - --masterauth
        - $(CORE)
        - --cluster-enabled
        - "no"
        - --replica-read-only
        - "yes"
        # --maxmemory is deliberately NOT repeated here. Command-line flags
        # override the config file, which would defeat the limit-derived
        # value config-init writes into /data/valkey.conf. The retained-PVC
        # protection those repeated flags exist for is provided instead by
        # config-init deleting and re-appending maxmemory on every boot.
        - --maxmemory-policy
        - volatile-lru
        - --port
        - "0"
        - --tls-port
        - "6380"
        - --tls-cert-file
        - /etc/valkey/tls/tls.crt
        - --tls-key-file
        - /etc/valkey/tls/tls.key
        - --tls-ca-cert-file
        - /etc/valkey/tls/ca.crt
        # Full mTLS: command-line policy is authoritative even over a retained
        # /data/valkey.conf, same as every other flag repeated here.
        - --tls-auth-clients
        - "yes"
        - --tls-replication
        - "yes"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CORE
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        image: valkey/valkey@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -s
            - /data/valkey.sock
            - ping
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: valkey
        ports:
        - containerPort: 6380
          name: redis-tls
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -s
            - /data/valkey.sock
            - ping
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        startupProbe:
          exec:
            command:
            - valkey-cli
            - -s
            - /data/valkey.sock
            - ping
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        resources:
          limits:
            # Raised 2 -> 6. Measured 2026-08-20: this container has NEVER
            # been throttled (nr_throttled 0 across 2.2M CFS periods, all
            # three members) at 36m steady usage, so the old limit was not
            # hurting anything today. It was, however, the stated reason
            # io-threads was pinned at 2, and io-threads cannot use cores the
            # cgroup will not grant. Nodes are 12-core with 29% of CPU
            # requests committed, so 6 is affordable headroom.
            # This raises the CEILING; it does not speed up current traffic.
            # Live load is 81 ops/s and 2.79 kbps out, which two threads
            # already serve without effort. The real ceiling on this fleet is
            # TLS handshake CPU, not bandwidth: 70292 connections have been
            # accepted against 127 steady clients, because each exec probe
            # spawns a fresh valkey-cli that cannot reuse a session ticket
            # and therefore pays a full handshake every time.
            cpu: '6'
            # 512 MiB maxmemory + 128 MiB replication backlog still need room
            # for allocator overhead, TLS buffers, AOF fork/COW and full sync.
            # Measured 2026-08-20 on valkey-node-0: used_memory 98.4 MiB, of
            # which used_memory_dataset is only 1.28 MiB (1.26%) and
            # mem_replication_backlog is 93.8 MiB growing to the configured
            # 128 MiB. RSS 122.5 MiB, frag ratio 1.25, evicted_keys 0, peak ==
            # current. So the steady-state floor is the backlog, not the data.
            # Raised 2 GiB -> 3 GiB purely as fork/COW headroom: a full sync to
            # two replicas plus an AOF rewrite can fork while the backlog is
            # full, and 2 GiB left no margin for that to coincide with a
            # dataset that grows toward maxmemory. Limits are not reservations,
            # so this costs nothing until it is actually needed; requests stay
            # at 384 Mi, which still covers measured RSS. maxmemory is
            # deliberately NOT raised with this - 512 MiB is already ~400x the
            # live dataset, and raising it would only raise the fork/COW
            # worst case this margin exists to absorb.
            memory: 3Gi
          requests:
            cpu: 250m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /secrets/users
          name: users-secret
          readOnly: true
        - mountPath: /config
          name: valkey-config
          readOnly: true
        - mountPath: /etc/valkey/tls
          name: valkey-tls
          readOnly: true
      - command:
        - valkey-server
        - /data/sentinel.conf
        - --sentinel
        - --port
        - "0"
        - --tls-port
        - "26380"
        - --tls-cert-file
        - /etc/valkey/tls/tls.crt
        - --tls-key-file
        - /etc/valkey/tls/tls.key
        - --tls-ca-cert-file
        - /etc/valkey/tls/ca.crt
        - --tls-auth-clients
        - "yes"
        - --tls-replication
        - "yes"
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              key: valkey-password
              name: valkey-core-secret
        image: valkey/valkey@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --cert
            - /etc/valkey/tls/tls.crt
            - --key
            - /etc/valkey/tls/tls.key
            - --sni
            - valkey.cache.svc.cluster.local
            - ping
          # failureThreshold 6, NOT the default 3. Sentinel enters "tilt" when
          # it detects its event loop was delayed abnormally, and a tilt
          # window is a fixed 30s (SENTINEL_TILT_PERIOD). At failureThreshold
          # 3 the liveness budget is periodSeconds 10 x 3 = exactly 30s, so a
          # single tilt sits precisely on the kill boundary, and the same
          # event-loop stall that caused the tilt also delays this probe's
          # mTLS handshake. Measured 2026-08-20: valkey-node-1 tilted 62
          # times, 1474s across a 3h24m window (12.0% of the time), against
          # 0.4-0.5/h on the other two members, and was the only member
          # kubelet restarted. It took SIGTERM at 12:29:08 and shut down
          # gracefully, so it recorded exitCode 0 "Completed" and read as a
          # clean exit rather than the probe kill it actually was.
          # 6 gives 60s, clearing one full tilt window with margin.
          # Restarting a Sentinel is worse than waiting through a tilt: it
          # drops its runtime view of peers and replicas and must rediscover
          # them, which is a quorum risk at exactly the moment the fleet is
          # already unhappy.
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: sentinel
        ports:
        - containerPort: 26380
          name: sentinel-tls
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --cert
            - /etc/valkey/tls/tls.crt
            - --key
            - /etc/valkey/tls/tls.key
            - --sni
            - valkey.cache.svc.cluster.local
            - ping
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        startupProbe:
          exec:
            command:
            - valkey-cli
            - -p
            - "26380"
            - --tls
            - --cacert
            - /etc/valkey/tls/ca.crt
            - --cert
            - /etc/valkey/tls/tls.crt
            - --key
            - /etc/valkey/tls/tls.key
            - --sni
            - valkey.cache.svc.cluster.local
            - ping
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 3
        resources:
          limits:
            # Raised 250m -> 1. Both probes are exec probes that fork a full
            # valkey-cli and complete a client-certificate mTLS handshake,
            # readiness every 5s and liveness every 10s. That cost is bursty,
            # and CFS grants a 250m container only 25ms of every 100ms
            # period, so a handshake needing more stalls into the next period
            # and drags the event loop with it -- which is what tilt reports.
            # Measured 2026-08-20, nr_throttled/nr_periods on all three
            # members: 8.78% / 8.31% / 7.77%. Every Sentinel here is
            # throttled ~8% of periods, node-1 no worse than the others, so
            # throttling is NOT what makes node-1 different. It is still a
            # standing event-loop hazard for all three and cheap to remove.
            cpu: '1'
            memory: 64Mi
          requests:
            # TLS health checks use 25-40m steadily. A 50m request left
            # almost nothing above that for the handshake burst; 100m keeps
            # the guaranteed share above measured idle without inflating the
            # scheduler footprint. The limit is only reached by the bursts.
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /etc/valkey/tls
          name: valkey-tls
          readOnly: true
      # Valkey and Sentinel listen on the node's own addresses (6380/26380).
      # config-init resolves the Sentinel Service and every member announces a
      # cluster DNS name, so the pods still need cluster DNS.
      restartPolicy: Always
      # No role tolerations: Valkey belongs on the untainted application tier
      # (cp1 carries no taint on this cluster either, so it is schedulable
      # too, but anti-affinity below still keeps at most one member per node).
      schedulerName: default-scheduler
      nodeSelector:
        role: node
      # Inert with replicas: 1 (nothing to conflict with), kept so scaling to
      # 3 spreads members one-per-node without an extra edit.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: node
                app.kubernetes.io/instance: valkey
                app.kubernetes.io/name: valkey
            topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: node
            app.kubernetes.io/instance: valkey
            app.kubernetes.io/name: valkey
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: users-secret
        secret:
          defaultMode: 256
          secretName: valkey-users-secret
      - configMap:
          defaultMode: 420
          name: valkey-config
        name: valkey-config
      - name: valkey-tls
        secret:
          defaultMode: 288
          secretName: valkey-server-tls
      # Valkey storage is EPHEMERAL, deliberately. No volumeClaimTemplates.
      # A local-path PVC binds its PV to the node that provisioned it, so a
      # member whose node dies cannot be rescheduled. Losing a member's volume
      # is cheap here: replication rebuilds a replica from the primary, and
      # the whole dataset is derived state (projections, timers) that other
      # services rebuild on their own. The init script already regenerates
      # valkey.conf and sentinel.conf on every boot from Sentinel discovery
      # rather than reading them back off disk, so an empty /data is the path
      # it is written for.
      - name: valkey-data
        emptyDir:
          sizeLimit: 8Gi
  updateStrategy:
    type: RollingUpdate
