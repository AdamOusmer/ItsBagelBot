# Doppler-managed secrets for Valkey. The operator syncs these from Doppler
# into the named k8s Secrets every resyncSeconds; valkey.yaml carries the
# secrets.doppler.com/reload annotation so the StatefulSet is rolled on
# change.
#
# DEPENDENCY: infra-valkey-core-doppler-token / infra-valkey-users-doppler-
# token do not exist in the `cache` namespace on this cluster yet (Doppler
# operator token provisioning for the new namespace layout is in progress in
# parallel). Until they land, these two DopplerSecrets stay unresolved and
# valkey-core-secret / valkey-users-secret are never created, so the
# StatefulSet pod sits in CreateContainerConfigError. Everything else in this
# directory (Certificates, Services, PDB, ConfigMap) applies cleanly without
# them.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: doppler-valkey-core
  namespace: cache
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: infra-valkey-core-doppler-token
  managedSecret:
    name: valkey-core-secret
    namespace: cache
    type: Opaque
  processors:
    VALKEY_CORE_PASSWORD:
      asName: valkey-password
      type: plain
  resyncSeconds: 60
  verifyTLS: true
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: doppler-valkey-users
  namespace: cache
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: infra-valkey-users-doppler-token
  managedSecret:
    name: valkey-users-secret
    namespace: cache
    type: Opaque
  processors:
    VALKEY_USERS_ACL:
      asName: users.acl
      type: plain
  resyncSeconds: 60
  verifyTLS: true
---
# gossip-warp-env backs the Cloudflare WARP sidecar in deploy/k8s/gossip.yaml.
# It lives beside the gossip workload (namespace app) and reuses gossip's
# existing operator token — the same pattern as the gossip-env DopplerSecret
# declared in gossip.yaml itself, kept here because this file is where the
# processors/asName rename convention lives.
#
# DEPENDENCY: WARP_ENROLL_TOKEN must exist in Doppler under the gossip
# project/config (Zero Trust service token for one seat per replica, free
# tier). Until it is provisioned this DopplerSecret stays unresolved and the
# sidecar sits in CreateContainerConfigError; gossip itself still boots and
# serves every trusted provider — only user-defined fetches fail closed.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: doppler-gossip-warp
  namespace: app
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: gossip-doppler-token
  managedSecret:
    name: gossip-warp-env
    namespace: app
    type: Opaque
  processors:
    WARP_ENROLL_TOKEN:
      asName: WARP_ENROLL_TOKEN
      type: plain
  resyncSeconds: 60
  verifyTLS: true
