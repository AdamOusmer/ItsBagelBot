port 0
# Sentinel clients, primary monitoring, and Sentinel-to-Sentinel gossip use
# native TLS on 26380. Plaintext is disabled.
tls-port 26380
tls-cert-file /etc/valkey/tls/tls.crt
tls-key-file /etc/valkey/tls/tls.key
tls-ca-cert-file /etc/valkey/tls/ca.crt
# Full mTLS, mirrors valkey.conf: no bare handshake is accepted, and this same
# cert/key pair is what Sentinel presents outbound (to the monitored primary
# and to peer Sentinels) since no distinct tls-client-cert-file is set.
tls-auth-clients yes
tls-replication yes
# Monitor the primary by its stable StatefulSet DNS name. Replication,
# Sentinel gossip, failover and clients all address members through that
# name, so the topology survives rescheduling.
# The actual "sentinel monitor" line is appended dynamically at cold-start
# (see valkey.yaml config-init) with the live or seeding member's stable pod
# DNS name -- no static placeholder here, or sentinel fatals on duplicate.
sentinel down-after-milliseconds myprimary 5000
sentinel failover-timeout myprimary 60000
sentinel parallel-syncs myprimary 1
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
