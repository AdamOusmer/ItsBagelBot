port 0
tls-port 6380
tls-cert-file /etc/valkey/tls/tls.crt
tls-key-file /etc/valkey/tls/tls.key
tls-ca-cert-file /etc/valkey/tls/ca.crt
tls-auth-clients yes
tls-replication yes
bind 0.0.0.0
cluster-enabled no
replica-read-only yes
loglevel notice
io-threads 2
# volatile-lru evicts only TTL keys; an allkeys-* policy would evict durable keys.
maxmemory 512mb
maxmemory-policy volatile-lru
rename-command FLUSHDB ""
rename-command FLUSHALL ""
aclfile /secrets/users/users.acl
unixsocket /data/valkey.sock
unixsocketperm 700
include /config/tuning.conf
