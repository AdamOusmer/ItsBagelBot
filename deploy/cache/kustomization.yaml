apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cache

resources:
  - certificates.yaml
  - dopplersecrets.yaml
  - valkey.yaml

# Base config is generated with a content hash so any edit rolls the
# StatefulSet (kustomize rewrites the volume reference to the hashed name).
configMapGenerator:
  - name: valkey-config
    files:
      - config/sentinel.conf
      - config/tuning.conf
      - config/valkey.conf
