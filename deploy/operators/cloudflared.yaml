# noTLSVerify stays false: the hop to traefik is verified against the Origin root pinned below.
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: cloudflared-tunnel
  namespace: operators
spec:
  host: https://api.doppler.com
  tokenSecret:
    name: cloudflared-doppler-token
  managedSecret:
    name: cloudflared-tunnel
    namespace: operators
    type: Opaque
  secrets:
    - TUNNEL_CREDENTIALS_JSON
  resyncSeconds: 60
---
