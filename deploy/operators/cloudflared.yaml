apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: operators
data:
  config.yaml: |
    tunnel: 9c03c6e3-8a04-4f6c-bd48-7403a80da483
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # Applies to every ingress rule below. caPool pins the Cloudflare Origin
    # RSA root, so the connector only talks to an origin holding a Cloudflare
    # Origin CA cert. originServerName forces SNI to the zone apex instead of
    # the request hostname: the apex is always in the cert's SANs, so routing
    # never depends on which public hostnames exist.
    originRequest:
      caPool: /etc/cloudflared/trust/ca.pem
      originServerName: itsbagelbot.com
      noTLSVerify: false
      http2Origin: true
      connectTimeout: 10s
      tlsTimeout: 10s
      keepAliveConnections: 32
      keepAliveTimeout: 90s

    ingress:
      # Console (SvelteKit SSR). The app's /status, /healthz, /readyz are
      # masked at the traefik layer (console-dashboard.yaml routes them to
      # the app's own 404 page), not here: a tunnel-level http_status:404
      # would answer with a bare edge error instead of the branded page.
      - hostname: dashboard.itsbagelbot.com
      - hostname: dashboard.itsbagelbot.com
        service: https://traefik.networking.svc.cluster.local:443

      # Public stats page (SSE odometer).
      - hostname: stats.itsbagelbot.com
        service: https://traefik.networking.svc.cluster.local:443

      # Per-service /status endpoints for the Better Stack status page live
      # here (deploy/k8s/status-routes.yaml). status.itsbagelbot.com itself
      # is the Better Stack-hosted status page: its DNS is a CNAME to Better
      # Stack, so the tunnel must not claim the hostname, and it is
      # deliberately absent from this list. It must also not fall into the
      # wildcard below: the CNAME at Cloudflare DNS takes precedence over
      # the wildcard record.
      - hostname: health.itsbagelbot.com
        service: https://traefik.networking.svc.cluster.local:443

      # Tebex webhooks -> transactions.
      - hostname: webhooks.itsbagelbot.com
        service: https://traefik.networking.svc.cluster.local:443

      # Apex + everything else on the zone. Traefik owns the routing decision;
      # its unrouted-host fallback proxies stray hostnames to the marketing
      # site, so unknown names never 404 at the connector.
      - hostname: itsbagelbot.com
        service: https://traefik.networking.svc.cluster.local:443
      - hostname: "*.itsbagelbot.com"
        service: https://traefik.networking.svc.cluster.local:443

      # Required terminal rule.
      - service: http_status:404
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: operators
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudflared
  namespace: operators
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
      annotations:
        secrets.doppler.com/reload: "true"
    spec:
      # Must stay a subset of traefik's nodes: traefik's Service is internalTrafficPolicy Local.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: NotIn
                    values: [cp]
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
          imagePullPolicy: IfNotPresent
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared/config, readOnly: true}
            - {name: creds, mountPath: /etc/cloudflared/creds, readOnly: true}
            - {name: trust, mountPath: /etc/cloudflared/trust, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-tunnel
            items:
              - {key: TUNNEL_CREDENTIALS_JSON, path: credentials.json}
        - name: trust
          configMap:
            name: cloudflare-origin-ca
            items:
              - {key: ca.pem, path: ca.pem}
