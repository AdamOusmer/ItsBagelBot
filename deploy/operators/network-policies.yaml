# Port-scoped, not IP-pinned: Doppler's API and the tunnel edge move between Cloudflare addresses without notice.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: doppler-operator
  namespace: operators
  labels:
    netpol-stage: doppler
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16]
      ports:
        - port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: doppler-operator-apiserver
  namespace: operators
  labels:
    netpol-stage: doppler
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared
  namespace: operators
  labels:
    netpol-stage: cloudflared
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16]
      ports:
        - port: 2000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8443
    - ports:
        - {port: 7844, protocol: UDP}
        - {port: 7844, protocol: TCP}
        - {port: 443, protocol: TCP}
