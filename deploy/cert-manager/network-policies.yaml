apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cert-manager
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16]
      ports:
        - port: 9403
        - port: 6080
        - port: 6060
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# Both webhooks fail closed: losing apiserver ingress blocks every Certificate and Bundle write.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apiserver
  namespace: cert-manager
spec:
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "10250", protocol: TCP}
            - {port: "6443", protocol: TCP}
