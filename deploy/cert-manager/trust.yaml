---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: fleet-ca
spec:
  sources:
    - secret:
        name: fleet-ca-key-pair
        key: tls.crt
  target:
    configMap:
      key: ca.pem
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [app, cache, db, messaging, networking, observability, operators]
---
# Intermediate only: adding the root would let any leaf the root issued pass mTLS verify.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: fleet-intermediate-ca
spec:
  sources:
    - secret:
        name: fleet-intermediate-key-pair
        key: tls.crt
  target:
    configMap:
      key: ca.pem
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [cache, messaging]
