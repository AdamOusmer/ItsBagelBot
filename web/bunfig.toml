# Hoisted (flat) node_modules so a production image can ship a self-contained
# node_modules by copying the workspace root. Bun's default isolated linker puts
# deps in node_modules/.bun and symlinks them per-workspace, which does not
# survive a cross-stage container COPY (adapter-node leaves nats external and
# resolves them from node_modules at runtime).
#
# Do not set optional = false. vite/rolldown/lightningcss ship their platform
# bindings as optionalDependencies; `bun run build` needs those. New Relic's
# optional Node/V8 addons are stripped after the console production install
# (web/kit/scripts/strip-newrelic-node-addons.ts) instead — bun dlopens a
# present .node and aborts, which is how v0.2.2-beta 502'd dashboard.
[install]
linker = "hoisted"
